name: 3dimageapp private CI

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch/tag/SHA in Persie0/3dimageapp
        required: true
        default: main
        type: string

permissions:
  contents: read

env:
  APP_REPOSITORY: Persie0/3dimageapp
  APP_REF: ${{ inputs.ref || '96c94228298a73c0f58115b132809b00479c4286' }}

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      SCENE3D_PUBLIC_RECEIPT_SHA: ${{ github.sha }}
    steps:
      - name: Validate private checkout token
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: test -n "$PRIVATE_TOKEN"
      - name: Checkout private app revision
        uses: actions/checkout@v5
        with:
          repository: ${{ env.APP_REPOSITORY }}
          ref: ${{ env.APP_REF }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: private-app
      - name: Checkout private CI harness
        uses: actions/checkout@v5
        with:
          repository: ${{ env.APP_REPOSITORY }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          ref: ${{ env.APP_REF }}
          path: private-ci
          sparse-checkout: .github/playground
          sparse-checkout-cone-mode: false
      - name: Run private core harness
        run: bash private-ci/.github/playground/test-core.sh private-app

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Validate private checkout token
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: test -n "$PRIVATE_TOKEN"
      - name: Checkout private app revision
        uses: actions/checkout@v5
        with:
          repository: ${{ env.APP_REPOSITORY }}
          ref: ${{ env.APP_REF }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: private-app
      - name: Checkout private CI harness
        uses: actions/checkout@v5
        with:
          repository: ${{ env.APP_REPOSITORY }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          ref: ${{ env.APP_REF }}
          path: private-ci
          sparse-checkout: .github/playground
          sparse-checkout-cone-mode: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Locate hosted Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -perm -u+x 2>/dev/null | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
      - name: Install Android SDK platform and select a valid preinstalled NDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1" >/dev/null
          select_ndk() {
            local candidate
            while IFS= read -r candidate; do
              if [[ -f "$candidate/source.properties" && \
                    -x "$candidate/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++" ]]; then
                echo "${candidate##*/}"
                return 0
              fi
            done < <(find "$ANDROID_SDK_ROOT/ndk" -mindepth 1 -maxdepth 1 \
                       -type d 2>/dev/null | sort -Vr)
            return 1
          }
          if ! ndk_version="$(select_ndk)"; then
            echo "::warning::No valid preinstalled NDK found; downloading once."
            sdkmanager "ndk;28.2.13676358" >/dev/null
            ndk_version="$(select_ndk)"
          fi
          test -n "$ndk_version"
          echo "SCENE3D_NDK_VERSION=$ndk_version" >> "$GITHUB_ENV"
          echo "Using validated Android NDK $ndk_version"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Run private Android harness
        run: bash private-ci/.github/playground/test-android.sh private-app
      - name: Summarize Android failure without dumping private source
        if: ${{ failure() }}
        shell: bash
        run: |
          gradle -p private-app/android :app:testDebugUnitTest --console plain > "$RUNNER_TEMP/scene3d-gradle.log" 2>&1 || true
          grep -E '(^> Task .*FAILED|FAILURE:|Execution failed|^\* What went wrong:|error:|\.java:[0-9]+:|[0-9]+ tests? completed|There were failing tests|> [A-Za-z0-9._]+ > .*FAILED|Could not |^Caused by:)' "$RUNNER_TEMP/scene3d-gradle.log" | tail -n 55 || true
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET
          for path in glob.glob("private-app/android/app/build/test-results/testDebugUnitTest/TEST-*.xml"):
              try:
                  root = ET.parse(path).getroot()
              except Exception:
                  continue
              for case in root.iter("testcase"):
                  failure = case.find("failure")
                  if failure is not None:
                      print("FAIL:", case.get("classname"), case.get("name"),
                            (failure.get("message") or "").replace("\\n", " ")[:300])
          PY

  ios:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Validate private checkout token
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: test -n "$PRIVATE_TOKEN"
      - name: Checkout private app revision
        uses: actions/checkout@v5
        with:
          repository: ${{ env.APP_REPOSITORY }}
          ref: ${{ env.APP_REF }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: private-app
      - name: Checkout private CI harness
        uses: actions/checkout@v5
        with:
          repository: ${{ env.APP_REPOSITORY }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          ref: ${{ env.APP_REF }}
          path: private-ci
          sparse-checkout: .github/playground
          sparse-checkout-cone-mode: false
      - name: Install XcodeGen
        run: brew install xcodegen >/dev/null
      - name: Run private iOS harness
        run: bash private-ci/.github/playground/test-ios.sh private-app

  report:
    if: ${{ always() }}
    needs: [core, android, ios]
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Publish a compact CI receipt on the public Playground commit
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.sha }}
          CORE_RESULT: ${{ needs.core.result }}
          ANDROID_RESULT: ${{ needs.android.result }}
          IOS_RESULT: ${{ needs.ios.result }}
        shell: bash
        run: |
          for component in core android ios; do
            case "$component" in
              core) result="$CORE_RESULT";;
              android) result="$ANDROID_RESULT";;
              ios) result="$IOS_RESULT";;
            esac
            state=success
            if [[ "$result" != success ]]; then state=failure; fi
            jq -n --arg state "$state" --arg desc "$component=$result" \
                --arg context "scene3d/$component" \
                '{state:$state,description:$desc,context:$context}' > "$RUNNER_TEMP/scene3d-status.json"
            curl --fail --silent --show-error -X POST \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                --data-binary @"$RUNNER_TEMP/scene3d-status.json" \
                "https://api.github.com/repos/Persie0/Playground/statuses/$COMMIT_SHA" >/dev/null
            echo "$component=$result ($state)"
          done
