# Runs real-device-style Android 16 (API 36) Emulator E2E verification for ActionMerge.
#
# Source of truth: tools/ci/actionmerge-android16-e2e.yml in oskar14156/actionmerge; mirrored to
# oskar14156/Playground/.github/workflows/actionmerge-android16-e2e.yml alongside
# .github/scripts/actionmerge-e2e-driver.sh.
name: ActionMerge Android 16 E2E

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit SHA or branch of oskar14156/actionmerge
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: actionmerge-android16-e2e
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out ActionMerge repository
        uses: actions/checkout@v4
        with:
          repository: oskar14156/actionmerge
          ref: ${{ inputs.ref }}
          token: ${{ secrets.CI_BRIDGE_READ_TOKEN }}
          path: app
          persist-credentials: false

      - name: Check out Playground CI scripts
        uses: actions/checkout@v4
        with:
          path: ci
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK 36, NDK 27 & ffmpeg
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.1.12297006" "platforms;android-36" "build-tools;36.0.0" > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Enable KVM for Android Emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install dependencies & run quality checks
        working-directory: app
        run: |
          npm ci --include=dev --no-audit --no-fund
          npm run quality

      - name: Generate Android native project
        working-directory: app
        env:
          NODE_ENV: production
          EXPO_PUBLIC_REVENUECAT_RELEASE_BUILD: 'true'
          EXPO_PUBLIC_REVENUECAT_USE_TEST_STORE: 'false'
        run: npx expo prebuild --platform android --no-install

      - name: Run Kotlin unit tests & build x86_64 release-runtime APK
        working-directory: app/android
        env:
          NODE_ENV: production
          SENTRY_DISABLE_AUTO_UPLOAD: 'true'
          EXPO_PUBLIC_REVENUECAT_RELEASE_BUILD: 'true'
          EXPO_PUBLIC_REVENUECAT_USE_TEST_STORE: 'false'
        run: |
          ./gradlew :action-merge-engine:testDebugUnitTest --no-daemon
          ./gradlew assembleRelease \
            -PreactNativeArchitectures=x86_64 \
            -PACTIONMERGE_UPLOAD_STORE_FILE=debug.keystore \
            -PACTIONMERGE_UPLOAD_STORE_PASSWORD=android \
            -PACTIONMERGE_UPLOAD_KEY_ALIAS=androiddebugkey \
            -PACTIONMERGE_UPLOAD_KEY_PASSWORD=android \
            --no-daemon

      - name: Boot Android 16 (API 36) Pixel 6 emulator & run E2E flow
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disk-size: 6144M
          heap-size: 512M
          ram-size: 3072M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: bash ci/.github/scripts/actionmerge-e2e-driver.sh app/android/app/build/outputs/apk/release/app-release.apk

      - name: Upload E2E failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: actionmerge-e2e-failure-diagnostics
          path: e2e-artifacts/
          if-no-files-found: ignore
          retention-days: 3

      - name: Clean up private checkout
        if: always()
        run: rm -rf app
