name: AnkiFlutter Card Info Rust

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  card-info-rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Read target
        id: target
        run: echo "sha=$(tr -d '\r\n' < ankiflutter-card-info-rust-target.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        with:
          repository: Persie0/AnkiFlutter
          ref: ${{ steps.target.outputs.sha }}
          path: source
          submodules: recursive
      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
      - name: Use Rust 1.88
        working-directory: source
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup override set 1.88.0
          python3 tool/prepare_bridge_lock.py
      - name: Run Card Info bridge test
        working-directory: source
        run: cargo test --manifest-path native/anki_bridge/Cargo.toml extended_operation_ids_map_to_the_pinned_backend_descriptors
