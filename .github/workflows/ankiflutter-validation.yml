# rerun: reviewer own voice platform follow-up matrix a1a091a
name: AnkiFlutter validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ankiflutter-validation
  cancel-in-progress: true

jobs:
  quality-linux-android:
    runs-on: ubuntu-latest
    steps:
      - name: Read validation target
        id: target
        uses: actions/checkout@v6
      - id: ref
        name: Resolve AnkiFlutter commit
        shell: bash
        run: echo "sha=$(tr -d '\r\n' < ankiflutter-validation-target.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        with:
          repository: Persie0/AnkiFlutter
          ref: ${{ steps.ref.outputs.sha }}
          path: source
          submodules: recursive
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - name: Use Rust 1.88
        working-directory: source
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup component add rustfmt clippy --toolchain 1.88.0
          rustup override set 1.88.0
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            source/native/anki_bridge/target
          key: ankiflutter-rust-1.88-${{ runner.os }}-${{ steps.ref.outputs.sha }}
          restore-keys: |
            ankiflutter-rust-1.88-${{ runner.os }}-
      - name: Install Linux, protoc, Android, and Reviewer audio dependencies
        working-directory: source
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev xvfb protobuf-compiler pulseaudio-utils ffmpeg
          rustup target add --toolchain 1.88.0 aarch64-linux-android x86_64-linux-android
          cargo install cargo-ndk --version 4.1.2 --locked
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358"
      - name: Install Dart protoc plugin
        run: |
          dart pub global activate protoc_plugin 25.1.0
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
      - name: Generate and verify Dart protos
        working-directory: source
        run: |
          python3 tool/generate_dart_protos.py
          python3 tool/verify_generated_protos.py
      - name: Seed bridge lockfile
        working-directory: source
        run: python3 tool/prepare_bridge_lock.py
      - name: Check Rust formatting
        working-directory: source
        run: cargo fmt --manifest-path native/anki_bridge/Cargo.toml --check
      - name: Lint Rust bridge
        working-directory: source
        run: cargo clippy --manifest-path native/anki_bridge/Cargo.toml --all-targets -- -D warnings
      - name: Test Rust bridge
        working-directory: source
        run: cargo test --manifest-path native/anki_bridge/Cargo.toml
      - name: Resolve Flutter dependencies
        working-directory: source/app
        run: flutter pub get --enforce-lockfile
      - name: Analyze Flutter app
        working-directory: source/app
        run: flutter analyze
      - name: Test Flutter app
        working-directory: source/app
        run: flutter test
      - name: Build Linux bridge and app
        working-directory: source
        run: |
          cargo build --release --manifest-path native/anki_bridge/Cargo.toml
          cd app
          flutter build linux
      - name: Build Android APK
        working-directory: source/app
        run: flutter build apk --debug
      - name: Real backend integration
        working-directory: source
        run: xvfb-run -a python3 tool/run_desktop_dev.py --test

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - id: ref
        name: Resolve AnkiFlutter commit
        shell: bash
        run: echo "sha=$(tr -d '\r\n' < ankiflutter-validation-target.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        with:
          repository: Persie0/AnkiFlutter
          ref: ${{ steps.ref.outputs.sha }}
          path: source
          submodules: recursive
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - name: Install protobuf compiler
        run: brew install protobuf
      - name: Use Rust 1.88 and iOS simulator target
        working-directory: source
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0
          rustup target add aarch64-apple-ios-sim
          python3 tool/prepare_bridge_lock.py
      - name: Build iOS bridge
        working-directory: source
        run: |
          cargo check --manifest-path native/anki_bridge_ios/Cargo.toml --target aarch64-apple-ios-sim --locked
          CC=clang CXX=clang++ cargo build --release --manifest-path native/anki_bridge_ios/Cargo.toml --target aarch64-apple-ios-sim --locked
      - name: Resolve Flutter dependencies
        working-directory: source/app
        run: flutter pub get --enforce-lockfile
      - name: Build iOS simulator app
        working-directory: source/app
        run: flutter build ios --simulator --no-codesign

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - id: ref
        name: Resolve AnkiFlutter commit
        shell: bash
        run: echo "sha=$(tr -d '\r\n' < ankiflutter-validation-target.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        with:
          repository: Persie0/AnkiFlutter
          ref: ${{ steps.ref.outputs.sha }}
          path: source
          submodules: recursive
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - name: Install protobuf compiler
        run: brew install protobuf
      - name: Use Rust 1.88
        working-directory: source
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0
          python3 tool/prepare_bridge_lock.py
      - name: Build macOS bridge
        working-directory: source
        run: cargo build --release --manifest-path native/anki_bridge/Cargo.toml --locked
      - name: Resolve Flutter dependencies and build macOS
        working-directory: source/app
        run: |
          flutter pub get --enforce-lockfile
          flutter build macos --release

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - id: ref
        name: Resolve AnkiFlutter commit
        shell: pwsh
        run: "Add-Content -Path $env:GITHUB_OUTPUT -Value ('sha=' + (Get-Content ankiflutter-validation-target.txt -Raw).Trim())"
      - uses: actions/checkout@v6
        with:
          repository: Persie0/AnkiFlutter
          ref: ${{ steps.ref.outputs.sha }}
          path: source
          submodules: recursive
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - name: Install protobuf compiler
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Use Rust 1.88
        working-directory: source
        shell: pwsh
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0
          python3 tool/prepare_bridge_lock.py
      - name: Build Windows bridge
        working-directory: source
        run: cargo build --release --manifest-path native/anki_bridge/Cargo.toml --locked
      - name: Resolve Flutter dependencies and build Windows
        working-directory: source/app
        run: |
          flutter pub get --enforce-lockfile
          flutter build windows --release
