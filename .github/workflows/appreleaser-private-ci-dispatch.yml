name: AppReleaser - Dispatch Existing Public Linux CI

on:
  push:
    branches: [ci/run/appreleaser-lock-bootstrap-20261015]
    paths:
      - .github/workflows/appreleaser-private-ci-dispatch.yml

permissions:
  actions: write

jobs:
  dispatch-existing-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Start existing universal runner on the PRIVATE AppReleaser ref
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run universal-ci-runner.yml --repo oskar14156/Playground --ref main \
            -f repository=oskar14156/appreleaser \
            -f ref=ci/run/google-catalog-identity-20261015 \
            -f test_command=auto \
            -f install_command=auto \
            -f quiet=true \
            -f runner_os=ubuntu-latest
          echo "Dispatched native PUBLIC runner; private code stays in ephemeral workspace."
