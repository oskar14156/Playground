name: AudioBooster Flutter checks
# TDD red/green gate for the AudioBooster simplified Play audio flow.
on:
  workflow_dispatch:
    inputs:
      audio_ref:
        description: AudioBooster branch, tag, or commit to validate
        required: false
        default: simplify-play-audio-flow
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Check out Playground
        uses: actions/checkout@v4
      - name: Check out AudioBooster
        uses: actions/checkout@v4
        with:
          repository: Persie0/Audiobooster
          ref: ${{ inputs.audio_ref || 'simplify-play-audio-flow' }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          path: audiobooster
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: audiobooster-gradle-${{ runner.os }}-v2
      - name: Show Flutter version
        run: flutter --version
      - name: Install Flutter dependencies
        working-directory: audiobooster
        run: flutter pub get
      - name: Run Flutter tests
        working-directory: audiobooster
        run: flutter test
      - name: Analyze Dart sources
        working-directory: audiobooster
        run: flutter analyze
      - name: Bootstrap Android host twice
        working-directory: audiobooster
        run: |
          bash tool/bootstrap_android.sh
          bash tool/bootstrap_android.sh
      - name: Verify bootstrap idempotence
        working-directory: audiobooster
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          manifest_path = Path('android/app/src/main/AndroidManifest.xml')
          root = ET.parse(manifest_path).getroot()
          android_name = '{http://schemas.android.com/apk/res/android}name'
          permissions = [node.get(android_name) for node in root.findall('uses-permission')]
          services = [node.get(android_name) for node in root.findall('./application/service')]
          for permission in [
              'android.permission.MODIFY_AUDIO_SETTINGS',
              'android.permission.FOREGROUND_SERVICE',
              'android.permission.FOREGROUND_SERVICE_SPECIAL_USE',
          ]:
              count = permissions.count(permission)
              if count != 1:
                  raise SystemExit(f'{permission}: expected exactly once, found {count}')
          for permission in [
              'android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION',
              'android.permission.DUMP',
              'android.permission.RECORD_AUDIO',
          ]:
              count = permissions.count(permission)
              if count != 0:
                  raise SystemExit(f'{permission}: expected absent, found {count}')
          for service in [
              'com.persie0.audiobooster.audio.AudioBoostService',
          ]:
              count = services.count(service)
              if count != 1:
                  raise SystemExit(f'{service}: expected exactly once, found {count}')
          if 'com.persie0.audiobooster.audio.MediaNotificationListenerService' in services:
              raise SystemExit('MediaNotificationListenerService must be absent')
          gradle_path = Path('android/app/build.gradle.kts')
          if not gradle_path.exists():
              gradle_path = Path('android/app/build.gradle')
          gradle = gradle_path.read_text()
          for needle in [
              'junit:junit:4.13.2',
              'androidx.test:runner:1.6.2',
              'androidx.test.ext:junit:1.2.1',
              'androidx.test.runner.AndroidJUnitRunner',
          ]:
              count = gradle.count(needle)
              if count != 1:
                  raise SystemExit(f'{needle}: expected exactly once, found {count}')
          PY
      - name: Run Android unit tests and compile instrumentation tests
        working-directory: audiobooster/android
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebugAndroidTest
      - name: Build debug APK
        working-directory: audiobooster
        run: flutter build apk --debug
      - name: Build tester release APK
        working-directory: audiobooster
        run: flutter build apk --release
      - name: Prepare device-test and tester-release APKs
        working-directory: audiobooster
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p device-test-out tester-release-out
          cp build/app/outputs/flutter-apk/app-debug.apk device-test-out/app-debug.apk
          cp build/app/outputs/flutter-apk/app-release.apk device-test-out/app-release.apk
          cp build/app/outputs/flutter-apk/app-release.apk tester-release-out/AudioBooster-tester-release.apk
          TEST_APK="$(find build android -type f -name '*androidTest*.apk' | head -n1)"
          if [ -z "$TEST_APK" ] || [ ! -f "$TEST_APK" ]; then
            echo '::error::Instrumentation APK was not produced.'
            find build android -type f -name '*.apk' -print || true
            exit 1
          fi
          cp "$TEST_APK" device-test-out/app-debug-androidTest.apk
          sha256sum tester-release-out/AudioBooster-tester-release.apk | tee tester-release-out/SHA256SUMS.txt
          ls -lh device-test-out tester-release-out
      - name: Upload device-test APKs
        uses: actions/upload-artifact@v4
        with:
          name: audiobooster-device-tests
          path: audiobooster/device-test-out/*.apk
          if-no-files-found: error
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: audiobooster-modern-debug-apk
          path: audiobooster/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
      - name: Upload tester release APK
        uses: actions/upload-artifact@v4
        with:
          name: audiobooster-tester-release-apk
          path: audiobooster/tester-release-out/*
          if-no-files-found: error
          retention-days: 90

  emulator-validation:
    needs: test-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api: [29, 34, 35]
    steps:
      - name: Download device-test APKs
        uses: actions/download-artifact@v4
        with:
          name: audiobooster-device-tests
          path: device-test
      - name: Enable KVM acceleration
        shell: bash
        run: |
          set -euo pipefail
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          else
            echo '::warning::/dev/kvm is unavailable; emulator runner will fall back to software emulation.'
          fi
      - name: Validate debug engine and release startup on Android ${{ matrix.api }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r device-test/app-debug.apk
            adb install -r device-test/app-debug-androidTest.apk
            echo '=== Android / audio route inventory ==='
            adb shell getprop ro.build.version.release
            adb shell dumpsys audio | grep -E 'STREAM_MUSIC|DevicesForAttributes|mCommunicationDevice' | head -n 80 || true
            adb shell am instrument -w -r com.persie0.audiobooster.test/androidx.test.runner.AndroidJUnitRunner > /tmp/instrumentation.txt 2>&1 || true
            cat /tmp/instrumentation.txt
            test "$(grep -Ec 'Process crashed|FAILURES!!!|shortMsg=' /tmp/instrumentation.txt)" -eq 0
            grep -Eq 'OK \(3 tests\)' /tmp/instrumentation.txt
            adb uninstall com.persie0.audiobooster.test || true
            adb uninstall com.persie0.audiobooster || true
            adb install -r device-test/app-release.apk
            adb logcat -c
            adb shell am start -W -n com.persie0.audiobooster/.MainActivity > /tmp/release-start.txt 2>&1 || true
            cat /tmp/release-start.txt
            grep -Eq 'Status: ok|Status: complete' /tmp/release-start.txt
            sleep 3
            adb shell pidof com.persie0.audiobooster > /tmp/release-pid.txt
            cat /tmp/release-pid.txt
            test -s /tmp/release-pid.txt
            adb logcat -d -v threadtime > /tmp/release-logcat.txt || true
            grep -E 'AndroidRuntime|FATAL EXCEPTION|com.persie0.audiobooster' /tmp/release-logcat.txt | tail -n 400 || true
            test "$(grep -Ec 'FATAL EXCEPTION|Process: com.persie0.audiobooster' /tmp/release-logcat.txt)" -eq 0

  firebase-physical-validation:
    needs: test-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
    steps:
      - name: Check Firebase Test Lab credentials
        id: gcp
        shell: bash
        run: |
          if [ -n "$GCP_CREDENTIALS" ]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
            echo 'Firebase Test Lab credentials are configured.'
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'Firebase Test Lab credentials are not configured in Playground; physical-device validation is unavailable here.'
          fi
      - name: Download device-test APKs
        if: steps.gcp.outputs.available == 'true'
        uses: actions/download-artifact@v4
        with:
          name: audiobooster-device-tests
          path: device-test
      - name: Authenticate to Google Cloud
        if: steps.gcp.outputs.available == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
      - name: Set up Cloud SDK
        if: steps.gcp.outputs.available == 'true'
        uses: google-github-actions/setup-gcloud@v2
      - name: Select available physical Android devices
        if: steps.gcp.outputs.available == 'true'
        id: devices
        shell: bash
        run: |
          set -euo pipefail
          gcloud firebase test android models list --format=json > models.json
          python3 - <<'PY'
          import json
          import os
          models = json.load(open('models.json', encoding='utf-8'))
          physical = [m for m in models if str(m.get('form', '')).upper() == 'PHYSICAL']
          preferred = []
          used = set()
          needles = [('google', ('pixel', 'google')), ('samsung', ('samsung', 'galaxy')), ('xiaomi', ('xiaomi', 'redmi', 'poco'))]
          for label, words in needles:
              for model in physical:
                  text = ' '.join(str(model.get(k, '')) for k in ('id', 'name', 'brand', 'manufacturer')).lower()
                  if not any(word in text for word in words):
                      continue
                  versions = [str(v) for v in model.get('supportedVersionIds', [])]
                  compatible = [v for v in versions if v in {'29', '30', '33', '34', '35', '36'}]
                  if not compatible:
                      continue
                  version = sorted(compatible, key=int)[-1]
                  key = (str(model.get('id')), version)
                  if key not in used:
                      preferred.append((label, key[0], version, str(model.get('name', key[0]))))
                      used.add(key)
                      break
          if not preferred:
              for model in physical:
                  versions = [str(v) for v in model.get('supportedVersionIds', [])]
                  compatible = [v for v in versions if v in {'29', '30', '33', '34', '35', '36'}]
                  if compatible:
                      preferred.append(('physical', str(model.get('id')), sorted(compatible, key=int)[-1], str(model.get('name', model.get('id')))))
                      if len(preferred) == 2:
                          break
          preferred = preferred[:3]
          print('Selected physical devices:')
          for row in preferred:
              print(' | '.join(row))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('matrix=' + ';'.join(f'{model},{version},{label}' for label, model, version, _ in preferred) + '\n')
          PY
      - name: Run Firebase instrumentation tests on physical devices
        if: steps.gcp.outputs.available == 'true' && steps.devices.outputs.matrix != ''
        shell: bash
        run: |
          set -euo pipefail
          IFS=';' read -ra DEVICES <<< "${{ steps.devices.outputs.matrix }}"
          for item in "${DEVICES[@]}"; do
            IFS=',' read -r model version label <<< "$item"
            echo "=== Firebase physical validation: $label / $model / Android API $version ==="
            gcloud firebase test android run \
              --type=instrumentation \
              --app=device-test/app-debug.apk \
              --test=device-test/app-debug-androidTest.apk \
              --device="model=$model,version=$version,locale=en,orientation=portrait" \
              --timeout=8m \
              --no-auto-google-login
          done
      - name: Record unavoidable physical-device limitation
        if: steps.gcp.outputs.available != 'true'
        run: echo 'Physical OEM execution skipped because Playground has no GCP_CREDENTIALS secret; emulator and native regression gates still run.'
