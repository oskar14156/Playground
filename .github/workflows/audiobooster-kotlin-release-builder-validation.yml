name: AudioBooster Kotlin release-builder validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Playground
        uses: actions/checkout@v4

      - name: Checkout AudioBooster exact PR head
        uses: actions/checkout@v4
        with:
          repository: Persie0/Audiobooster
          ref: 0b50d1cadefc13baf1f76a335acf05b983e4b952
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          path: audiobooster

      - name: Checkout release builder exact PR head
        uses: actions/checkout@v4
        with:
          repository: Persie0/firebase_tester_builder
          ref: ab318a0b52396846367599fdbb7f3166d4879949
          path: builder

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK 36
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install API 36
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-36"

      - name: Validate builder workflow tests
        working-directory: builder
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_play*.py'
          grep -q '          - Audiobooster' .github/workflows/play_kotlin_auto.yml
          ! grep -q '          - Audiobooster' .github/workflows/play_auto.yml
          grep -q ':app:testDebugUnitTest :app:lintRelease' .github/workflows/play_kotlin_auto.yml
          grep -q ':app:bundleRelease' .github/workflows/play_kotlin_auto.yml
          grep -q 'verify_r8_min_scores.py' .github/workflows/play_kotlin_auto.yml

      - name: Validate AudioBooster active tree
        working-directory: audiobooster
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -d old/lib
          test -f old/pubspec.yaml
          test ! -f pubspec.yaml
          test ! -d lib
          ! grep -R -n -E 'io\.flutter|dev\.flutter|flutterEmbedding|GeneratedPluginRegistrant' \
            --exclude-dir=old --exclude-dir=.git .

      - name: Test and debug builds
        working-directory: audiobooster
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon \
            :app:testDebugUnitTest \
            :app:assembleDebug \
            :app:assembleDebugAndroidTest \
            --stacktrace

      - name: Release lint
        working-directory: audiobooster
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon :app:lintRelease --stacktrace
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            if [ -f app/build/reports/lint-results-release.txt ]; then
              cat app/build/reports/lint-results-release.txt
            fi
            exit "$status"
          fi

      - name: Build unsigned release AAB
        working-directory: audiobooster
        shell: bash
        run: |
          set -euo pipefail
          if [ -f key.properties ]; then
            mv key.properties key.properties.ci-disabled
          fi
          ./gradlew --no-daemon :app:bundleRelease --stacktrace
          test -f app/build/outputs/bundle/release/app-release.aab

      - name: Enforce shared R8 gate
        shell: bash
        run: |
          set -euo pipefail
          python builder/.github/scripts/verify_r8_min_scores.py \
            audiobooster/app/build/outputs/bundle/release/app-release.aab
