name: AudioBooster native Kotlin checks
# Public validation for the merged native Kotlin app and Kotlin Play release builder.

on:
  workflow_dispatch:
    inputs:
      audio_ref:
        description: AudioBooster branch, tag, or commit to validate
        required: false
        default: release-builder-sdk36
      builder_ref:
        description: firebase_tester_builder branch, tag, or commit to validate
        required: false
        default: kotlin-play-release

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out Playground
        uses: actions/checkout@v4

      - name: Check out AudioBooster
        uses: actions/checkout@v4
        with:
          repository: Persie0/Audiobooster
          ref: ${{ inputs.audio_ref || '250fe844bee70a6403779263fb94a85397dbf9f2' }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          path: audiobooster

      - name: Check out release builder
        uses: actions/checkout@v4
        with:
          repository: Persie0/firebase_tester_builder
          ref: ${{ inputs.builder_ref || 'kotlin-play-release' }}
          path: builder

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 36 SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER=""
          for root in "${ANDROID_HOME:-}" "${ANDROID_SDK_ROOT:-}" /usr/local/lib/android/sdk /opt/android-sdk; do
            [ -n "$root" ] || continue
            candidate="$(find "$root" -type f -name sdkmanager 2>/dev/null | head -n1 || true)"
            if [ -n "$candidate" ]; then
              SDKMANAGER="$candidate"
              break
            fi
          done
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-36"

      - name: Validate builder routing and tests
        working-directory: builder
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_play*.py'
          grep -q '          - Audiobooster' .github/workflows/play_kotlin_auto.yml
          ! grep -q '          - Audiobooster' .github/workflows/play_auto.yml
          grep -q ':app:bundleRelease' .github/workflows/play_kotlin_auto.yml
          grep -q 'verify_r8_min_scores.py' .github/workflows/play_kotlin_auto.yml
          grep -q 'secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN' .github/workflows/play_kotlin_auto.yml

      - name: Validate native-only active tree
        working-directory: audiobooster
        shell: bash
        run: |
          set -euo pipefail
          test -d old/lib
          test -f old/pubspec.yaml
          test ! -f pubspec.yaml
          test ! -d lib
          if grep -R -n -E 'io\.flutter|dev\.flutter|flutterEmbedding|GeneratedPluginRegistrant'               --exclude-dir=old --exclude-dir=.git .; then
            echo '::error::Active project still contains Flutter host references.'
            exit 1
          fi

      - name: Unit tests, lint, and debug builds
        working-directory: audiobooster
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon             :app:testDebugUnitTest             :app:lintRelease             :app:assembleDebug             :app:assembleDebugAndroidTest             --stacktrace

      - name: Build unsigned release AAB
        working-directory: audiobooster
        shell: bash
        run: |
          set -euo pipefail
          if [ -f key.properties ]; then
            mv key.properties key.properties.ci-disabled
          fi
          ./gradlew --no-daemon :app:bundleRelease --stacktrace
          test -f app/build/outputs/bundle/release/app-release.aab

      - name: Enforce builder R8 release gate
        shell: bash
        run: |
          set -euo pipefail
          python builder/.github/scripts/verify_r8_min_scores.py             audiobooster/app/build/outputs/bundle/release/app-release.aab
