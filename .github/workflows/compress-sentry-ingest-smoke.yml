name: Compress Sentry dedicated DSN ingest verification
on:
  push:
    paths:
      - .github/workflows/compress-sentry-ingest-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Read only private Compress public client DSN
        uses: actions/checkout@v4
        with:
          repository: oskar14156/Compress
          ref: feat/android-media3-launch-prep
          token: ${{ secrets.CI_BRIDGE_READ_TOKEN || secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          sparse-checkout: src/lib/sentryConfig.ts
          sparse-checkout-cone-mode: false
          path: private-app
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Send exactly one synthetic error via Sentry HTTP ingest
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          (async () => {
            const config = fs.readFileSync('private-app/src/lib/sentryConfig.ts','utf8');
            const match = config.match(/https:\/\/[a-f0-9]+@o[0-9]+\.ingest\.de\.sentry\.io\/[0-9]+/);
            if (!match) throw new Error('Expected dedicated EU Sentry DSN in private source.');
            const dsn = new URL(match[0]);
            const id = crypto.randomBytes(16).toString('hex');
            const endpoint = `https://${dsn.hostname}/api/${dsn.pathname.slice(1)}/store/?sentry_key=${dsn.username}&sentry_version=7`;
            const payload = {
              event_id: id, timestamp: new Date().toISOString(),
              platform: 'javascript', level: 'error', environment: 'ci-smoke',
              message: 'Compress Sentry ingest connectivity verification',
              tags: {qa_marker:'compress-android-dsn-check'},
            };
            const response = await fetch(endpoint,{
              method:'POST',headers:{'Content-Type':'application/json'},
              body:JSON.stringify(payload),
            });
            if (!response.ok) throw new Error('Sentry ingest rejected synthetic test event (HTTP '+response.status+')');
            console.log('Sentry ingest ACCEPTED synthetic CI event; ID '+id);
            console.log('This proves the DSN ingest endpoint, NOT Android SDK stack traces, sourcemaps or native symbols.');
          })().catch(e => {console.error(e.message);process.exitCode=1;});
          NODE
      - name: Clean private source
        if: always()
        run: rm -rf private-app
