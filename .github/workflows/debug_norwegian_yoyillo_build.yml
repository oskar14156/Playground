name: Build Norwegian Yoyillo Debug APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Validate private repository token
        env:
          REPO_TOKEN: ${{ secrets.GH_RELEASE_TOKEN || secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
        run: test -n "$REPO_TOKEN"

      - name: Checkout Norwegian Yoyillo
        uses: actions/checkout@v5
        with:
          repository: Persie0/norwegian_yoyillo
          token: ${{ secrets.GH_RELEASE_TOKEN || secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          ref: main
          fetch-depth: 1
          persist-credentials: false
          path: app

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve app revision
        id: meta
        shell: bash
        run: |
          SHA="$(git -C app rev-parse HEAD)"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHA:0:8}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Build debug APK
        working-directory: app
        run: flutter build apk --debug

      - name: Stage APK
        shell: bash
        run: cp app/build/app/outputs/flutter-apk/app-debug.apk norwegian-yoyillo-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: norwegian-yoyillo-debug-${{ steps.meta.outputs.short_sha }}
          path: norwegian-yoyillo-debug.apk
          if-no-files-found: error
          retention-days: 14
