name: Build Stem Debug APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-stem-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Validate repository token
        env:
          REPO_TOKEN: ${{ secrets.GH_RELEASE_TOKEN || secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
        run: test -n "$REPO_TOKEN"

      - name: Checkout private Stem
        uses: actions/checkout@v5
        with:
          repository: Persie0/stem
          token: ${{ secrets.GH_RELEASE_TOKEN || secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          ref: main
          fetch-depth: 0
          persist-credentials: false
          path: app

      - name: Checkout private CI harness
        uses: actions/checkout@v5
        with:
          repository: Persie0/stem
          token: ${{ secrets.GH_RELEASE_TOKEN || secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          ref: main
          persist-credentials: false
          path: private-ci
          sparse-checkout: .github/playground
          sparse-checkout-cone-mode: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate hosted Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -perm -u+x 2>/dev/null | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Run private debug build harness
        run: bash private-ci/.github/playground/debug-build.sh app

      - name: Resolve release metadata
        id: meta
        run: |
          SHA="$(git -C app rev-parse HEAD)"
          SHORT_SHA="${SHA:0:8}"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          cp app/build/app/outputs/flutter-apk/app-debug.apk stem-debug.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: stem-debug-arm64-${{ steps.meta.outputs.short_sha }}
          path: stem-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish private Stem debug release
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN || secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          TARGET_SHA: ${{ steps.meta.outputs.sha }}
          SHORT_SHA: ${{ steps.meta.outputs.short_sha }}
        run: |
          TAG="debug-${SHORT_SHA}"
          if gh release view "$TAG" --repo Persie0/stem >/dev/null 2>&1; then
            gh release upload "$TAG" stem-debug.apk --repo Persie0/stem --clobber
          else
            gh release create "$TAG" stem-debug.apk --repo Persie0/stem --target "$TARGET_SHA" --title "stem debug ${SHORT_SHA}" --notes "Private build validation passed for ${TARGET_SHA}." --prerelease
          fi
