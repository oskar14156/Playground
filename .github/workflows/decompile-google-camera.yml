name: Decompile Google Camera 8.8.225

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: google-camera-decompile
  cancel-in-progress: true

jobs:
  decompile:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout Playground
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Download exact Pixel Camera APK from public pho release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p input
          curl -fL --retry 3             "https://github.com/Persie0/decompile/releases/download/pho/com.google.android.GoogleCamera_8.8.225.510547499.09-66251366_minAPI33.arm64-v8a.nodpi._apkmirror.com.apk"             -o input/google-camera-8.8.225.apk

          test -s input/google-camera-8.8.225.apk
          echo "9ca2264cbf5680c8b5b740e53849c1586c53436a7e860616584c0349dba37c47  input/google-camera-8.8.225.apk" | sha256sum -c -
          stat -c '%n %s bytes' input/google-camera-8.8.225.apk

      - name: Download and verify JADX 1.5.6
        run: |
          set -euo pipefail
          curl -fL --retry 3 "https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip" -o jadx.zip
          echo "545ea2be9c242511bc145755cf4bda2485ade42966e096f8b4d3da2a230e8974  jadx.zip" | sha256sum -c -
          mkdir -p .tools/jadx
          unzip -q jadx.zip -d .tools/jadx
          .tools/jadx/bin/jadx --version

      - name: Decompile and deobfuscate
        env:
          JAVA_OPTS: -Xms512m -Xmx5g -XX:+UseG1GC
        shell: bash
        run: |
          set -euo pipefail
          version="8.8.225.510547499.09"
          out="decompiled/google-camera/$version"
          rm -rf "$out"
          mkdir -p "$out"

          set +e
          .tools/jadx/bin/jadx             --threads-count 1             --no-res             --show-bad-code             --deobf             --deobf-cfg-file "$out/$version.jobf"             --deobf-cfg-file-mode overwrite             --deobf-res-name-source auto             --use-source-name-as-class-name-alias if-better             --rename-flags "case,valid,printable"             --comments-level info             --log-level progress             --output-dir "$out"             input/google-camera-8.8.225.apk 2>&1 | tee "$out/jadx.log"
          jadx_exit="${PIPESTATUS[0]}"
          set -e

          source_count="$(find "$out/sources" -type f -name '*.java' 2>/dev/null | wc -l)"
          test "$source_count" -gt 0
          echo "JADX_EXIT=$jadx_exit" >> "$GITHUB_ENV"
          echo "SOURCE_COUNT=$source_count" >> "$GITHUB_ENV"

          if [ "$jadx_exit" -ne 0 ]; then
            echo "::warning::JADX exited with code $jadx_exit but produced $source_count Java files; retaining recoverable output."
          fi
          echo "Recovered $source_count Java files; JADX exit $jadx_exit"

      - name: Write metadata and package source-only output
        shell: bash
        run: |
          set -euo pipefail
          version="8.8.225.510547499.09"
          out="decompiled/google-camera/$version"

          {
            echo "# Pixel Camera $version decompiled sources"
            echo
            echo "Source-only JADX output from the pho release of Persie0/decompile."
            echo
            echo "- Package: com.google.android.GoogleCamera"
            echo "- Version code: 66251366"
            echo "- Input APK SHA-256: 9ca2264cbf5680c8b5b740e53849c1586c53436a7e860616584c0349dba37c47"
            echo "- JADX: 1.5.6"
            echo "- JADX exit code: $JADX_EXIT"
            echo "- Decompiled Java files: $SOURCE_COUNT"
            echo "- Mapping: $version.jobf"
            echo "- Log: jadx.log"
            echo
            echo "JADX automatic deobfuscation was enabled. Original identifiers removed by R8/ProGuard cannot be recovered without Google's original mapping file. Decompiled methods marked with errors are approximate. Android resources are intentionally excluded, matching the existing LingQ source-only workflow."
          } > "$out/README.md"

          mkdir -p package/google-camera
          cp -a "$out" package/google-camera/
          (cd package && zip -qr ../google-camera-8.8.225.510547499.09-jadx-sources.zip google-camera)

          archive_sha="$(sha256sum google-camera-8.8.225.510547499.09-jadx-sources.zip | awk '{print $1}')"
          archive_size="$(stat -c %s google-camera-8.8.225.510547499.09-jadx-sources.zip)"

          {
            echo "## Google Camera decompilation"
            echo
            echo "- Java source files: $SOURCE_COUNT"
            echo "- JADX exit: $JADX_EXIT"
            echo "- Source archive bytes: $archive_size"
            echo "- Source archive SHA-256: $archive_sha"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload decompiled sources
        uses: actions/upload-artifact@v4
        with:
          name: google-camera-8.8.225-jadx-sources
          path: google-camera-8.8.225.510547499.09-jadx-sources.zip
          if-no-files-found: error
          retention-days: 90

      - name: Persist split source archive on Playground
        shell: bash
        run: |
          set -euo pipefail
          version="8.8.225.510547499.09"
          archive="google-camera-$version-jadx-sources.zip"
          archive_sha="$(sha256sum "$archive" | awk '{print $1}')"

          rm -rf /tmp/gcam-persist
          mkdir -p "/tmp/gcam-persist/decompiled/google-camera/$version"
          split -b 480K -d -a 3 "$archive" "/tmp/gcam-persist/decompiled/google-camera/$version/part-"

          {
            echo "version=$version"
            echo "package=com.google.android.GoogleCamera"
            echo "version_code=66251366"
            echo "apk_sha256=9ca2264cbf5680c8b5b740e53849c1586c53436a7e860616584c0349dba37c47"
            echo "jadx_version=1.5.6"
            echo "jadx_exit=$JADX_EXIT"
            echo "java_files=$SOURCE_COUNT"
            echo "archive_size=$(stat -c %s "$archive")"
            echo "archive_sha256=$archive_sha"
            echo "part_size=480KiB"
            echo "part_count=$(find "/tmp/gcam-persist/decompiled/google-camera/$version" -name 'part-*' | wc -l)"
          } > "/tmp/gcam-persist/decompiled/google-camera/$version/manifest.txt"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan gcam-decompiled
          git rm -rf . >/dev/null 2>&1 || true
          cp -a /tmp/gcam-persist/. .
          git add decompiled
          git commit -m "Persist Google Camera 8.8.225 decompiled archive"
          git push --force origin HEAD:gcam-decompiled
