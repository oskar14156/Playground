name: Decompile LightCycle session parameters

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Fetch exact LightCycle binary
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 "https://github.com/Persie0/decompile/releases/download/pho/com.google.android.GoogleCamera_8.8.225.510547499.09-66251366_minAPI33.arm64-v8a.nodpi._apkmirror.com.apk" -o camera.apk
          echo "9ca2264cbf5680c8b5b740e53849c1586c53436a7e860616584c0349dba37c47  camera.apk" | sha256sum -c -
          unzip -p camera.apk lib/arm64-v8a/liblightcycle.so > liblightcycle.so
          echo "878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1  liblightcycle.so" | sha256sum -c -

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Fetch pinned Ghidra
        run: |
          set -euo pipefail
          curl -fL --retry 3             "https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.4_build/ghidra_12.1.4_PUBLIC_20260921.zip"             -o ghidra.zip
          mkdir ghidra && unzip -q ghidra.zip -d ghidra
          echo "GHIDRA_HOME=$(find ghidra -mindepth 1 -maxdepth 1 -type d | head -1)" >> "$GITHUB_ENV"

      - name: Write decompiler
        run: |
          mkdir -p scripts out
          cat > scripts/DecompileSessionParams.java <<'JAVA'
          import ghidra.app.decompiler.*;
          import ghidra.app.script.GhidraScript;
          import ghidra.program.model.address.*;
          import ghidra.program.model.listing.*;
          import java.io.*;
          import java.util.*;

          public class DecompileSessionParams extends GhidraScript {
            DecompInterface di;
            PrintWriter out;
            Set<Address> seen = new HashSet<>();

            void dump(Function f, String why, int depth) throws Exception {
              if (f == null || f.isExternal() || seen.contains(f.getEntryPoint())) return;
              seen.add(f.getEntryPoint());
              out.println("\n===== " + f.getName() + " @ " + f.getEntryPoint() + " =====");
              out.println("WHY: " + why);
              out.println("PROTO: " + f.getPrototypeString(false,false));
              out.println("BODY: " + f.getBody());
              DecompileResults r = di.decompileFunction(f, 180, monitor);
              if (r.decompileCompleted() && r.getDecompiledFunction()!=null) {
                out.println(r.getDecompiledFunction().getC());
              } else {
                out.println("[FAILED] " + r.getErrorMessage());
              }
              if (depth <= 0) return;
              for (Function c : f.getCalledFunctions(monitor)) {
                long a=c.getEntryPoint().getOffset();
                if (!c.isExternal() && a>=0x200000L && a<0x520000L) {
                  dump(c, "callee of "+f.getEntryPoint(), depth-1);
                }
              }
            }

            public void run() throws Exception {
              out=new PrintWriter(new BufferedWriter(new FileWriter(getScriptArgs()[0])));
              di=new DecompInterface();
              di.toggleCCode(true);
              di.toggleSyntaxTree(true);
              di.setSimplificationStyle("decompile");
              di.openProgram(currentProgram);
              FunctionManager fm=currentProgram.getFunctionManager();

              long[] addrs={
                0x4189d8L,
                0x4305bcL,
                0x41b154L,
                0x431344L,
                0x430978L,
                0x4188ccL,
                0x41874cL
              };
              for(long a:addrs){
                Function f=fm.getFunctionContaining(toAddr(a));
                if(f==null) out.println("NO FUNCTION @ "+Long.toHexString(a));
                else dump(f,"direct session-parameter target "+Long.toHexString(a),3);
              }
              out.close();
              di.dispose();
            }
          }
          JAVA

      - name: Analyze
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ghproj
          "$GHIDRA_HOME/support/analyzeHeadless" /tmp/ghproj LCParams             -import "$PWD/liblightcycle.so"             -overwrite             -analysisTimeoutPerFile 1800             -scriptPath "$PWD/scripts"             -postScript DecompileSessionParams.java "$PWD/out/session-params.txt"             > "$PWD/out/ghidra.log" 2>&1
          test -s out/session-params.txt
          wc -l out/session-params.txt

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pixel-camera-lightcycle-session-params
          path: out/
          if-no-files-found: warn
          retention-days: 90
