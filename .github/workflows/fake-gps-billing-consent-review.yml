name: Fake GPS billing and consent regression
on:
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      # Validate native functional parity after Flutter assets cleanup and consent fixes.
      # Verify native lifecycle fixes at latest branch head.
      # Validate merged Fake GPS Store and Settings UI changes on master.
      - name: Validate secret
        env:
          TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: test -n "$TOKEN"
      - name: Checkout private Fake GPS branch
        uses: actions/checkout@v4
        with:
          repository: Persie0/fake_gps_detector
          ref: master
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: fakegps
      - name: Checkout merged Kotlin release builder
        uses: actions/checkout@v4
        with:
          repository: Persie0/firebase_tester_builder
          ref: main
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: builder
      - name: Test Kotlin builder app routing
        working-directory: builder
        run: |
          python -m unittest discover -s tests -p 'test_play*.py'
          grep -q '          - fake_gps_detector' .github/workflows/play_kotlin_auto.yml
          ! grep -q '          - fake_gps_detector' .github/workflows/play_auto.yml
          ! grep -q '          - fake_gps_detector' .github/workflows/app_store_auto.yml
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android platform 36 (AGP resolves compile SDK 37)
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Setup Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      # Validate full Kotlin release build after declaring ad SDK notification permission.
      - name: Verify original Flutter archive
        working-directory: fakegps
        run: |
          set -euo pipefail
          test -f old/pubspec.yaml
          test -f old/lib/main.dart
          test -f settings.gradle.kts
          test -f app/src/main/java/at/austriao/fake_gps_detector_app/MainActivity.kt
          test ! -f pubspec.yaml
          test -x gradlew
          test -f app/src/main/assets/open_source_notices.txt
          test -f app/src/main/assets/eula/translations_eula/eula-en.html
          if find app/src/main/assets -type f \( -name '*.dart' -o -name '*.py' \) | grep -q .; then
            echo 'Flutter/Python assets still bundled in Kotlin app' >&2
            exit 1
          fi
          test -f old/android/key.properties
          test -f old/android/app/key.jks
          grep -q 'old/android/key.properties' app/build.gradle.kts
      - name: Kotlin Android build and unit tests
        working-directory: fakegps
        run: |
          ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintRelease --stacktrace --console=plain
          ./gradlew --no-daemon :app:bundleRelease --stacktrace --console=plain
          test -f app/build/outputs/apk/debug/app-debug.apk
          test -f app/build/outputs/bundle/release/app-release.aab
      - name: Verify Appodeal-only consent and no AdMob integration
        working-directory: fakegps
        timeout-minutes: 10
        run: |
          set -euo pipefail
          grep -q 'com.appodeal.ads.sdk:core:4.3.0' app/build.gradle.kts
          ! grep -q 'ADMOB_APP_ID' app/build.gradle.kts
          grep -q 'BuildConfig.APPODEAL_KEY' app/src/main/java/at/austriao/fake_gps_detector_app/AdsManager.kt
          ./gradlew --no-daemon :app:processDebugMainManifest --console=plain
          merged=$(find app/build/intermediates/merged_manifests -name AndroidManifest.xml -print -quit)
          test -n "$merged"
          if grep -q 'com.google.android.gms.ads.APPLICATION_ID' "$merged"; then
            echo 'AdMob application ID must not be in the final merged manifest' >&2
            exit 1
          fi
          ./gradlew --no-daemon :app:dependencies --configuration debugRuntimeClasspath --console=plain > /tmp/fakegps-dependencies.txt
          if grep -Eq 'com.google.android.gms:play-services-ads(-lite)?:' /tmp/fakegps-dependencies.txt; then
            echo 'AdMob SDK is still included in the runtime dependencies' >&2
            grep 'com.google.android.gms:play-services-ads' /tmp/fakegps-dependencies.txt
            exit 1
          fi

      - name: Validate Settings simplification and localization
        working-directory: fakegps
        run: |
          set -euo pipefail
          grep -q 'Heading(text("advertisementConsent"))' app/src/main/java/at/austriao/fake_gps_detector_app/MainActivity.kt
          grep -q 'SettingItemContents(text("licenses")' app/src/main/java/at/austriao/fake_gps_detector_app/MainActivity.kt
          ! grep -q 'Heading(text("appodealConsent"))' app/src/main/java/at/austriao/fake_gps_detector_app/MainActivity.kt
          ! grep -q 'SettingItem(text("resetConsent")' app/src/main/java/at/austriao/fake_gps_detector_app/MainActivity.kt
          ! grep -q 'SettingItem(text("loadConsentForm")' app/src/main/java/at/austriao/fake_gps_detector_app/MainActivity.kt
          python - <<'PY'
          import json
          from pathlib import Path
          files = list(Path('app/src/main/assets/i18n').glob('app_*.arb'))
          assert len(files) >= 32
          for file in files:
              contents = json.loads(file.read_text())
              assert contents.get('advertisementConsent'), f'Missing localized header in {file}'
          print(f'Validated advertisement consent locale in {len(files)} ARB files')
          PY

      - name: Print full lint diagnostics on failure
        if: failure()
        working-directory: fakegps
        run: |
          REPORT=app/build/intermediates/lint_intermediate_text_report/release/lintReportRelease/lint-results-release.txt
          if [ -f "$REPORT" ]; then
            grep -E '^[^ ]+:[0-9]+: (Error|Warning):' "$REPORT" || cat "$REPORT"
          fi
      - name: Publish Fake GPS Kotlin validation status
        if: always()
        env:
          TOKEN: ${{ github.token }}
          BUILD_RESULT: ${{ job.status }}
        run: |
          state="$BUILD_RESULT"
          case "$state" in
            success|failure|error|pending) ;;
            *) state=error ;;
          esac
          curl --fail --silent --show-error --request POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/Persie0/Playground/statuses/$GITHUB_SHA" \
            --data "$(printf '{"state":"%s","context":"fake-gps-kotlin-master","description":"Debug APK, unit tests, release lint and AAB"}' "$state")"

