name: Fake GPS remove unused IAP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-update-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_REPOSITORY: Persie0/fake_gps_detector
      APP_REF: master
    steps:
      - name: Validate private repo token
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
        run: test -n "$PRIVATE_TOKEN"

      - name: Checkout Fake GPS branch
        uses: actions/checkout@v5
        with:
          repository: ${{ env.APP_REPOSITORY }}
          ref: ${{ env.APP_REF }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          persist-credentials: false
          path: private-app

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Regenerate dependency lockfile
        working-directory: private-app
        run: flutter pub get

      - name: Verify in_app_purchase is gone
        working-directory: private-app
        run: |
          set -euo pipefail
          if grep -R --line-number --exclude-dir=.git --exclude='*.lock' --exclude='pubspec.yaml' 'package:in_app_purchase' lib test 2>/dev/null; then
            echo '::error::Found live Dart imports of in_app_purchase.'
            exit 1
          fi
          if grep -q '^  in_app_purchase:' pubspec.yaml; then
            echo '::error::pubspec.yaml still declares in_app_purchase.'
            exit 1
          fi
          if grep -q '^  in_app_purchase:' pubspec.lock; then
            echo '::error::pubspec.lock still contains in_app_purchase after flutter pub get.'
            exit 1
          fi

      - name: Analyze
        working-directory: private-app
        run: flutter analyze --no-fatal-infos

      - name: Test
        working-directory: private-app
        run: flutter test

      - name: Verify lockfile is committed
        working-directory: private-app
        run: git diff --exit-code -- pubspec.lock
