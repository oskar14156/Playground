name: Read Android preview and metadata artifact

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  print-android-source-context:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download completed APK source artifact
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN || github.token }}
        run: |
          set -euo pipefail
          AUTH_ARGS=()
          if [[ -n "${GH_TOKEN:-}" ]]; then AUTH_ARGS=(-H "Authorization: Bearer ${GH_TOKEN}"); fi
          curl -fL --retry 3 "${AUTH_ARGS[@]}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/Persie0/Playground/actions/artifacts/11523945106/zip" -o /tmp/android.zip
          unzip -Z1 /tmp/android.zip > /tmp/android-files.txt
          curl -fL --retry 3 "${AUTH_ARGS[@]}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/Persie0/Playground/actions/artifacts/11522779261/zip" -o /tmp/native.zip
          unzip -Z1 /tmp/native.zip > /tmp/native-files.txt
          echo "ANDROID SOURCE FILES OF INTEREST"
          grep -E '(bnj|bnc|boi|bnh)[.]java|LocalSessionStorage[.]java|preview-metadata-hits[.]txt' /tmp/android-files.txt | head -n 30
      - name: Print Java source context
        shell: bash
        run: |
          set -euo pipefail
          unzip -q /tmp/android.zip 'decompiled/sources/*' -d /tmp/androidsrc
          echo "===== preview-metadata-hits.txt ====="
          HITS=$(grep -F 'preview-metadata-hits.txt' /tmp/android-files.txt | head -n 1 || true)
          if [[ -n "$HITS" ]]; then unzip -p /tmp/android.zip "$HITS"; fi
          echo "===== camera callback and metadata source context ====="
          grep -R -n -C 12 -E 'onPreviewFrame|ProcessFrame|AlignNextImage|setPreviewCallback|setPreviewFormat|getPreviewFormat|metadataFilePath|session[.]meta|orientations[.]txt' /tmp/androidsrc/decompiled/sources > /tmp/source-context.txt || true
          sed -n '1,900p' /tmp/source-context.txt
          for NAME in bnj.java bnc.java boi.java bnh.java bnf.java bey.java LocalSessionStorage.java; do
            SOURCE=$(find /tmp/androidsrc/decompiled/sources -type f -name "$NAME" -print -quit || true)
            if [[ -z "$SOURCE" ]]; then echo "Missing $NAME"; continue; fi
            echo "===== $SOURCE ====="
            sed -n '1,320p' "$SOURCE"
          done
      - name: Print native lead bodies, references, and vtable relocations
        shell: bash
        run: |
          set -euo pipefail
          unzip -q /tmp/native.zip -d /tmp/native
          NATIVE_ROOT=$(dirname "$(find /tmp/native -type f -name targets.tsv -print -quit)")
          if [[ ! -f "$NATIVE_ROOT/targets.tsv" ]]; then echo "Native targets.tsv was not found" >&2; exit 1; fi
          echo "Native artifact root: $NATIVE_ROOT"
          echo "===== relevant native function index rows ====="
          awk -F '\t' '$1=="TARGET" || $1=="CONTAINING" || $1=="VTABLE" || $1=="DATAREF" || ($1=="REF" && ($2=="00416a40" || $2=="00421c80" || $2=="004440ec" || $2=="00443e74" || $2=="002158fc" || $2=="002159fc" || $2=="0020f6a0" || $2=="0020f448" || $2=="002147c4" || $2=="0021105c" || $2=="001ed84c" || $2=="001efb78"))' "$NATIVE_ROOT/targets.tsv" | head -n 500
          echo "===== relevant vtable relocations ====="
          grep -E '50d018|50d0d0|50d070|50d080|50d128|50d138|5118b8|50cfc0|MonolithicMultibandBlender|YUVMonolithicMultiband' "$NATIVE_ROOT/relocations.txt" "$NATIVE_ROOT/symbols-demangled.txt" || true
          for ADDR in 00443e74 004440ec 002158fc 001ed84c 001f327c 0021d570 0020f6a0 0020f448 001ef8f8 0021105c 002147c4 002159fc 0021b5f4 0021e3e4 00421c80 0041133c 0041138c 004158f8 0040f0b8 00416a64 00416a40 0042a24c 0042a3d8 0042278c 00406504 004068d0 00406bc4 00406d64; do
            SOURCE=$(find "$NATIVE_ROOT" -type f -name "*_${ADDR}.c" -print -quit || true)
            if [[ -z "$SOURCE" ]]; then continue; fi
            echo "===== $SOURCE ====="
            sed -n '1,700p' "$SOURCE"
          done
          echo "===== callers of the alternate point-scale predicate ====="
          for ENTRY in $(awk -F '\t' '$1=="REF" && $2=="00416a40" {print $4}' "$NATIVE_ROOT/targets.tsv" | sort -u); do
            SOURCE=$(find "$NATIVE_ROOT" -type f -name "*_${ENTRY}.c" -print -quit || true)
            if [[ -n "$SOURCE" ]]; then echo "===== $SOURCE ====="; sed -n '1,700p' "$SOURCE"; fi
          done
