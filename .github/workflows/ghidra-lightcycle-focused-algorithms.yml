name: LightCycle focused native and Android analysis

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Fetch exact native library
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          AUTH_ARGS=()
          if [[ -n "${GH_TOKEN:-}" ]]; then
            AUTH_ARGS=(-H "Authorization: Bearer ${GH_TOKEN}")
          fi
          curl -fL --retry 3 "${AUTH_ARGS[@]}"             "https://github.com/Persie0/decompile/releases/download/pho/com.google.android.GoogleCamera_8.8.225.510547499.09-66251366_minAPI33.arm64-v8a.nodpi._apkmirror.com.apk"             -o camera.apk
          echo "9ca2264cbf5680c8b5b740e53849c1586c53436a7e860616584c0349dba37c47  camera.apk" | sha256sum -c -
          unzip -p camera.apk lib/arm64-v8a/liblightcycle.so > liblightcycle.so
          echo "878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1  liblightcycle.so" | sha256sum -c -

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Download pinned Ghidra
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3             "https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.4_build/ghidra_12.1.4_PUBLIC_20260921.zip"             -o ghidra.zip
          mkdir ghidra
          unzip -q ghidra.zip -d ghidra
          echo "GHIDRA_HOME=$PWD/ghidra/ghidra_12.1.4_PUBLIC" >> "$GITHUB_ENV"

      - name: Write focused decompiler
        shell: bash
        run: |
          mkdir -p scripts out
          cat > scripts/FocusedLightCycle.java <<'JAVA'
          import ghidra.app.decompiler.*;
          import ghidra.app.script.GhidraScript;
          import ghidra.program.model.address.*;
          import ghidra.program.model.listing.*;
          import ghidra.program.model.mem.Memory;
          import ghidra.program.model.symbol.*;
          import java.io.*;
          import java.util.*;

          public class FocusedLightCycle extends GhidraScript {
              private static final long[] TARGETS = {
                  // TargetManagerCommon vtable methods.
                  0x002121bcL, 0x002122acL, 0x002122c4L, 0x00212320L,
                  0x00212384L, 0x0021239cL, 0x002123b4L, 0x00212498L,
                  0x002124a0L, 0x002124a8L, 0x00212698L, 0x002126bcL,
                  0x002126c4L, 0x002126ccL, 0x002126d8L, 0x002126e8L,
                  0x00212704L,
                  // CaptureSessionBuilderImpl vtable methods.
                  0x0020f6a0L, 0x0020f6c8L, 0x0020f7dcL, 0x0020f84cL,
                  0x0020f958L, 0x0020f968L, 0x0020f978L, 0x0020f9e4L,
                  0x0020f9f4L, 0x0020fa04L, 0x0020fc30L, 0x0020fc40L,
                  0x0020fc50L, 0x0020fc60L, 0x0020fe74L, 0x002100ecL,
                  0x002100f4L, 0x002100fcL, 0x00210104L, 0x00210310L,
                  // PhotoSphere parameter/output sizing.
                  0x0021874cL, 0x002188b8L, 0x002188ccL, 0x002189d8L,
                  0x0041c5e0L,
                  // Feature/patch matching + spherical pairwise.
                  0x00226020L, 0x002260b8L, 0x002263f0L, 0x00226614L,
                  0x00227bacL,
                  // Oriented-feature selection/grid helpers for descriptor tracing.
                  0x004a54b4L, 0x004a5718L, 0x004a5b34L, 0x004a5cb0L,
                  // Optical flow.
                  0x001ffc30L, 0x001fff14L, 0x0020012cL,
                  // Bundle adjustment and loss setup.
                  0x002287c0L, 0x00229e80L,
                  // Seam mask / graphcut.
                  0x00433478L, 0x004390a8L, 0x00439600L,
                  // Multiband blender vtable/setup and output methods.
                  0x0041fbe4L, 0x0041fcd8L, 0x0041fcf0L, 0x0041fdccL,
                  0x00420058L, 0x004208c0L, 0x00420998L, 0x00420decL,
                  0x00420e0cL, 0x00420f2cL, 0x0042114cL, 0x0042169cL,
                  0x00421718L, 0x00421908L, 0x00421c74L, 0x00421c80L,
                  0x00421e6cL, 0x00421efcL, 0x00421fb0L, 0x0042a24cL,
                  0x0042a3d8L, 0x0041b400L, 0x00420058L,
                  // JPEG writer delegates reached by the multiband output path.
                  0x00450c9cL, 0x00451100L,
                  // Encoder kernels delegated by the writer wrappers.
                  0x00452050L, 0x004527f8L,
                  // Preview-rosette construction, FIFO processing, and index/cardinality checks.
                  0x004440ecL, 0x00443e74L, 0x004f19f4L, 0x004f40fcL, 0x0021b5f4L, 0x0021e3e4L, 0x00218d54L,
                  0x0021b18cL, 0x0021be38L, 0x0021976cL, 0x00403cf8L,
                  // Generic target generator/config and native flow defaults/callers.
                  0x002158fcL, 0x002159fcL, 0x0021105cL, 0x002147c4L, 0x0020f6a0L, 0x001efb78L, 0x001f214cL,
                  0x001f327cL, 0x001f32b0L, 0x001f32bcL, 0x001f333cL,
                  0x001ed94cL, 0x001edb58L,
                  // Line endpoint transforms and alternate point-scale path.
                  0x00406504L, 0x004068d0L, 0x00406bc4L, 0x00406d64L,
                  0x0040f0b8L, 0x004158f8L, 0x00416a40L, 0x00416a64L,
                  0x0021d570L, 0x0021db38L, 0x0021df1cL,
                  // Pyramid filter helper.
                  0x0042278cL
              };

              private static final long[] DATA = {
                  0x00161788L,0x001617a8L,0x001617b0L,0x001617c0L,
                  0x00161868L,0x001618d0L,0x001619f0L,0x00161a00L,
                  0x00161a10L,0x00161a18L,0x00161a20L,0x00161a60L,
                  0x00161a78L,0x00161a80L,0x00161b40L,0x00161b48L,
                  0x00161b60L,0x00161b68L,0x00161b70L,0x00161b80L,
                  0x00161de0L,0x00161df0L,0x00161e30L,0x00161fd0L,
                  0x00161fd8L,0x00161ff0L,0x001622f0L,0x001623a0L,
                  0x001624d0L,0x001625c0L,0x0016275bL,0x00162e30L,
                  0x004fd1e8L,0x004fd1f8L,
                  // Blender vtable address points found in prior reference rows.
                  0x0050d008L,0x0050d018L,0x0050d0c0L,0x0050d0d0L,0x0050d0d8L,0x0050d128L,0x0050d130L,0x0050d138L,0x0050d140L,0x0050d148L,0x0050d150L,0x0050d158L
              };

              private static final long[] VTABLES = { 0x0050d018L, 0x0050d0d0L };
              private static final long[] VTABLE_REFS = { 0x0050d018L, 0x0050d0d0L, 0x0050d0d8L, 0x0050d158L };

              public void run() throws Exception {
                  File outDir = new File(getScriptArgs()[0]);
                  outDir.mkdirs();
                  FunctionManager fm=currentProgram.getFunctionManager();
                  ReferenceManager rm=currentProgram.getReferenceManager();
                  Memory mem=currentProgram.getMemory();

                  DecompInterface dec=new DecompInterface();
                  dec.toggleCCode(true);
                  dec.toggleSyntaxTree(true);
                  dec.setSimplificationStyle("decompile");
                  dec.openProgram(currentProgram);

                  Set<Function> funcs=new LinkedHashSet<>();
                  PrintWriter ix=new PrintWriter(new File(outDir,"targets.tsv"));
                  for(long raw:TARGETS){
                      Address a=toAddr(raw);
                      Function f=fm.getFunctionAt(a);
                      boolean containing=false;
                      if(f==null){ f=fm.getFunctionContaining(a); containing=(f!=null); }
                      ix.println("TARGET\t"+a+"\t"+(f==null?"<none>":f.getName()+"\t"+f.getBody()));
                      if(f!=null){
                          if(containing) ix.println("CONTAINING\t"+a+"\t"+f.getEntryPoint()+"\t"+f.getName());
                          funcs.add(f);
                      }
                  }

                  // Resolve function pointers in the two blender vtable address points.
                  // This captures concrete +0x58/+0x68 methods without guessing their addresses.
                  for(long base:VTABLES){
                      for(int off=0;off<=0x90;off+=8){
                          Address slot=toAddr(base+off);
                          try{
                              long ptr=mem.getLong(slot);
                              Address target=toAddr(ptr);
                              Function vf=fm.getFunctionAt(target);
                              if(vf==null) vf=fm.getFunctionContaining(target);
                              String entry=(vf==null?"-":vf.getEntryPoint().toString());
                              String name=(vf==null?"-":vf.getName());
                              ix.println("VTABLE\t"+slot+"\t"+target+"\t"+entry+"\t"+name);
                              if(vf!=null) funcs.add(vf);
                          }catch(Exception e){
                              ix.println("VTABLE\t"+slot+"\t<unreadable>\t-\t-");
                          }
                      }
                  }

                  for(long raw:VTABLE_REFS){
                      Address a=toAddr(raw);
                      ReferenceIterator refs=rm.getReferencesTo(a);
                      while(refs.hasNext()){
                          Reference r=refs.next();
                          Function f=fm.getFunctionContaining(r.getFromAddress());
                          if(f!=null){
                              funcs.add(f);
                              ix.println("DATAREF\t"+a+"\t"+f.getEntryPoint()+"\t"+f.getName());
                          }
                      }
                  }
                  Set<Function> seed=new LinkedHashSet<>(funcs);
                  for(Function f:seed){
                      for(Function callee:f.getCalledFunctions(monitor)) funcs.add(callee);
                      ReferenceIterator it=rm.getReferencesTo(f.getEntryPoint());
                      while(it.hasNext()){
                          Reference r=it.next();
                          Function caller=fm.getFunctionContaining(r.getFromAddress());
                          if(caller!=null) funcs.add(caller);
                          ix.println("REF\t"+f.getEntryPoint()+"\t"+r.getFromAddress()+"\t"+
                              (caller==null?"<none>":caller.getEntryPoint()+"\t"+caller.getName()));
                      }
                  }
                  ix.close();

                  PrintWriter findex=new PrintWriter(new File(outDir,"functions.tsv"));
                  for(Function f:funcs){
                      String safe=f.getName().replaceAll("[^A-Za-z0-9_.-]","_");
                      DecompileResults dr=dec.decompileFunction(f,240,monitor);
                      findex.println(f.getEntryPoint()+"\t"+f.getName()+"\t"+f.getBody());
                      try(PrintWriter pw=new PrintWriter(new File(outDir,safe+"_"+f.getEntryPoint()+".c"))){
                          pw.println("/* "+f.getName()+" @ "+f.getEntryPoint()+" */");
                          if(dr.decompileCompleted() && dr.getDecompiledFunction()!=null) pw.println(dr.getDecompiledFunction().getC());
                          else pw.println("/* FAILED: "+dr.getErrorMessage()+" */");
                      }
                  }
                  findex.close();

                  PrintWriter dd=new PrintWriter(new File(outDir,"data-xrefs.txt"));
                  for(long raw:DATA){
                      Address a=toAddr(raw);
                      dd.println("\nDATA\t"+a);
                      for(int off=0;off<32;off+=4){
                          Address p=a.add(off);
                          try{
                              int i=mem.getInt(p);
                              dd.printf("VAL4\t%s\tint=%d\thex=0x%08x\tfloat=%g%n",
                                  p,i,i,Float.intBitsToFloat(i));
                          }catch(Exception e){}
                      }
                      for(int off=0;off<32;off+=8){
                          Address p=a.add(off);
                          try{
                              long l=mem.getLong(p);
                              dd.printf("VAL8\t%s\thex=0x%016x\tdouble=%.17g%n",
                                  p,l,Double.longBitsToDouble(l));
                          }catch(Exception e){}
                      }
                      ReferenceIterator ri=rm.getReferencesTo(a);
                      while(ri.hasNext()){
                          Reference r=ri.next();
                          Function f=fm.getFunctionContaining(r.getFromAddress());
                          dd.println("XREF\t"+r.getFromAddress()+"\t"+r.getReferenceType()+"\t"+
                              (f==null?"<none>":f.getEntryPoint()+"\t"+f.getName()));
                      }
                  }
                  dd.close();
                  dec.dispose();
              }
          }
          JAVA

      - name: Analyze
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gh out/focused
          "$GHIDRA_HOME/support/analyzeHeadless" /tmp/gh lc-focused             -import "$PWD/liblightcycle.so"             -analysisTimeoutPerFile 1800             -scriptPath "$PWD/scripts"             -postScript FocusedLightCycle.java "$PWD/out/focused"             -deleteProject | tee out/ghidra.log

      - name: Add ARM64 disassembly and data
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils-aarch64-linux-gnu
          aarch64-linux-gnu-objdump -d --no-show-raw-insn liblightcycle.so > out/focused/objdump.txt
          aarch64-linux-gnu-objdump -s -j .rodata liblightcycle.so > out/focused/rodata.txt || true
          readelf -Ws liblightcycle.so > out/focused/symbols.txt
          readelf -rW liblightcycle.so > out/focused/relocations.txt
          readelf -Ws liblightcycle.so | c++filt > out/focused/symbols-demangled.txt
          objdump -h liblightcycle.so > out/focused/sections.txt
          objdump -s -j .data.rel.ro liblightcycle.so > out/focused/data-rel-ro.txt || true
          objdump -s -j .data.rel.ro.local liblightcycle.so > out/focused/data-rel-ro-local.txt || true

      - name: Print newly targeted decompiles and blender vtable slots
        shell: bash
        run: |
          set -euo pipefail
          PRINTED=$(mktemp)
          print_body() {
            local addr="$1"
            local limit="$2"
            local file
            file=$(find out/focused -maxdepth 1 -type f -name "*_${addr}.c" -print -quit || true)
            if [[ -z "$file" ]]; then
              echo "No decompile file for ${addr}"
              return
            fi
            if grep -Fxq "$addr" "$PRINTED"; then return; fi
            printf '%s\n' "$addr" >> "$PRINTED"
            echo "===== ${file} ====="
            sed -n "1,${limit}p" "$file"
          }
          grep '^VTABLE' out/focused/targets.tsv || true
          echo "===== target and containing-function map ====="
          awk -F '\t' '$1=="TARGET" && ($2 ~ /00443e74|004440ec|0020f6a0|0021d570|0021db38|0021df1c/) {print} $1=="CONTAINING" && ($2 ~ /0021d570|0021db38|0021df1c/) {print}' out/focused/targets.tsv
          for TARGET in 00443e74 004440ec 004f19f4 004f40fc 0021b5f4 0021e3e4 00218d54 0021b18c 0021be38 0021976c 00403cf8 002158fc 002159fc 0021105c 002147c4 0020f6a0 001efb78 001f214c 001f327c 001f32b0 001f32bc 001f333c 001ed94c 001edb58 00406504 004068d0 00406bc4 00406d64 0040f0b8 004158f8 00416a40 00416a64 0021d570 0021db38 0021df1c 00420058 00421c80 00421e6c 00421efc 00421fb0 0041b400 0042a24c 0042a3d8 0042278c; do
            print_body "$TARGET" 700
          done
          while IFS=$'\t' read -r KIND RAW ENTRY NAME; do
            print_body "$ENTRY" 700
          done < <(awk -F '\t' '$1=="CONTAINING" {print $0}' out/focused/targets.tsv)
          while IFS=$'\t' read -r KIND RAW ENTRY NAME; do
            print_body "$ENTRY" 700
          done < <(awk -F '\t' '$1=="DATAREF" {print $0}' out/focused/targets.tsv)
          echo "===== vtable data values ====="
          grep -E '^DATA\t0050d|^VAL8\t0050d|^XREF\t.*0050d' out/focused/data-xrefs.txt || true
          print_disassembly_window() {
            local raw="$1" normalized line start end
            normalized=$(printf '%x' "$((16#$raw))")
            line=$(grep -n -m 1 -E "^[[:space:]]*0*${normalized}:" out/focused/objdump.txt | cut -d: -f1 || true)
            if [[ -z "$line" ]]; then echo "No objdump line for raw ${raw}"; return; fi
            start=$((line > 10 ? line - 10 : 1))
            end=$((line + 28))
            echo "===== objdump around raw ${raw} ====="
            sed -n "${start},${end}p" out/focused/objdump.txt
          }
          for RAW in 00343e74 003440ec 0011b5e0 0011d570 0011db20 0011db38 0011dcc0 0011df00 0011df1c; do print_disassembly_window "$RAW"; done
          for SLOT in 0050d070 0050d080 0050d128 0050d138; do
            ENTRY=$(awk -v slot="$SLOT" '$1=="VTABLE" && $2==slot {print $4; exit}' out/focused/targets.tsv)
            if [[ -n "$ENTRY" && "$ENTRY" != "-" ]]; then print_body "$ENTRY" 700; fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: pixel-camera-lightcycle-focused-algorithms
          path: out/
          if-no-files-found: error
          retention-days: 90

  android-source:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Download and verify exact target APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/android
          curl -fL --retry 3 "https://github.com/Persie0/decompile/releases/download/pho/com.google.android.GoogleCamera_8.8.225.510547499.09-66251366_minAPI33.arm64-v8a.nodpi._apkmirror.com.apk" -o camera.apk
          echo "9ca2264cbf5680c8b5b740e53849c1586c53436a7e860616584c0349dba37c47  camera.apk" | sha256sum -c -
          unzip -Z1 camera.apk > out/android/apk-members.txt
          grep -E '^classes([0-9]+)?[.]dex$' out/android/apk-members.txt > out/android/dex-files.txt || true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Download and verify JADX
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 "https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip" -o jadx.zip
          echo "545ea2be9c242511bc145755cf4bda2485ade42966e096f8b4d3da2a230e8974  jadx.zip" | sha256sum -c -
          unzip -q jadx.zip -d jadx
          chmod +x jadx/bin/jadx
      - name: Decompile Java and search camera/metadata paths
        shell: bash
        run: |
          set -euo pipefail
          if [[ -s out/android/dex-files.txt ]]; then
            set +e
            jadx/bin/jadx --no-res --show-bad-code --threads-count 2 -d out/android/decompiled camera.apk > out/android/jadx.log 2>&1
            JADX_STATUS=$?
            set -e
            echo "$JADX_STATUS" > out/android/jadx-exit-status.txt
            grep -R -n -i -E "setPreviewCallback|setPreviewFormat|getPreviewFormat|setPreviewTexture|metadataFilePath|LocalSessionStorage|PreviewFrameProcessor|ImageFormat[.]NV21|DEPTH16" out/android/decompiled/sources > out/android/preview-metadata-hits.txt || true
            echo "JADX exit status: $JADX_STATUS (partial output retained when nonzero)"
            grep -i -E "finished with errors|error|warning" out/android/jadx.log | tail -n 40 || true
          else
            echo "The exact target APK has no classes*.dex entries; Java preview/runtime metadata cannot be traced from this asset." | tee out/android/preview-metadata-hits.txt
          fi
          sed -n '1,600p' out/android/preview-metadata-hits.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pixel-camera-android-static-preview-metadata
          path: out/android/
          if-no-files-found: error
          retention-days: 90
