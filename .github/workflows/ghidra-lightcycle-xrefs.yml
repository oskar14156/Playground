name: Ghidra LightCycle string xrefs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Download exact binary
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          auth=()
          if [[ -n "${GH_TOKEN:-}" ]]; then
            auth=(-H "Authorization: Bearer ${GH_TOKEN}")
          fi
          curl "${auth[@]}" -fL --retry 3 "https://github.com/Persie0/decompile/releases/download/pho/com.google.android.GoogleCamera_8.8.225.510547499.09-66251366_minAPI33.arm64-v8a.nodpi._apkmirror.com.apk" -o camera.apk
          echo "9ca2264cbf5680c8b5b740e53849c1586c53436a7e860616584c0349dba37c47  camera.apk" | sha256sum -c -
          unzip -p camera.apk lib/arm64-v8a/liblightcycle.so > liblightcycle.so
          echo "878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1  liblightcycle.so" | sha256sum -c -

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Download latest Ghidra
        shell: bash
        run: |
          set -euo pipefail
          url="$(curl -fsSL https://api.github.com/repos/NationalSecurityAgency/ghidra/releases/latest | jq -r '.assets[] | select(.name | test("PUBLIC.*\\.zip$")) | .browser_download_url' | head -1)"
          test -n "$url" && test "$url" != "null"
          curl -fL --retry 3 "$url" -o ghidra.zip
          mkdir ghidra
          unzip -q ghidra.zip -d ghidra
          GHIDRA_HOME="$(find ghidra -mindepth 1 -maxdepth 1 -type d | head -1)"
          echo "GHIDRA_HOME=$GHIDRA_HOME" >> "$GITHUB_ENV"

      - name: Write xref script
        shell: bash
        run: |
          mkdir -p scripts out
          cat > scripts/DumpXrefs.java <<'JAVA'
          import ghidra.app.cmd.disassemble.DisassembleCommand;
          import ghidra.app.decompiler.*;
          import ghidra.app.script.GhidraScript;
          import ghidra.program.model.address.*;
          import ghidra.program.model.listing.*;
          import ghidra.program.model.symbol.*;
          import ghidra.program.model.data.*;
          import java.io.*;
          import java.util.*;
          import java.util.regex.*;

          public class DumpXrefs extends GhidraScript {
            DecompInterface di;
            PrintWriter out;
            Set<Address> done = new HashSet<>();

            void decomp(Function f, String why) throws Exception {
              if (f == null || done.contains(f.getEntryPoint()) || f.isExternal()) return;
              done.add(f.getEntryPoint());
              out.println("\n===== " + f.getName() + " @ " + f.getEntryPoint() + " =====");
              out.println("WHY: " + why);
              out.println("PROTO: " + f.getPrototypeString(false, false));
              out.println("BODY: " + f.getBody());
              DecompileResults r = di.decompileFunction(f, 120, monitor);
              if (r.decompileCompleted() && r.getDecompiledFunction() != null) {
                out.println(r.getDecompiledFunction().getC());
              } else {
                out.println("[DECOMPILE FAILED] " + r.getErrorMessage());
              }
              out.println("CALLEES:");
              for (Function c : f.getCalledFunctions(monitor)) {
                out.println("  " + c.getEntryPoint() + " " + c.getName());
              }
              out.println("CALLERS:");
              for (Function c : f.getCallingFunctions(monitor)) {
                out.println("  " + c.getEntryPoint() + " " + c.getName());
              }
            }

            void dumpInstructions(long first, long last) {
              out.println("\\n===== INSTRUCTIONS " + toAddr(first) + ".." + toAddr(last) + " =====");
              AddressSet range = new AddressSet(toAddr(first), toAddr(last));
              InstructionIterator ii = currentProgram.getListing().getInstructions(range, true);
              while (ii.hasNext()) {
                Instruction instruction = ii.next();
                out.println(instruction.getAddress() + "  " + instruction);
              }
            }

            public void run() throws Exception {
              out = new PrintWriter(new BufferedWriter(new FileWriter(getScriptArgs()[0])));
              di = new DecompInterface();
              di.toggleCCode(true);
              di.toggleSyntaxTree(true);
              di.setSimplificationStyle("decompile");
              di.openProgram(currentProgram);

              Pattern pat = Pattern.compile(
                "(?i)(photosphere|target_generator|target manager|targethit|target_hit|" +
                "capture_target|alignment_estimator|spherical_pairwise|patch_pairwise|" +
                "fast_9|fast_corner_detector|orientedpatch|oriented_patch_features|" +
                "image_pyramid|pyramid_downsample|line_aligner|line_finder|edge_finder|" +
                "global_flow_solver|camera_rotation_model|flow_constraints|" +
                "bundle_adjust|BundleAdjusterGlobalFocalLength|LineMatchResidual|" +
                "PointMatchResidual|line_matches|line_pairs|LineFeatureMatcher|" +
                "ceres|rosette|session_renderer|incremental_stitch|" +
                "stitcher\\.cc|seam_finder|optimal_seam|multiband|image_adjuster|" +
                "affine_gamma_downsizer|gamma_exposure|blend_pyramid|color_difference|" +
                "gamma exposure|writeyuv420tojpeg|image_match_width|moving too fast|" +
                "photo skipped|alignment did not converge|no images to align)"
              );

              Listing listing = currentProgram.getListing();
              ReferenceManager rm = currentProgram.getReferenceManager();
              FunctionManager fm = currentProgram.getFunctionManager();
              DataIterator it = listing.getDefinedData(true);
              Set<Function> hits = new TreeSet<>(Comparator.comparing(f -> f.getEntryPoint()));

              while (it.hasNext()) {
                Data d = it.next();
                if (!d.hasStringValue()) continue;
                Object value = d.getValue();
                if (!(value instanceof String)) continue;
                String s = (String)value;
                if (!pat.matcher(s).find()) continue;
                out.println("\nSTRING " + d.getAddress() + " = " + s);
                ReferenceIterator refs = rm.getReferencesTo(d.getAddress());
                while (refs.hasNext()) {
                  Reference ref = refs.next();
                  Function f = fm.getFunctionContaining(ref.getFromAddress());
                  out.println("  XREF " + ref.getFromAddress() + " -> " +
                              (f == null ? "<no function>" : f.getName()+"@"+f.getEntryPoint()));
                  if (f != null) hits.add(f);
                }
              }

              int n = 0;
              for (Function f : hits) {
                if (n++ >= 180) break;
                decomp(f, "interesting string xref");
                for (Function caller : f.getCallingFunctions(monitor)) {
                  decomp(caller, "caller of string-xref function " + f.getEntryPoint());
                }
                for (Function callee : f.getCalledFunctions(monitor)) {
                  if (callee.getEntryPoint().getOffset() >= 0x1ed630L &&
                      callee.getEntryPoint().getOffset() < 0x4fb864L) {
                    decomp(callee, "callee of string-xref function " + f.getEntryPoint());
                  }
                }
              }

              long[] focusAddresses = {
                0x403b08L, // adjacent allocation helper
                0x403b6cL, // LineAlignerImpl destructor candidate
                0x403c38L, // LineAlignerImpl destructor variant
                0x4052e0L, // caller site for the line-record builder
                0x416154L, // line_aligner_utils.cc record producer
                0x2246e8L, // pairwise-edge copy path (raw VA 0x1246e8)
                0x2287c0L, // GlobalFocalLength consumer (raw VA 0x1287c0)
                0x228c54L, // line-record residual setup (raw VA 0x128c54)
                0x416420L, // post-estimator point-record rescaler
                0x41b58cL, // candidate 36-byte record initializer found by field+32 scan
                0x405e64L, // inspect a line-aligner-adjacent +32 store candidate
                0x2147c4L, // inspect a 36-byte-store candidate in target generation
                0x21c0a0L, // inspect another non-stack +32/stride candidate
                0x229fb0L, // inspect candidate near GlobalFocalLength code
                0x22cbe8L, // inspect candidate near GlobalFocalLength code
                0x416d94L, 0x416fa0L, 0x4171ccL,
                0x403900L, // LineAlignerImpl wrapper around robust line filtering
                0x406fccL, // line-pair RANSAC body
                0x21ef24L, // largest-component membership filter
                0x2252d4L, // graph component cache builder
                0x225514L, // graph component enumeration helper
                0x4390a8L, // seam pairwise color cost
                0x439600L, // seam luma unary cost
                0x21d570L, // AddImage graph-node initialization and edge insertion
                0x222dbcL, // graph adjacency-vector append helper
                0x220600L, // pairwise match gate before graph-edge insertion
                0x21f2c8L, // image_graph_ node-vector append helper
                0x21f4f0L  // component-cache record-vector growth helper
              };
              for (long raw : focusAddresses) {
                Address a = toAddr(raw);
                Function f = fm.getFunctionContaining(a);
                out.println("\\n===== FOCUSED ADDRESS " + a + " =====");
                if (f == null) {
                  out.println("[NO FUNCTION]");
                  continue;
                }
                out.println("TARGET FUNCTION " + f.getName() + " @ " + f.getEntryPoint());
                decomp(f, "focused reverse-engineering address " + a);
                for (Function callee : f.getCalledFunctions(monitor)) {
                  if (callee.getEntryPoint().getOffset() >= 0x1ed630L &&
                      callee.getEntryPoint().getOffset() < 0x4fb864L) {
                    decomp(callee, "callee of focused function " + f.getEntryPoint());
                  }
                }
              }

              out.println("\n===== SESSION/GLOBAL ADDRESS XREFS =====");
              long[] globals = {
                0x512010L,0x512018L,0x512020L,0x512028L,0x512030L,0x512038L,
                0x512050L,0x512058L,0x512060L,0x512068L,0x512070L,
                0x5170c8L,0x5170d0L,0x5170d8L,0x5170d9L,0x5170daL,0x5170dbL,
                0x517100L,0x517108L
              };
              for (long g : globals) {
                Address a = toAddr(g);
                out.println("\nGLOBAL " + a);
                ReferenceIterator refs = rm.getReferencesTo(a);
                while (refs.hasNext()) {
                  Reference ref = refs.next();
                  Function f = fm.getFunctionContaining(ref.getFromAddress());
                  out.println("  XREF " + ref.getFromAddress() + " -> " +
                              (f == null ? "<no function>" : f.getName()+"@"+f.getEntryPoint()));
                  if (f != null) decomp(f, "global xref " + a);
                }
              }

              Address gapStart = toAddr(0x403b18L);
              Address gapEnd = toAddr(0x403b6bL);
              AddressSet gap = new AddressSet(gapStart, gapEnd);
              DisassembleCommand gapDisassembly = new DisassembleCommand(gapStart, gap, false);
              boolean gapDecoded = gapDisassembly.applyTo(currentProgram, monitor);
              out.println("FORCED GAP DISASSEMBLY " + gapStart + ".." + gapEnd + " success=" + gapDecoded);

              out.println("\\n===== RAW LINE-WEIGHT DIAGNOSTICS =====");
              dumpInstructions(0x21ec84L, 0x21ed30L);
              dumpInstructions(0x21ed30L, 0x21ee10L);
              dumpInstructions(0x403a80L, 0x403d10L);
              dumpInstructions(0x403cf8L, 0x403d80L);
              dumpInstructions(0x4052b8L, 0x4052f0L);
              Address weightData = toAddr(0x162260L);
              byte[] weightBytes = new byte[16];
              currentProgram.getMemory().getBytes(weightData, weightBytes);
              StringBuilder weightHex = new StringBuilder();
              for (byte b : weightBytes) weightHex.append(String.format("%02x", b & 0xff));
              out.println("RODATA " + weightData + " bytes=" + weightHex);
              for (int i = 0; i < 4; i++) {
                int bits = (weightBytes[i*4] & 0xff) |
                           ((weightBytes[i*4+1] & 0xff) << 8) |
                           ((weightBytes[i*4+2] & 0xff) << 16) |
                           ((weightBytes[i*4+3] & 0xff) << 24);
                out.println("  float[" + i + "] bits=0x" + Integer.toHexString(bits) +
                            " value=" + Float.intBitsToFloat(bits));
              }
              ReferenceIterator weightRefs = rm.getReferencesTo(weightData);
              while (weightRefs.hasNext()) {
                Reference ref = weightRefs.next();
                Function f = fm.getFunctionContaining(ref.getFromAddress());
                out.println("  RODATA XREF " + ref.getFromAddress() + " -> " +
                            (f == null ? "<no function>" : f.getName() + "@" + f.getEntryPoint()));
              }

              out.println("\\n===== RODATA PAGE REFERENCE SCAN 00162000 =====");
              InstructionIterator allInstructions = listing.getInstructions(true);
              while (allInstructions.hasNext()) {
                Instruction instruction = allInstructions.next();
                if (instruction.toString().toLowerCase().contains("0x162000")) {
                  out.println("--- page reference at " + instruction.getAddress() + " ---");
                  Instruction cursor = instruction;
                  for (int i = 0; i < 8 && cursor != null; i++) {
                    out.println(cursor.getAddress() + "  " + cursor);
                    cursor = listing.getInstructionAfter(cursor.getAddress());
                  }
                }
                for (Reference ref : instruction.getReferencesFrom()) {
                  long target = ref.getToAddress().getOffset();
                  if (target >= 0x162240L && target < 0x162280L) {
                    Function f = fm.getFunctionContaining(instruction.getAddress());
                    out.println("RODATA REF " + instruction.getAddress() + " -> " + ref.getToAddress() +
                                " in " + (f == null ? "<no function>" :
                                f.getName() + "@" + f.getEntryPoint()));
                  }
                }
              }

              out.println("\\n===== POSSIBLE 36-BYTE RECORD FIELD +32 STORES =====");
              Map<Function, List<Instruction>> field32Stores = new LinkedHashMap<>();
              InstructionIterator storeScan = listing.getInstructions(true);
              while (storeScan.hasNext()) {
                Instruction instruction = storeScan.next();
                String mnemonic = instruction.getMnemonicString().toLowerCase();
                String text = instruction.toString().toLowerCase();
                if (!(mnemonic.startsWith("str") || mnemonic.startsWith("stur") ||
                      mnemonic.startsWith("stp") || mnemonic.startsWith("stnp"))) continue;
                if (text.contains("[sp") || text.contains(", #0x20]") || text.contains(", #32]")) {
                  if (text.contains("[sp")) continue;
                } else {
                  continue;
                }
                Function f = fm.getFunctionContaining(instruction.getAddress());
                if (f != null) field32Stores.computeIfAbsent(f, k -> new ArrayList<>()).add(instruction);
              }
              out.println("Non-stack functions with a store at immediate offset +32: " + field32Stores.size());
              int strideCandidates = 0;
              for (Map.Entry<Function, List<Instruction>> entry : field32Stores.entrySet()) {
                Function f = entry.getKey();
                boolean hasStride36 = false;
                InstructionIterator body = listing.getInstructions(f.getBody(), true);
                while (body.hasNext()) {
                  String text = body.next().toString().toLowerCase();
                  if (text.contains("#0x24") || text.contains("#36")) {
                    hasStride36 = true;
                    break;
                  }
                }
                if (!hasStride36 && f.getEntryPoint().getOffset() != 0x416154L) continue;
                strideCandidates++;
                out.println("\\nCANDIDATE " + f.getName() + " @ " + f.getEntryPoint() +
                            " direct_stores=" + entry.getValue().size() +
                            " stride_0x24_in_function=" + hasStride36);
                for (Instruction store : entry.getValue()) {
                  Instruction cursor = store;
                  for (int i = 0; i < 6 && cursor != null; i++) {
                    cursor = listing.getInstructionBefore(cursor.getAddress());
                  }
                  for (int i = 0; i < 15 && cursor != null; i++) {
                    out.println(cursor.getAddress() + "  " + cursor);
                    cursor = listing.getInstructionAfter(cursor.getAddress());
                  }
                }
              }
              out.println("Functions retained with stride-36 evidence or known helper anchor: " + strideCandidates);

              out.close();
              di.dispose();
            }
          }
          JAVA

      - name: Analyze
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ghproj
          "$GHIDRA_HOME/support/analyzeHeadless" /tmp/ghproj LightCycleXrefs             -import "$PWD/liblightcycle.so"             -overwrite             -analysisTimeoutPerFile 1800             -scriptPath "$PWD/scripts"             -postScript DumpXrefs.java "$PWD/out/xrefs-decompiled.txt"             > "$PWD/out/ghidra.log" 2>&1
          if [[ ! -s out/xrefs-decompiled.txt ]]; then cat out/ghidra.log; exit 1; fi
          wc -l out/xrefs-decompiled.txt
          grep -nE "Photosphere|target_generator|bundle_adjust|LineMatchResidual|line_matches|seam_finder|multiband|GLOBAL" out/xrefs-decompiled.txt | head -120 || true

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: pixel-camera-lightcycle-xrefs
          path: out/
          if-no-files-found: error
          retention-days: 90
