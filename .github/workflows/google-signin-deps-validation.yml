# validation revision: 12
name: Google sign-in dependency validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: memory-palace
            repository: Persie0/Memory_Palace_Builder
            ref: chore/google-signin-deps-2026-09
          - label: mwst-buchhalter
            repository: Persie0/mwst_buchhalter
            ref: chore/google-signin-deps-2026-09
          - label: vitamindtracker
            repository: Persie0/vitamindtracker
            ref: chore/google-signin-deps-2026-09
          - label: nomadrank
            repository: Persie0/skratch_clone
            ref: chore/google-signin-deps-2026-09
          - label: norwegian-yoyillo
            repository: Persie0/norwegian_yoyillo
            ref: chore/google-signin-deps-2026-09
          - label: punisher
            repository: Persie0/punisher
            ref: chore/google-signin-deps-2026-09

    steps:
      - name: Check private repository token
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
        shell: bash
        run: test -n "$PRIVATE_TOKEN"

      - name: Checkout app branch
        uses: actions/checkout@v5
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.ref }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          path: app
          persist-credentials: true

      - name: Configure private GitHub dependencies
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
        shell: bash
        run: |
          git config --global url."https://x-access-token:${PRIVATE_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve committed dependencies
        id: pub
        continue-on-error: true
        working-directory: app
        shell: bash
        run: flutter pub get >/tmp/pub-get.log 2>&1

      - name: Analyze
        id: analyze
        if: steps.pub.outcome == 'success'
        continue-on-error: true
        working-directory: app
        shell: bash
        run: flutter analyze --no-fatal-infos >/tmp/analyze.log 2>&1

      - name: Accept Android SDK licenses and install required NDK
        if: steps.pub.outcome == 'success'
        shell: bash
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          yes | "$SDKMANAGER" "ndk;29.0.13599879" >/dev/null 2>&1 || true

      - name: Build Android debug APK
        id: build
        if: steps.pub.outcome == 'success'
        continue-on-error: true
        working-directory: app
        shell: bash
        run: flutter build apk --debug >/tmp/build.log 2>&1

      - name: Record sanitized result and refreshed lockfile
        if: always()
        working-directory: app
        shell: bash
        env:
          PUB_OUTCOME: ${{ steps.pub.outcome }}
          ANALYZE_OUTCOME: ${{ steps.analyze.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          set -euo pipefail
          mkdir -p .ci
          APP_HEAD="$(git rev-parse HEAD)"
          printf 'validator=%s\napp_head=%s\npub=%s\nanalyze=%s\nbuild=%s\n' \
            "$GITHUB_SHA" "$APP_HEAD" "$PUB_OUTCOME" "$ANALYZE_OUTCOME" "$BUILD_OUTCOME" \
            > .ci/google-signin-deps-validation.txt

          if [ "$PUB_OUTCOME" != "success" ]; then
            printf '\n[pub-tail]\n' >> .ci/google-signin-deps-validation.txt
            tail -n 35 /tmp/pub-get.log >> .ci/google-signin-deps-validation.txt
          fi
          if [ "$ANALYZE_OUTCOME" = "failure" ]; then
            printf '\n[analyze-tail]\n' >> .ci/google-signin-deps-validation.txt
            tail -n 45 /tmp/analyze.log >> .ci/google-signin-deps-validation.txt
          fi
          if [ "$BUILD_OUTCOME" = "failure" ]; then
            printf '\n[build-tail]\n' >> .ci/google-signin-deps-validation.txt
            tail -n 45 /tmp/build.log >> .ci/google-signin-deps-validation.txt
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ci/google-signin-deps-validation.txt

          if [ "$PUB_OUTCOME" = "success" ]; then
            git add pubspec.lock
          fi

          git commit -m "ci: record dependency validation"
          git push origin "HEAD:${{ matrix.ref }}"

          if [ "$PUB_OUTCOME" != "success" ] ||
             [ "$ANALYZE_OUTCOME" != "success" ] ||
             [ "$BUILD_OUTCOME" != "success" ]; then
            exit 1
          fi
