name: Image Enhancer ad fallback regression review

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout image_enhancer fix branch
        uses: actions/checkout@v4
        with:
          repository: Persie0/image_enhancer
          ref: fix/ads-unavailable-allow-processing
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          path: image_enhancer
          fetch-depth: 1

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        working-directory: image_enhancer
        run: flutter pub get

      - name: Verify changed Dart files are formatted
        working-directory: image_enhancer
        run: |
          dart format --output=none --set-exit-if-changed \
            lib/services/ad_supported_processing.dart \
            lib/adbanner.dart \
            lib/model_selection_page.dart \
            lib/super_resolution_home_page.dart \
            test/ad_supported_processing_test.dart \
            test/engagement_soft_paywall_pro_guard_test.dart

      - name: Targeted regressions
        working-directory: image_enhancer
        run: |
          flutter test test/ad_supported_processing_test.dart --reporter expanded
          flutter test test/free_enhancement_quota_test.dart --reporter expanded
          flutter test test/engagement_soft_paywall_pro_guard_test.dart --reporter expanded

      - name: Full Flutter regression suite
        working-directory: image_enhancer
        run: flutter test --concurrency=2 --timeout 2m --reporter compact

      - name: Analyze changed code and dependencies
        working-directory: image_enhancer
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
