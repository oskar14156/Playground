name: Format image_enhancer regression in root context

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_ENHANCER_REF: feature/storage-backed-full-resolution

jobs:
  format-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Persie0/image_enhancer
          ref: ${{ env.IMAGE_ENHANCER_REF }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          path: image_enhancer
          fetch-depth: 1
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve root dependencies
        working-directory: image_enhancer
        run: flutter pub get
      - name: Format in root context
        working-directory: image_enhancer
        run: dart format flutter_super_resolution/test/file_upscale_existing_output_test.dart
      - name: Commit only formatted regression
        working-directory: image_enhancer
        run: |
          set -euo pipefail
          if git diff --quiet -- flutter_super_resolution/test/file_upscale_existing_output_test.dart; then
            echo 'Already formatted in root context.'
            exit 0
          fi
          git config user.name 'Persie0'
          git config user.email '76871553+Persie0@users.noreply.github.com'
          git add flutter_super_resolution/test/file_upscale_existing_output_test.dart
          git commit -m 'style: format output regression in app context'
          git push origin HEAD:${IMAGE_ENHANCER_REF}
