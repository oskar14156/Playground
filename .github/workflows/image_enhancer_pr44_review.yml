name: Verify image_enhancer PR 44

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_ENHANCER_REF: adfcd4b3367195d973bea2ff8a6e5de0b1b23716

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact merge candidate
        uses: actions/checkout@v5
        with:
          repository: Persie0/image_enhancer
          ref: ${{ env.IMAGE_ENHANCER_REF }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          path: image_enhancer
          fetch-depth: 1

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependencies
        working-directory: image_enhancer
        run: flutter pub get

      - name: Soft paywall regression test
        working-directory: image_enhancer
        run: flutter test test/engagement_soft_paywall_pro_guard_test.dart --reporter expanded

      - name: Full Flutter test suite
        working-directory: image_enhancer
        run: flutter test --concurrency=1 --timeout 2m --reporter expanded

      - name: Analyzer
        working-directory: image_enhancer
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
