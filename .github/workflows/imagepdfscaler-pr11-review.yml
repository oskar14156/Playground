name: ImagePdfScaler PR11 review
# Validation pass 3: interpolation lint adjusted
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check private repo access token
        env:
          APP_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: test -n "$APP_TOKEN"
      - uses: actions/checkout@v4
        with:
          repository: Persie0/ImagePdfScaler
          ref: feature/multi-gallery-text-physical-units-20261011
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: app
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        working-directory: app
        run: flutter pub get
      - name: Static analysis
        working-directory: app
        run: flutter analyze --no-pub
      - name: Widget tests for PR11
        working-directory: app
        run: flutter test --no-pub --reporter expanded test/text_editor_units_test.dart test/editor_page_logic_test.dart
      - name: Full Flutter test suite
        working-directory: app
        run: flutter test --no-pub
