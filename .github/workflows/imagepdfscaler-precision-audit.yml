name: ImagePdfScaler precision audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter-precision:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGEPDFSCALER_GEOMETRY_DIR: ${{ github.workspace }}/pdf-fixtures
    steps:
      - name: Check private repository token
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: test -n "$PRIVATE_TOKEN"
      - name: Checkout ImagePdfScaler privately
        uses: actions/checkout@v4
        with:
          repository: Persie0/ImagePdfScaler
          ref: main
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: imagepdfscaler
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Fetch packages
        working-directory: imagepdfscaler
        run: flutter pub get
      - name: Analyze Dart
        working-directory: imagepdfscaler
        run: flutter analyze --no-pub
      - name: Validate country-first onboarding and worldwide formats
        working-directory: imagepdfscaler
        run: flutter test test/paper_catalog_test.dart test/paper_size_picker_test.dart test/editor_page_logic_test.dart --reporter expanded
      - name: Validate all corner-resize interactions
        working-directory: imagepdfscaler
        run: flutter test test/paper_canvas_interaction_test.dart --reporter expanded
      - name: Run all Flutter tests and generate PDFs
        working-directory: imagepdfscaler
        run: flutter test
      - name: Accept Android NDK licenses and install required version
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          # The Android hosted runner can have NDK 29 missing and its
          # preview license unaccepted. Accept it before Gradle configures.
          set +o pipefail
          yes | "$SDKMANAGER" --licenses > /dev/null
          set -o pipefail
          "$SDKMANAGER" --install "ndk;29.0.13599879"
      - name: Build Android debug APK
        working-directory: imagepdfscaler
        run: flutter build apk --debug --no-pub
      - name: Inspect actual PDF geometry
        run: |
          python3 -m pip install --user pymupdf
          python3 imagepdfscaler/tool/verify_pdf_geometry.py "$IMAGEPDFSCALER_GEOMETRY_DIR"
      - name: Upload synthetic geometry fixtures on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: imagepdfscaler-geometry-fixtures
          path: pdf-fixtures/
          if-no-files-found: ignore
