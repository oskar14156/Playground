name: ImagePdfScaler zoom and padding review
# Rerun after correcting physical auto-size wrapping
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Verify private checkout token
        env:
          APP_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: test -n "$APP_TOKEN"
      - uses: actions/checkout@v4
        with:
          repository: Persie0/ImagePdfScaler
          ref: fix/sheet-zoom-text-padding-compact-settings-20261012
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: app
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Dependencies
        working-directory: app
        run: flutter pub get
      - name: Analyze
        working-directory: app
        run: flutter analyze --no-pub
      - name: Focused widget tests
        working-directory: app
        run: flutter test --no-pub --reporter expanded test/text_editor_units_test.dart test/editor_page_logic_test.dart test/paper_canvas_interaction_test.dart
      - name: Full Flutter tests
        working-directory: app
        run: flutter test --no-pub
