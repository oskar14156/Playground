name: Inspect Pixel Camera LightCycle native library

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Download exact Pixel Camera APK
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3             "https://github.com/Persie0/decompile/releases/download/pho/com.google.android.GoogleCamera_8.8.225.510547499.09-66251366_minAPI33.arm64-v8a.nodpi._apkmirror.com.apk"             -o camera.apk
          echo "9ca2264cbf5680c8b5b740e53849c1586c53436a7e860616584c0349dba37c47  camera.apk" | sha256sum -c -

      - name: Locate and inspect liblightcycle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          unzip -l camera.apk | grep -i 'liblightcycle' | tee out/apk-lightcycle-paths.txt
          path="$(unzip -Z1 camera.apk | grep -E '(^|/)liblightcycle\.so$' | head -1)"
          test -n "$path"
          unzip -p camera.apk "$path" > liblightcycle.so
          file liblightcycle.so | tee out/file.txt
          sha256sum liblightcycle.so | tee out/sha256.txt
          readelf -h liblightcycle.so > out/readelf-header.txt
          readelf -d liblightcycle.so > out/readelf-dynamic.txt
          readelf -Ws liblightcycle.so > out/readelf-symbols.txt || true
          nm -D -C liblightcycle.so > out/nm-dynamic-demangled.txt || true
          strings -a -t x -n 4 liblightcycle.so > out/strings-offsets.txt
          strings -a -n 4 liblightcycle.so > out/strings-all.txt

          grep -Ei             'stitch|mosaic|blend|seam|feature|align|homograph|warp|spher|equirect|panorama|gyro|target|camera|jpeg|render|bundle|ransac|exposure|vignette|optimi|rotation|pose|orb|sift|surf|brief|patch|pyramid|multi.?band|graph.?cut|fisheye|horizontal|vertical|wide'             out/strings-all.txt > out/strings-relevant.txt || true

          {
            echo "## JNI exports"
            grep -E 'Java_.*LightCycleNative|LightCycleNative' out/nm-dynamic-demangled.txt || true
            echo
            echo "## Relevant readable strings"
            cat out/strings-relevant.txt
          } > out/lightcycle-native-summary.txt

      - name: Disassemble JNI entry points
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils-aarch64-linux-gnu
          aarch64-linux-gnu-objdump -d --no-show-raw-insn liblightcycle.so > out/full-disassembly.txt

          python3 - <<'PY'
          import re
          from pathlib import Path

          syms = {}
          for line in Path("out/readelf-symbols.txt").read_text(errors="replace").splitlines():
              m = re.search(r"\s+([0-9a-fA-F]+)\s+(\d+)\s+FUNC\s+GLOBAL.*\s(Java_com_google_android_apps_lightcycle_panorama_LightCycleNative_[^@\s]+)", line)
              if m:
                  syms[m.group(3)] = (int(m.group(1), 16), int(m.group(2)))

          wanted = [
              "ResetForPhotoSphereCapture",
              "ProcessFrame",
              "TakeNewPhoto",
              "TargetHit",
              "MovingTooFast",
              "PhotoSkippedTooFast",
              "AddImage",
              "AlignNextImage",
              "FinishCapture",
              "CreateNewStitchingSession",
              "RenderNextSession",
              "InitTargets",
              "GetTargets",
              "GetTargetInRange",
              "SetTargetHitAngleRadians",
              "SetFilteredRotation",
              "StartGyroCalibration",
              "EndGyroCalibration",
              "SetOutputResolutionLarge",
              "NumImagesInQueue",
              "NumImagesTotal",
          ]

          lines = Path("out/full-disassembly.txt").read_text(errors="replace").splitlines()
          out = []
          for suffix in wanted:
              full = "Java_com_google_android_apps_lightcycle_panorama_LightCycleNative_" + suffix
              if full not in syms:
                  continue
              addr, size = syms[full]
              out.append(f"\n===== {suffix} @ 0x{addr:x}, size {size} =====")
              start = False
              end = addr + size
              for line in lines:
                  mm = re.match(r"\s*([0-9a-fA-F]+):", line)
                  if not mm:
                      if start and line and not line.startswith(" "):
                          pass
                      continue
                  a = int(mm.group(1), 16)
                  if addr <= a < end:
                      start = True
                      out.append(line)
                  elif start and a >= end:
                      break
          Path("out/jni-targeted-disassembly.txt").write_text("\n".join(out) + "\n")
          PY

      - name: Set up Python 3.11 for angr
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Decompile targeted JNI call graph with angr
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-input 'cffi<2' 'pycparser==2.22' 'angr==9.2.180' 'pyelftools==0.32' 'capstone==5.0.3'
          cat > /tmp/decompile_lightcycle.py <<'PY'
          import traceback
          from pathlib import Path
          import angr

          ROOTS = [
              "Java_com_google_android_apps_lightcycle_panorama_LightCycleNative_ResetForPhotoSphereCapture",
              "Java_com_google_android_apps_lightcycle_panorama_LightCycleNative_ProcessFrame",
              "Java_com_google_android_apps_lightcycle_panorama_LightCycleNative_TakeNewPhoto",
              "Java_com_google_android_apps_lightcycle_panorama_LightCycleNative_TargetHit",
              "Java_com_google_android_apps_lightcycle_panorama_LightCycleNative_MovingTooFast",
              "Java_com_google_android_apps_lightcycle_panorama_LightCycleNative_PhotoSkippedTooFast",
              "Java_com_google_android_apps_lightcycle_panorama_LightCycleNative_AddImage",
              "Java_com_google_android_apps_lightcycle_panorama_LightCycleNative_AlignNextImage",
              "Java_com_google_android_apps_lightcycle_panorama_LightCycleNative_FinishCapture",
              "Java_com_google_android_apps_lightcycle_panorama_LightCycleNative_CreateNewStitchingSession",
              "Java_com_google_android_apps_lightcycle_panorama_LightCycleNative_RenderNextSession",
              "Java_com_google_android_apps_lightcycle_panorama_LightCycleNative_InitTargets",
              "Java_com_google_android_apps_lightcycle_panorama_LightCycleNative_GetTargets",
              "Java_com_google_android_apps_lightcycle_panorama_LightCycleNative_GetTargetInRange",
              "Java_com_google_android_apps_lightcycle_panorama_LightCycleNative_SetTargetHitAngleRadians",
              "Java_com_google_android_apps_lightcycle_panorama_LightCycleNative_SetFilteredRotation",
              "Java_com_google_android_apps_lightcycle_panorama_LightCycleNative_StartGyroCalibration",
              "Java_com_google_android_apps_lightcycle_panorama_LightCycleNative_EndGyroCalibration",
          ]

          p = angr.Project("liblightcycle.so", auto_load_libs=False)
          cfg = p.analyses.CFGFast(normalize=True, data_references=True, force_complete_scan=False)
          base = p.loader.main_object.mapped_base

          def off(addr):
              return addr - base

          report = []
          callmap = []
          visited = set()

          for root_name in ROOTS:
              sym = p.loader.find_symbol(root_name)
              if sym is None:
                  report.append(f"\n## {root_name}\nSYMBOL NOT FOUND\n")
                  continue
              root_addr = sym.rebased_addr
              root_func = cfg.functions.get(root_addr)
              report.append(f"\n\n# ROOT {root_name} offset=0x{off(root_addr):x}\n")
              if root_func is None:
                  report.append("CFG FUNCTION NOT FOUND\n")
                  continue

              queue = [(root_func, 0)]
              local_seen = set()
              while queue:
                  func, depth = queue.pop(0)
                  if func.addr in local_seen or depth > 2 or len(local_seen) >= 80:
                      continue
                  local_seen.add(func.addr)
                  name = func.name
                  report.append(
                      f"\n## depth={depth} {name} offset=0x{off(func.addr):x} "
                      f"size={getattr(func, 'size', 0)}\n"
                  )
                  try:
                      dec = p.analyses.Decompiler(func, cfg=cfg)
                      if dec.codegen is not None:
                          report.append(dec.codegen.text)
                      else:
                          report.append("[no decompiler output]")
                  except Exception:
                      report.append("[decompiler exception]\n" + traceback.format_exc())

                  succ = []
                  try:
                      for a in cfg.functions.callgraph.successors(func.addr):
                          f2 = cfg.functions.get(a)
                          if f2 is not None:
                              succ.append(f2)
                              callmap.append(
                                  f"{root_name}\t{depth}\t0x{off(func.addr):x}\t{name}"
                                  f"\t->\t0x{off(f2.addr):x}\t{f2.name}"
                              )
                  except Exception:
                      pass

                  # Follow only internal functions, not SimProcedures/import stubs.
                  for f2 in succ:
                      if p.loader.main_object.contains_addr(f2.addr):
                          queue.append((f2, depth + 1))

          Path("out/angr-targeted-decompile.txt").write_text("\n".join(report))
          Path("out/angr-targeted-callgraph.tsv").write_text("\n".join(callmap) + "\n")
          PY
          python3 /tmp/decompile_lightcycle.py


      - name: Resolve GOT globals, status-byte xrefs and relocation-backed objects
        shell: bash
        run: |
          set -euo pipefail
          readelf -rW liblightcycle.so > out/readelf-relocations.txt
          readelf -SW liblightcycle.so > out/readelf-sections.txt
          aarch64-linux-gnu-objdump -s -j .data.rel.ro liblightcycle.so > out/data-rel-ro.txt 2>/dev/null || true
          aarch64-linux-gnu-objdump -s -j .got liblightcycle.so > out/got.txt 2>/dev/null || true

          cat > /tmp/resolve_lightcycle_refs.py <<'PY'
          from pathlib import Path
          from collections import defaultdict
          from elftools.elf.elffile import ELFFile
          from capstone import Cs, CS_ARCH_ARM64, CS_MODE_LITTLE_ENDIAN
          from capstone.arm64 import ARM64_OP_IMM, ARM64_OP_MEM, ARM64_OP_REG

          TARGETS = {
              0x8170c8: "renderer_queue_or_manager",
              0x8170d0: "active_capture_session",
              0x8170d8: "TargetHit",
              0x8170d9: "TakeNewPhoto",
              0x8170da: "MovingTooFast",
              0x8170db: "PhotoSkippedTooFast",
              0x817100: "gyro_or_rotation_manager",
              0x81710c: "stitch_session_counter",
          }

          with open("liblightcycle.so", "rb") as fh:
              elf = ELFFile(fh)
              relocs = {}
              rows = []
              for sec in elf.iter_sections():
                  if not hasattr(sec, "iter_relocations"):
                      continue
                  symtab = elf.get_section(sec["sh_link"]) if sec["sh_link"] else None
                  for rel in sec.iter_relocations():
                      off = rel["r_offset"]
                      addend = rel.entry.get("r_addend", 0)
                      name = ""
                      idx = rel.entry.get("r_info_sym", 0)
                      if symtab is not None and idx:
                          try:
                              name = symtab.get_symbol(idx).name
                          except Exception:
                              pass
                      relocs[off] = (addend, name, rel.entry.get("r_info_type", 0))
                      rows.append((off, addend, name, rel.entry.get("r_info_type", 0), sec.name))

              Path("out/relocations-near-lightcycle-globals.txt").write_text(
                  "\n".join(
                      f"reloc=0x{off:x} addend=0x{addend:x} target={TARGETS.get(addend,'')} "
                      f"symbol={name} type={rtype} section={secname}"
                      for off, addend, name, rtype, secname in rows
                      if addend in TARGETS or 0x817080 <= addend <= 0x817180
                  ) + "\n"
              )

              text = elf.get_section_by_name(".text")
              code = text.data()
              base = text["sh_addr"]

          md = Cs(CS_ARCH_ARM64, CS_MODE_LITTLE_ENDIAN)
          md.detail = True
          insns = list(md.disasm(code, base))

          # Map GOT relocation slots to the local objects/bytes they ultimately point at.
          got_target = {}
          for off, (addend, name, rtype) in relocs.items():
              if addend in TARGETS:
                  got_target[off] = (addend, TARGETS[addend])

          # Small local constant-propagation pass for ADRP -> ADD/LDR GOT sequences.
          refs = []
          reg_page = {}
          ptr_regs = {}
          for ins in insns:
              m = ins.mnemonic
              ops = ins.operands
              # Flush state at obvious control-flow boundaries.
              if m in {"ret", "br", "blr", "b"}:
                  if m != "blr":
                      reg_page.clear()
                      ptr_regs.clear()
              if m == "adrp" and len(ops) >= 2 and ops[0].type == ARM64_OP_REG and ops[1].type == ARM64_OP_IMM:
                  reg_page[ops[0].reg] = ops[1].imm
                  continue
              if m == "add" and len(ops) >= 3 and ops[0].type == ARM64_OP_REG and ops[1].type == ARM64_OP_REG and ops[2].type == ARM64_OP_IMM:
                  if ops[1].reg in reg_page:
                      reg_page[ops[0].reg] = reg_page[ops[1].reg] + ops[2].imm
                  continue
              if m.startswith("ldr") and len(ops) >= 2 and ops[0].type == ARM64_OP_REG and ops[1].type == ARM64_OP_MEM:
                  mem = ops[1].mem
                  if mem.base in reg_page:
                      slot = reg_page[mem.base] + mem.disp
                      if slot in got_target:
                          target, label = got_target[slot]
                          ptr_regs[ops[0].reg] = (target, label, slot, ins.address)
                          refs.append((ins.address, "LOAD_PTR", label, target, slot, ins.mnemonic, ins.op_str))
                  continue
              if m.startswith("str") and len(ops) >= 2 and ops[1].type == ARM64_OP_MEM:
                  mem = ops[1].mem
                  if mem.base in ptr_regs:
                      target, label, slot, load_addr = ptr_regs[mem.base]
                      refs.append((ins.address, "WRITE", label, target, slot, ins.mnemonic, ins.op_str))
              if m.startswith("ldr") and len(ops) >= 2 and ops[1].type == ARM64_OP_MEM:
                  mem = ops[1].mem
                  if mem.base in ptr_regs:
                      target, label, slot, load_addr = ptr_regs[mem.base]
                      refs.append((ins.address, "READ", label, target, slot, ins.mnemonic, ins.op_str))

          Path("out/global-xrefs.tsv").write_text(
              "address\tkind\tlabel\ttarget\tgot_slot\tinstruction\n" +
              "\n".join(
                  f"0x{a:x}\t{k}\t{label}\t0x{target:x}\t0x{slot:x}\t{mn} {op}"
                  for a,k,label,target,slot,mn,op in refs
              ) + "\n"
          )

          # Emit disassembly context around every actual write to one of the four state bytes.
          by_addr = {i.address: n for n, i in enumerate(insns)}
          chunks = []
          for a,k,label,target,slot,mn,op in refs:
              if k != "WRITE" or target not in (0x8170d8,0x8170d9,0x8170da,0x8170db):
                  continue
              n = by_addr[a]
              chunks.append(f"===== WRITE {label} at 0x{a:x} =====")
              for ii in insns[max(0,n-24):min(len(insns),n+25)]:
                  chunks.append(f"{ii.address:08x}:\t{ii.mnemonic}\t{ii.op_str}")
              chunks.append("")
          Path("out/status-byte-write-context.txt").write_text("\n".join(chunks))
          PY
          python3 /tmp/resolve_lightcycle_refs.py

      - name: Extract parameter and algorithm strings
        shell: bash
        run: |
          set -euo pipefail
          grep -Ein             'photosphere_parameters|target_generator|target_manager|overlap|fov|field.of.view|blend_levels|num_targets|target.*angle|capture.*angle|angular|moving.too.fast|photo.*too.fast|ransac|bundle|residual|focal|seam|exposure|gamma|pyramid|flow|line.*match|point.*match|render.*resolution|output.*resolution|mosaic.*size|full_pano|cropped_area|yaw_correction|source_photos'             out/strings-all.txt > out/algorithm-parameter-strings.txt || true

      - name: Upload native inspection
        uses: actions/upload-artifact@v4
        with:
          name: pixel-camera-lightcycle-native-deep-inspection
          path: out/
          if-no-files-found: error
          retention-days: 90
