name: Inspect LightCycle relocations

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download and extract exact native library
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3             "https://github.com/Persie0/decompile/releases/download/pho/com.google.android.GoogleCamera_8.8.225.510547499.09-66251366_minAPI33.arm64-v8a.nodpi._apkmirror.com.apk"             -o camera.apk
          echo "9ca2264cbf5680c8b5b740e53849c1586c53436a7e860616584c0349dba37c47  camera.apk" | sha256sum -c -
          path="$(unzip -Z1 camera.apk | grep -E '(^|/)liblightcycle\.so$' | head -1)"
          unzip -p camera.apk "$path" > liblightcycle.so

      - name: Dump relocations and data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          readelf -rW liblightcycle.so > out/readelf-relocations.txt
          readelf -SW liblightcycle.so > out/readelf-sections.txt
          objdump -R liblightcycle.so > out/objdump-relocations.txt || true
          readelf -x .data liblightcycle.so > out/data-hex.txt || true
          readelf -x .got liblightcycle.so > out/got-hex.txt || true
          readelf -x .got.plt liblightcycle.so > out/got-plt-hex.txt || true
          # Photosphere/render parameter tables referenced by photosphere_parameters.cc.
          xxd -g 4 -s 0x61700 -l 0x600 liblightcycle.so > out/photosphere-parameter-bytes.txt
          xxd -g 1 -s 0x62900 -l 0x120 liblightcycle.so > out/target-generator-switch-table.txt
          xxd -g 1 -s 0x62e00 -l 0x100 liblightcycle.so > out/photosphere-jump-tables.txt

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: pixel-camera-lightcycle-relocations
          path: out/
          if-no-files-found: error
          retention-days: 90
