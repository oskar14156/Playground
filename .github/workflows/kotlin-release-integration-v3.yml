name: Kotlin release integration validation v3

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Checkout AudioBooster current PR head
        uses: actions/checkout@v4
        with:
          repository: Persie0/Audiobooster
          ref: 0b50d1cadefc13baf1f76a335acf05b983e4b952
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          path: audiobooster

      - name: Checkout release builder current PR head
        uses: actions/checkout@v4
        with:
          repository: Persie0/firebase_tester_builder
          ref: a6d85a009f43a8be973196e65f2d5be11f15b82e
          path: builder

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36"

      - name: Validate builder regression suite and routing
        working-directory: builder
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_play*.py'
          grep -q '          - Audiobooster' .github/workflows/play_kotlin_auto.yml
          grep -q '          - root_detection_app' .github/workflows/play_kotlin_auto.yml
          ! grep -q '          - Audiobooster' .github/workflows/play_auto.yml
          ! grep -q '          - root_detection_app' .github/workflows/play_auto.yml
          grep -q ':app:testDebugUnitTest :app:lintRelease' .github/workflows/play_kotlin_auto.yml
          grep -q ':app:bundleRelease' .github/workflows/play_kotlin_auto.yml
          grep -q 'verify_r8_min_scores.py' .github/workflows/play_kotlin_auto.yml
          grep -q 'secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN' .github/workflows/play_kotlin_auto.yml

      - name: Validate AudioBooster is native-only
        working-directory: audiobooster
        run: |
          set -euo pipefail
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -f old/pubspec.yaml
          test -d old/lib
          test ! -f pubspec.yaml
          test ! -d lib
          ! grep -R -n -E 'io\.flutter|dev\.flutter|flutterEmbedding|GeneratedPluginRegistrant' \
            --exclude-dir=old --exclude-dir=.git .

      - name: Test, lint, and build debug
        working-directory: audiobooster
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon \
            :app:testDebugUnitTest \
            :app:lintRelease \
            :app:assembleDebug \
            :app:assembleDebugAndroidTest \
            --stacktrace

      - name: Build unsigned release AAB
        working-directory: audiobooster
        run: |
          set -euo pipefail
          if [ -f key.properties ]; then mv key.properties key.properties.ci-disabled; fi
          ./gradlew --no-daemon :app:bundleRelease --stacktrace
          test -f app/build/outputs/bundle/release/app-release.aab

      - name: Enforce shared R8 gate
        run: |
          set -euo pipefail
          python builder/.github/scripts/verify_r8_min_scores.py \
            audiobooster/app/build/outputs/bundle/release/app-release.aab
