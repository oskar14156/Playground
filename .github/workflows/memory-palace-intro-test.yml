name: Memory Palace private intro test

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch/tag/SHA in Persie0/Memory_Palace_Builder
        required: false
        default: restore-old-intro-content
        type: string

permissions:
  contents: read

env:
  APP_REPOSITORY: Persie0/Memory_Palace_Builder
  APP_REF: ${{ inputs.ref || 'restore-old-intro-content' }}

jobs:
  intro-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate private checkout token
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
        run: test -n "$PRIVATE_TOKEN"
      - name: Checkout Memory Palace
        uses: actions/checkout@v5
        with:
          repository: ${{ env.APP_REPOSITORY }}
          ref: ${{ env.APP_REF }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          persist-credentials: false
          path: private-app
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        working-directory: private-app
        run: flutter pub get
      - name: Analyze changed intro files
        working-directory: private-app
        run: flutter analyze lib/pages/intro.dart test/pages/intro_content_test.dart
      - name: Run full Flutter test suite
        working-directory: private-app
        run: flutter test
