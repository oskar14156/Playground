name: motionshorts render (Remotion, CPU chunks)
# Branch motionshorts-render only (see AGENTS.md §4b). Renders one Remotion composition in N frame chunks on CPU
# runners (swangle) — video and audio chunks in parallel — then joins them into the final mp4. Manual only:
#   gh workflow run motionshorts-voice.yml -R oskar14156/playground --ref motionshorts-render -f slug=sewer -f args=2700
# args = "<durationInFrames>"            → video + audio chunks, joined + muxed: artifact "result" (<slug>.mp4,
#                                           hook.jpg = contact sheet of the first 8 s, end.jpg = last 4 s)
#        "<durationInFrames> parts=5,6"  → only those video chunks, no join (fetch the part-v5 … artifacts)
on:
  workflow_dispatch:
    inputs:
      slug: { description: "composition id", required: true }
      args: { description: "durationInFrames [parts=…]", default: "" }
      ref: { description: "branch", default: "motionshorts-render" }
permissions:
  contents: read
defaults:
  run: { shell: bash }
env:
  SLUG: ${{ inputs.slug }}
  ARGS: ${{ inputs.args }}
  N: 20
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      parts: ${{ steps.p.outputs.parts }}
    steps:
      - id: p
        run: |
          L=$(echo "$ARGS" | grep -o 'parts=[0-9,]*' | cut -d= -f2 || true)
          if [ -n "$L" ]; then J=$(echo "$L" | tr ',' '\n' | sed 's/.*/"v&"/' | paste -sd, -)
          else J=$( (seq 0 $((N - 1)) | sed 's/.*/"v&"/'; seq 0 $((N - 1)) | sed 's/.*/"a&"/') | paste -sd, -); fi
          echo "parts=[$J]" >> "$GITHUB_OUTPUT"; echo "parts=[$J]"

  part:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        part: ${{ fromJSON(needs.plan.outputs.parts) }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.ref }}", persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - name: Install
        run: |
          sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq fonts-noto-color-emoji >/dev/null || true
          npm ci --no-audit --no-fund --loglevel=error
          npx remotion browser ensure 2>&1 | tail -1
      - name: Render ${{ matrix.part }}
        run: |
          mkdir -p parts
          T0=$(date +%s)
          FRAMES=${ARGS%% *}; K=${{ matrix.part }}; P=${K:1}; A=$(( FRAMES * P / N )); B=$(( FRAMES * (P + 1) / N - 1 ))
          echo "frames $A-$B"
          if [ "${K:0:1}" = a ]; then
            npx remotion render "$SLUG" "parts/aud_$(printf %02d $P).wav" --codec=wav --frames=$A-$B \
              --gl=swangle --concurrency=4 --timeout=240000 --log=error
          else
            npx remotion render "$SLUG" "parts/part_$(printf %02d $P).mp4" --frames=$A-$B --muted --crf=16 \
              --gl=swangle --concurrency=4 --timeout=240000 --log=error
          fi
          echo "took $(( $(date +%s) - T0 )) s"; ls -la parts
      - uses: actions/upload-artifact@v4
        with: { name: "part-${{ matrix.part }}", path: parts, retention-days: 2, compression-level: 0 }

  join:
    needs: part
    if: ${{ !contains(inputs.args, 'parts=') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: "part-*", merge-multiple: true, path: parts }
      - name: Join + mux
        run: |
          sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq ffmpeg >/dev/null
          test $(ls parts/part_*.mp4 | wc -l) -eq $N
          test $(ls parts/aud_*.wav | wc -l) -eq $N
          for f in parts/part_*.mp4; do echo "file '$PWD/$f'"; done > v.txt
          for f in parts/aud_*.wav; do echo "file '$PWD/$f'"; done > a.txt
          ffmpeg -v error -f concat -safe 0 -i v.txt -c:v copy video.mp4
          ffmpeg -v error -f concat -safe 0 -i a.txt -c:a pcm_s16le audio.wav
          mkdir -p res
          ffmpeg -v error -i video.mp4 -i audio.wav -map 0:v -map 1:a -c:v copy -c:a aac -b:a 320k -shortest \
            -movflags +faststart "res/$SLUG.mp4"
          ffmpeg -v error -i video.mp4 -vf "select='lt(n\,240)*not(mod(n\,10))',scale=180:-1,tile=8x3" -fps_mode passthrough -frames:v 1 res/hook.jpg
          D=$(ffprobe -v error -show_entries format=duration -of csv=p=0 video.mp4)
          ffmpeg -v error -sseof -4 -i video.mp4 -vf "fps=2,scale=180:-1,tile=8x1" -frames:v 1 res/end.jpg
          ffprobe -v error -show_entries format=duration -of csv=p=0 "res/$SLUG.mp4"; echo "video $D"; ls -la res
      - uses: actions/upload-artifact@v4
        with: { name: result, path: res, retention-days: 7, compression-level: 0 }
