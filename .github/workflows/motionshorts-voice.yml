name: motionshorts render (Remotion, CPU chunks)
# Branch motionshorts-render only. Renders one Remotion composition in 20 frame chunks on CPU runners (swangle),
# then joins them. Manual only:
#   gh workflow run motionshorts-voice.yml -R oskar14156/playground --ref motionshorts-render -f slug=sewer -f args=2600
# (args = "durationInFrames" for video, "durationInFrames audio" for 20 WAV chunks joined sample-exact).
# "parts=5,6,7" renders only those chunks (no join; fetch the part-N artifacts). Result: artifact "video" with <slug>.mp4 or "audio" with audio.wav.
on:
  workflow_dispatch:
    inputs:
      slug: { description: "composition id", required: true }
      args: { description: "durationInFrames", default: "" }
      ref: { description: "branch", default: "motionshorts-render" }
permissions:
  contents: read
defaults:
  run: { shell: bash }
env:
  SLUG: ${{ inputs.slug }}
  ARGS: ${{ inputs.args }}
  N: 20
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      parts: ${{ steps.p.outputs.parts }}
    steps:
      - id: p
        run: |
          L=$(echo "$ARGS" | grep -o 'parts=[0-9,]*' | cut -d= -f2 || true)
          [ -n "$L" ] || L=$(seq -s, 0 $((N - 1)))
          echo "parts=[$L]" >> "$GITHUB_OUTPUT"; echo "parts=[$L]"

  part:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 21
      matrix:
        part: ${{ fromJSON(needs.plan.outputs.parts) }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.ref }}", persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - name: Install
        run: |
          sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq fonts-noto-color-emoji >/dev/null || true
          npm ci --no-audit --no-fund --loglevel=error
          npx remotion browser ensure 2>&1 | tail -1
          nproc; free -g | head -2
      - name: Render ${{ matrix.part }}
        run: |
          mkdir -p parts
          T0=$(date +%s)
          FRAMES=${ARGS%% *}; P=${{ matrix.part }}; A=$(( FRAMES * P / N )); B=$(( FRAMES * (P + 1) / N - 1 ))
          echo "frames $A-$B"
          if [[ "$ARGS" == *audio* ]]; then
            npx remotion render "$SLUG" "parts/aud_$(printf %02d $P).wav" --codec=wav --frames=$A-$B \
              --gl=swangle --concurrency=4 --timeout=240000 --log=error
          else
            npx remotion render "$SLUG" "parts/part_$(printf %02d $P).mp4" --frames=$A-$B --muted --crf=16 \
              --gl=swangle --concurrency=4 --timeout=240000 --log=error
          fi
          echo "took $(( $(date +%s) - T0 )) s"; ls -la parts
      - uses: actions/upload-artifact@v4
        with: { name: "part-${{ matrix.part }}", path: parts, retention-days: 2, compression-level: 0 }

  join:
    needs: part
    if: ${{ !contains(inputs.args, 'parts=') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: "part-*", merge-multiple: true, path: parts }
      - name: Join
        run: |
          sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq ffmpeg >/dev/null
          ls parts
          if [[ "$ARGS" == *audio* ]]; then
            test $(ls parts/aud_*.wav | wc -l) -eq $N
            for f in parts/aud_*.wav; do echo "file '$PWD/$f'"; done > list.txt
            ffmpeg -v error -f concat -safe 0 -i list.txt -c:a pcm_s16le out.wav
            mkdir -p res && mv out.wav res/audio.wav
          else
            test $(ls parts/part_*.mp4 | wc -l) -eq $N
            for f in parts/part_*.mp4; do echo "file '$PWD/$f'"; done > list.txt
            mkdir -p res && ffmpeg -v error -f concat -safe 0 -i list.txt -c:v copy -movflags +faststart "res/$SLUG.mp4"
          fi
          ffprobe -v error -show_entries format=duration -of csv=p=0 res/*; ls -la res
      - uses: actions/upload-artifact@v4
        with: { name: result, path: res, retention-days: 7, compression-level: 0 }
