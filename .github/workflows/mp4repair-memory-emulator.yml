# Self-contained test harness for the private MP4 Repair code.
# Only oskar14156/playground executes CI. The app repository is checked
# out read-only using the existing CI bridge secret; its own CI is not used.
name: MP4 Repair build 13 memory regression + emulator
on:
  push:
    paths:
      - .github/workflows/mp4repair-memory-emulator.yml
      - .github/scripts/mp4repair-emulator-smoke.sh
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: TypeScript, lint and Jest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout private MP4 Repair branch
        uses: actions/checkout@v4
        with:
          repository: oskar14156/mp4repair
          ref: fix/build13-android-memory
          token: ${{ secrets.CI_BRIDGE_READ_TOKEN }}
          persist-credentials: false
          path: app
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        working-directory: app
        run: npm ci --no-audit --no-fund
      - name: Test and static analysis
        working-directory: app
        run: |
          npm run typecheck
          npm run lint
          npm run format:check
          npm run test:ci
      - name: Remove private checkout
        if: always()
        run: rm -rf app

  emulator:
    name: Android emulator install and real sample repair
    # Updating the workflow solely to re-check formatting should not duplicate
    # an Android build already running in a different workflow attempt.
    if: github.event.head_commit.message != 'Rerun MP4Repair code checks'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout private MP4 Repair branch
        uses: actions/checkout@v4
        with:
          repository: oskar14156/mp4repair
          ref: fix/build13-android-memory
          token: ${{ secrets.CI_BRIDGE_READ_TOKEN }}
          persist-credentials: false
          path: app
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install dependencies
        working-directory: app
        run: npm ci --no-audit --no-fund
      - name: Bundle JS into the debug APK (no Metro)
        working-directory: app
        run: |
          mkdir -p android/app/src/debug/assets android/app/src/debug/res
          node node_modules/react-native/cli.js bundle \
            --platform android --dev true --entry-file index.js \
            --bundle-output android/app/src/debug/assets/index.android.bundle \
            --assets-dest android/app/src/debug/res
      - name: Build emulator-compatible APK (x86_64 and arm64)
        working-directory: app/android
        env:
          SENTRY_DISABLE_AUTO_UPLOAD: 'true'
        run: ./gradlew assembleDebug -PreactNativeArchitectures=x86_64,arm64-v8a --no-daemon
      - name: Enable Linux KVM hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Checkout Playground's emulator smoke script
        uses: actions/checkout@v4
        with:
          path: ci
      - name: Run on an actual Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          script: bash ci/.github/scripts/mp4repair-emulator-smoke.sh
      - name: Upload emulator APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mp4repair-memory-test-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 2
      - name: Remove private checkout
        if: always()
        run: rm -rf app

