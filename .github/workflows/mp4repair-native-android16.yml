name: MP4Repair Android 16 native media instrumentation
on:
  push:
    paths:
      - .github/workflows/mp4repair-native-android16.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  instrument:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          repository: oskar14156/mp4repair
          ref: fix/build13-android-memory
          token: ${{ secrets.CI_BRIDGE_READ_TOKEN }}
          persist-credentials: false
          path: app
      - uses: actions/checkout@v4
        with:
          path: ci
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install npm dependencies
        working-directory: app
        run: npm ci --no-audit --no-fund
      - name: Build app and Android instrumented test APKs
        working-directory: app/android
        env:
          SENTRY_DISABLE_AUTO_UPLOAD: 'true'
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest -PreactNativeArchitectures=x86_64 --no-daemon
      - name: Generate actual 3840x2160 H.264 stress video
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          ffmpeg -hide_banner -loglevel error -nostdin -y \
            -f lavfi -i testsrc2=size=3840x2160:rate=15:duration=2 \
            -c:v libx264 -threads 2 -preset ultrafast -crf 39 \
            -pix_fmt yuv420p -movflags +faststart /tmp/mp4repair-stress-4k.mp4
          test -s /tmp/mp4repair-stress-4k.mp4
      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Execute native repair engine and decoder tests on Android 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 600
          script: bash ci/.github/scripts/mp4repair-instrumentation.sh
      - name: Erase private checkout and APKs
        if: always()
        run: rm -rf app

# Final test branch: aspect-ratio regression, eight Android instrumentation tests.
