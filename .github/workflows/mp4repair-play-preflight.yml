name: MP4Repair Play Store release preflight
on:
  push:
    paths:
      - .github/workflows/mp4repair-play-preflight.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - name: Checkout MP4Repair test branch (read-only)
        uses: actions/checkout@v4
        with:
          repository: oskar14156/mp4repair
          ref: fix/build13-android-memory
          token: ${{ secrets.CI_BRIDGE_READ_TOKEN }}
          persist-credentials: false
          path: app
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install locked dependencies
        working-directory: app
        run: npm ci --no-audit --no-fund
      - name: Store listing, configuration, types, lint, format, tests
        working-directory: app
        run: npm run check
      - name: Android production billing and release config
        working-directory: app
        run: npm run launch:check:release:android
      - name: Build Android App Bundle with both production device ABIs
        working-directory: app/android
        env:
          SENTRY_DISABLE_AUTO_UPLOAD: 'true'
        run: ./gradlew :app:bundleRelease -PreactNativeArchitectures=armeabi-v7a,arm64-v8a --no-daemon
      - name: Verify generated bundle exists
        run: test -s app/android/app/build/outputs/bundle/release/app-release.aab
      - name: Validate Android version is eligible for upcoming 1.3 release
        working-directory: app
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const gradle=fs.readFileSync('android/app/build.gradle','utf8');
          const code=Number(gradle.match(/versionCode\s+(\d+)/)?.[1]);
          const version=gradle.match(/versionName\s+"([^"]+)"/)?.[1];
          console.log(JSON.stringify({versionCode:code,versionName:version}));
          if(!Number.isInteger(code)||code<14||!/^1\.3(?:\.\d+)?$/.test(version||'')){
            console.error('Not yet stamped for 1.3: versionCode must exceed the currently known 13 and versionName must be 1.3.x');
            process.exit(1);
          }
          NODE
      - name: Erase private source and unsigned artifacts
        if: always()
        run: rm -rf app

# Verify Android 1.3.0 build 14 on unmerged release candidate branch.

# Retest the foreground-only paywall fix in fix/build13-android-memory.
