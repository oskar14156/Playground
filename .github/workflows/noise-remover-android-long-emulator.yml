name: Noise Remover Android long-file emulator
# Persistent Android permission grant watcher survives native Rust/Gradle build.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  long-file-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Checkout private Noise Remover on public runner
        uses: actions/checkout@v4
        with:
          repository: Persie0/noise_remover
          ref: feat/android-long-file-foreground-20261008
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: app
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Flutter setup
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter dependencies
        working-directory: app
        run: flutter pub get
      - name: Ensure Android SDK location
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
      - name: Enable hardware-accelerated emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - name: Test real RNNoise long-file foreground service with Activity backgrounding
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
          script: bash app/tool/run_android_long_foreground_smoke.sh
