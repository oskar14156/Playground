name: Noise Remover Android long-file worker
# Validate combined routing, permission-gated emulator fixture and all foreground tests.
# Verify final model cancellation, resilient events, and background result auto-save.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-long-foreground:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout private Noise Remover
        uses: actions/checkout@v4
        with:
          repository: Persie0/noise_remover
          ref: feat/android-long-file-foreground-20261008
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: app
      - name: Flutter setup
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        working-directory: app
        run: flutter pub get
      - name: Format new long worker and handler (push if necessary)
        working-directory: app
        env:
          GH_ACCESS_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          files=(lib/services/android_long_foreground_worker.dart lib/services/android_bulk_foreground_worker.dart lib/services/android_media_processing_task.dart integration_test/foreground_long_file_processing_test.dart test/services/android_bulk_foreground_worker_test.dart)
          dart format "${files[@]}"
          if ! git diff --quiet -- "${files[@]}"; then
            git config user.name 'Persie0 CI'
            git config user.email '76871553+Persie0@users.noreply.github.com'
            git add -- "${files[@]}"
            git commit -m "style: format headless long-file foreground worker"
            git remote set-url origin "https://x-access-token:${GH_ACCESS_TOKEN}@github.com/Persie0/noise_remover.git"
            git fetch origin feat/android-long-file-foreground-20261008
            git rebase FETCH_HEAD
            git push origin HEAD:feat/android-long-file-foreground-20261008
          fi
      - name: Static analyze long pipeline and Android UI integration
        working-directory: app
        run: >-
          flutter analyze --no-pub
          lib/services/android_long_foreground_worker.dart
          lib/services/android_bulk_foreground_worker.dart
          lib/services/android_media_processing_task.dart
          lib/services/long_file_job_service.dart
          lib/screens/home_screen.dart
          integration_test/foreground_long_file_processing_test.dart
          test/services/android_bulk_foreground_worker_test.dart
      - name: Existing foreground and long-file regressions
        working-directory: app
        run: >-
          flutter test
          test/services/android_bulk_foreground_worker_test.dart
          test/services/long_file_job_state_test.dart
          test/services/android_media_processing_controller_test.dart
          test/services/android_media_processing_service_test.dart
          test/background_processing_foreground_service_regression_test.dart
          test/full_audit_2026_09_05_regression_test.dart
