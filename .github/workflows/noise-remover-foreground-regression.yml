name: Noise Remover foreground regression
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Private Noise Remover ref to test'
        required: false
        default: 'fix/android-foreground-start-notifications-20261007'
        type: string

permissions:
  contents: read

jobs:
  foreground-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Require checkout token
        env:
          GH_ACCESS_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        shell: bash
        run: test -n "$GH_ACCESS_TOKEN"
      - name: Checkout private app (public runner)
        uses: actions/checkout@v4
        with:
          repository: Persie0/noise_remover
          ref: ${{ inputs.ref || 'fix/android-foreground-start-notifications-20261007' }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: app
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve Flutter dependencies
        working-directory: app
        run: flutter pub get
      - name: Format changed Dart files and push corrections to the PR branch
        working-directory: app
        shell: bash
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          APP_REF: ${{ inputs.ref || 'fix/android-foreground-start-notifications-20261007' }}
        run: |
          set -euo pipefail
          # HomeScreen already has pre-existing formatting differences
          # unrelated to this small fix. Avoid wholesale formatting churn.
          files=(
            lib/services/android_media_processing_service.dart
            test/services/android_media_processing_service_test.dart
          )
          dart format "${files[@]}"
          git diff --check
          if ! git diff --quiet -- "${files[@]}"; then
            if [[ "$APP_REF" != "fix/android-foreground-start-notifications-20261007" ]]; then
              echo "Ref is not the foreground-fix branch, refusing to push formatted changes."
              exit 1
            fi
            git config user.name 'Persie0 CI'
            git config user.email '76871553+Persie0@users.noreply.github.com'
            git add -- "${files[@]}"
            git commit -m "style: format Android foreground processing fixes"
            git remote set-url origin "https://x-access-token:${PRIVATE_TOKEN}@github.com/Persie0/noise_remover.git"
            git push origin "HEAD:${APP_REF}"
            git remote set-url origin "https://github.com/Persie0/noise_remover.git"
          fi
      - name: Verify Dart formatting
        working-directory: app
        run: dart format --output=none --set-exit-if-changed lib/services/android_media_processing_service.dart test/services/android_media_processing_service_test.dart
      - name: Run targeted regression tests
        working-directory: app
        run: >-
          flutter test
          test/services/android_media_processing_service_test.dart
          test/background_processing_foreground_service_regression_test.dart
          test/android_foreground_service_manifest_test.dart
          test/background_media_main_settings_regression_test.dart
      - name: Analyze changed implementation
        working-directory: app
        run: flutter analyze --no-pub lib/services/android_media_processing_service.dart lib/screens/home_screen.dart test/services/android_media_processing_service_test.dart
