name: Noise Remover private macOS CI

# Noise Remover macOS verification intentionally runs only from Playground.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Private Noise Remover branch, tag, or SHA
        required: false
        default: macos-release
        type: string

permissions:
  contents: read

env:
  APP_REPOSITORY: Persie0/noise_remover
  APP_REF: ${{ inputs.ref || 'macos-release' }}

jobs:
  macos-test-and-build:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Validate private checkout token
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
        run: test -n "$PRIVATE_TOKEN"

      - name: Checkout private app revision
        uses: actions/checkout@v5
        with:
          repository: ${{ env.APP_REPOSITORY }}
          ref: ${{ env.APP_REF }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          persist-credentials: false
          path: app

      - name: Checkout matching private CI harness
        uses: actions/checkout@v5
        with:
          repository: ${{ env.APP_REPOSITORY }}
          ref: ${{ env.APP_REF }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          persist-credentials: false
          path: private-ci
          sparse-checkout: .github/playground/noise_remover
          sparse-checkout-cone-mode: false

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: dtolnay/rust-toolchain@stable

      - name: Ensure CocoaPods is available
        shell: bash
        run: |
          if ! command -v pod >/dev/null 2>&1; then
            sudo gem install cocoapods -N
          fi
          pod --version

      - name: Prepare macOS toolchain
        shell: bash
        run: |
          flutter config --enable-macos-desktop
          flutter precache --macos
          flutter --version
          rustc --version
          cargo --version
          xcodebuild -version

      - name: Run macOS drag destination regression
        working-directory: app
        run: python3 -m unittest tool/test_macos_drag_destination.py -v

      - name: Run current private macOS harness
        id: harness
        continue-on-error: true
        shell: bash
        run: bash private-ci/.github/playground/noise_remover/run_macos_ci.sh app

      - name: Diagnose release framework signing
        if: steps.harness.outcome == 'failure'
        working-directory: app
        shell: bash
        run: |
          set -u
          echo '=== checked out private revision ==='
          git rev-parse HEAD
          echo '=== Runner code-sign build settings ==='
          xcodebuild -workspace macos/Runner.xcworkspace -scheme Runner -configuration Release -showBuildSettings 2>/dev/null \
            | grep -E '^[[:space:]]*(CODE_SIGN|EXPANDED_CODE_SIGN|DEVELOPMENT_TEAM|FRAMEWORKS_FOLDER_PATH|TARGET_BUILD_DIR|WRAPPER_NAME)' || true
          echo '=== CocoaPods embed-framework scripts ==='
          find macos/Pods/Target\ Support\ Files -type f -name '*frameworks.sh' -print
          while IFS= read -r script; do
            echo "--- $script ---"
            grep -n -E 'code_sign|EXPANDED_CODE_SIGN_IDENTITY|install_framework|libswresample|ffmpeg' "$script" || true
          done < <(find macos/Pods/Target\ Support\ Files -type f -name '*frameworks.sh' -print)
          echo '=== Release embedded framework signatures ==='
          APP='build/macos/Build/Products/Release/Noise Remover.app'
          if [ -d "$APP/Contents/Frameworks" ]; then
            find "$APP/Contents/Frameworks" -maxdepth 1 -type d -name '*.framework' -print | sort | while IFS= read -r framework; do
              echo "--- $framework ---"
              codesign -dvv "$framework" 2>&1 || true
              binary="$framework/Versions/A/$(basename "$framework" .framework)"
              if [ -e "$binary" ]; then
                file "$binary" || true
              fi
            done
          fi
          echo '=== FFmpeg source framework signatures ==='
          find macos -path '*ffmpeg*' -o -path '*libswresample.framework' 2>/dev/null | head -200 || true

      - name: Fail when private harness failed
        if: steps.harness.outcome == 'failure'
        run: exit 1
