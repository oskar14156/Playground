name: Noise Remover macOS signing probe

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Private Noise Remover branch/tag/SHA
        required: false
        default: macos-release
        type: string

permissions:
  contents: read

env:
  APP_REF: ${{ inputs.ref || 'macos-release' }}

jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout private app
        uses: actions/checkout@v5
        with:
          repository: Persie0/noise_remover
          ref: ${{ env.APP_REF }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          persist-credentials: false
          path: app

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate macOS target and pods
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          echo "private_sha=$(git rev-parse HEAD)"
          flutter config --enable-macos-desktop
          flutter pub get
          if [ ! -d macos/Runner.xcodeproj ]; then
            flutter create --platforms=macos --org at.persie0 .
          fi
          python3 tool/setup_macos.py
          (cd macos && pod install)

      - name: Verify Runner signing settings and CocoaPods fallback
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          echo '=== Runner Release signing settings ==='
          settings="$(xcodebuild -workspace macos/Runner.xcworkspace -scheme Runner -configuration Release -showBuildSettings 2>/dev/null)"
          printf '%s\n' "$settings" | grep -E '^[[:space:]]*(CODE_SIGNING_ALLOWED|CODE_SIGNING_REQUIRED|CODE_SIGN_IDENTITY|EXPANDED_CODE_SIGN_IDENTITY|EXPANDED_CODE_SIGN_IDENTITY_NAME|DEVELOPMENT_TEAM|ENABLE_HARDENED_RUNTIME)' || true
          printf '%s\n' "$settings" | grep -q 'CODE_SIGNING_ALLOWED = YES'
          printf '%s\n' "$settings" | grep -q 'CODE_SIGNING_REQUIRED = YES'
          printf '%s\n' "$settings" | grep -q 'CODE_SIGN_IDENTITY = -'

          echo '=== Pods Runner framework embed script ==='
          script="macos/Pods/Target Support Files/Pods-Runner/Pods-Runner-frameworks.sh"
          test -f "$script"
          grep -n -E 'Noise Remover|code_sign_if_enabled|EXPANDED_CODE_SIGN_IDENTITY|CODE_SIGNING_REQUIRED|CODE_SIGNING_ALLOWED|libswresample|libav|ffmpegkit' "$script" || true
          grep -q '# Noise Remover: ad-hoc signing fallback for embedded frameworks' "$script"
          grep -Fq 'if [ "${CODE_SIGNING_ALLOWED:-YES}" != "NO" ] && [ -z "${EXPANDED_CODE_SIGN_IDENTITY:-}" ]; then' "$script"
          grep -Fq 'EXPANDED_CODE_SIGN_IDENTITY="-"' "$script"
          grep -Fq 'EXPANDED_CODE_SIGN_IDENTITY_NAME="Ad Hoc"' "$script"

          echo '=== FFmpeg framework sources referenced by CocoaPods ==='
          grep -q 'ffmpegkit.framework' "$script"
          grep -q 'libavcodec.framework' "$script"
          grep -q 'libswresample.framework' "$script"
