name: Noise Remover PR 206 validation (public runner)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Noise Remover PR branch or revision
        type: string
        required: false
        default: feature/upgrade-deps-sentry-v10

permissions:
  contents: read

jobs:
  flutter-and-android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Confirm private checkout token
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: test -n "$PRIVATE_TOKEN"

      - name: Checkout private Noise Remover revision
        uses: actions/checkout@v4
        with:
          repository: Persie0/noise_remover
          ref: ${{ inputs.ref || 'feature/upgrade-deps-sentry-v10' }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: app

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Resolve dependencies
        working-directory: app
        run: flutter pub get

      - name: Validate translations and Dart analysis
        working-directory: app
        run: |
          flutter gen-l10n
          flutter analyze --no-pub

      - name: Run all Flutter tests
        working-directory: app
        run: flutter test --no-pub

      - name: Compile Android debug APK
        working-directory: app
        run: flutter build apk --debug --no-pub
