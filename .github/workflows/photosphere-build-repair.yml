name: Photosphere build repair

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: photosphere-build-repair
  cancel-in-progress: true

jobs:
  repair-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
    steps:
      - name: Validate repository token
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRIVATE_TOKEN"

      - name: Checkout repair harness
        uses: actions/checkout@v5
        with:
          path: harness

      - name: Checkout Photosphere
        uses: actions/checkout@v5
        with:
          repository: Persie0/Photosphere
          ref: main
          token: ${{ env.PRIVATE_TOKEN }}
          persist-credentials: true
          fetch-depth: 0
          path: app

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply compile fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 harness/tools/repair_photosphere_build.py photosphere app
          python3 harness/tools/patch_photosphere_kotlin.py app

      - name: Generate platform runners
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          cd app
          flutter create --platforms=android,ios --org com.persie --no-pub .
          if ! git ls-files --error-unmatch test/widget_test.dart >/dev/null 2>&1; then
            rm -f test/widget_test.dart
          fi

      - name: Configure platform runners
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          cd app
          dart tool/configure_platforms.dart
          dart tool/set_android_sdk37.dart

      - name: Resolve Flutter dependencies
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          cd app
          flutter pub get

      - name: Format repaired sources
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          cd app
          dart format tool/configure_platforms.dart \
            lib/src/services/math_compat.dart \
            lib/src/services/keypoint_compat.dart \
            lib/src/services/opencv_compat.dart \
            lib/src/services/photosphere_engine.dart \
            lib/src/services/sift_graph_rescue.dart \
            lib/src/services/local_residual_warp.dart \
            lib/src/services/motion_registration_masks.dart \
            lib/src/services/hybrid_local_warp.dart \
            lib/src/services/advanced_photosphere_engine.dart \
            lib/src/services/structure_line_protector.dart \
            lib/src/services/structure_preserving_warp.dart \
            lib/src/services/dynamic_region_cleaner.dart \
            lib/src/services/local_patch_alignment_repair.dart \
            lib/src/services/xfeat_matcher.dart

      - name: Build Android debug APK
        timeout-minutes: 45
        shell: bash
        run: |
          set -euo pipefail
          (cd app && flutter build apk --debug)
          test -f app/build/app/outputs/flutter-apk/app-debug.apk
          ls -lh app/build/app/outputs/flutter-apk/app-debug.apk

      - name: Commit verified Photosphere fixes
        shell: bash
        run: |
          set -euo pipefail
          git -C app config user.name 'Persie0'
          git -C app config user.email '76871553+Persie0@users.noreply.github.com'
          git -C app add lib/src/services tool/configure_platforms.dart
          if git -C app diff --cached --quiet; then
            echo 'No Photosphere source changes to commit.'
          else
            git -C app commit -m 'Fix DartCV compatibility and Android build'
            git -C app push origin HEAD:main
          fi

      - name: Checkout shared builder
        uses: actions/checkout@v5
        with:
          repository: Persie0/firebase_tester_builder
          ref: main
          token: ${{ env.PRIVATE_TOKEN }}
          persist-credentials: true
          fetch-depth: 0
          path: builder

      - name: Patch shared Flutter bootstrap
        shell: bash
        run: |
          set -euo pipefail
          python3 harness/tools/patch_builder_flutter_bootstrap.py builder
          git -C builder diff --check

      - name: Commit shared builder fix
        shell: bash
        run: |
          set -euo pipefail
          git -C builder config user.name 'Persie0'
          git -C builder config user.email '76871553+Persie0@users.noreply.github.com'
          git -C builder add .github/workflows/debug_create_app.yml .github/workflows/debug_build_release_reusable.yml
          if git -C builder diff --cached --quiet; then
            echo 'Shared builder already contains the Flutter bootstrap fix.'
          else
            git -C builder commit -m 'Prepare generated Flutter platforms before builds'
            git -C builder push origin HEAD:main
          fi
