name: Photo Sphere calibration JNI export index
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  raw-disassembly:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and verify exact APK and native library
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN || github.token }}
        run: |
          set -euo pipefail
          curl -fL --retry 3 -H "Authorization: Bearer $GH_TOKEN" \
            "https://github.com/Persie0/decompile/releases/download/pho/com.google.android.GoogleCamera_8.8.225.510547499.09-66251366_minAPI33.arm64-v8a.nodpi._apkmirror.com.apk" -o camera.apk
          echo "9ca2264cbf5680c8b5b740e53849c1586c53436a7e860616584c0349dba37c47  camera.apk" | sha256sum -c -
          unzip -p camera.apk lib/arm64-v8a/liblightcycle.so > liblightcycle.so
          echo "878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1  liblightcycle.so" | sha256sum -c -
      - name: Install lightweight pinned ARM64 decoder
        run: python3 -m pip install --disable-pip-version-check capstone==5.0.6
      - name: Index calibration and distortion JNI entry points
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          readelf -Ws liblightcycle.so > out/native-symbols.txt
          echo "=== JNI LightCycle calibration/field of view ==="
          grep -Ei 'Calibrat|Fov|FieldOfView|Distort|Lens|Undistort' out/native-symbols.txt | head -n 130 || true
          echo "=== JNI calibration syms with code VA ==="
          python3 - <<'PY' | tee out/jni-code-addresses.txt
          import re
          from pathlib import Path
          for line in Path('out/native-symbols.txt').read_text().splitlines():
              if re.search('Java_com_google_android_apps_lightcycle.*(?:Calibrat|Fov|FieldOfView)',line,re.I):
                  print(line)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: photosphere-calibration-jni-80
          path: out/
          retention-days: 3
