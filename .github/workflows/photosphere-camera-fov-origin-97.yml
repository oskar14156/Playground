name: Photo Sphere camera FOV origin 97
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Fetch and verify exact Google Camera APK
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN || github.token }}
        run: |
          set -euo pipefail
          curl -fL --retry 3 -H "Authorization: Bearer $GH_TOKEN" \
            "https://github.com/Persie0/decompile/releases/download/pho/com.google.android.GoogleCamera_8.8.225.510547499.09-66251366_minAPI33.arm64-v8a.nodpi._apkmirror.com.apk" -o camera.apk
          echo "9ca2264cbf5680c8b5b740e53849c1586c53436a7e860616584c0349dba37c47  camera.apk" | sha256sum -c -
      - name: Fetch pinned JADX v1.5.6
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 "https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip" -o jadx.zip
          mkdir -p jadx-dist
          unzip -q jadx.zip -d jadx-dist
          chmod +x jadx-dist/bin/jadx
      - name: Decompile only in public Playground runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/java
          set +e
          jadx-dist/bin/jadx --no-res --threads-count 4 -d out/java camera.apk 2>&1 | tee out/jadx.log
          jadx_status=${PIPESTATUS[0]}
          set -e
          test -d out/java/sources
          java_files=$(find out/java/sources -name '*.java' | wc -l)
          echo "JAVA_FILE_COUNT=$java_files"
          test "$java_files" -ge 4000
          if [[ "$jadx_status" != 0 ]]; then
            echo "WARNING: JADX returned $jadx_status; scanning successfully generated classes only."
            echo "WARNING: Unrecovered or errored classes are not evidence of missing behavior."
          fi
          if [[ "$jadx_status" != 0 && "$jadx_status" != 3 ]]; then exit "$jadx_status"; fi
      - name: Locate Java controller FOV input and saved calibration reads
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/fov
          python3 - <<'PY' | tee out/fov/readback.txt
          from pathlib import Path
          import re
          root=Path('out/java/sources')
          targets={
              'defpackage/exm.java':('this.K', 'din.a', 'exd.a('),
              'defpackage/foc.java':('bnqVar.e().u','exd.a(', 'LightCycleNative.Init('),
              'defpackage/exd.java':('public static float a(', 'Build.MANUFACTURER','Build.DEVICE'),
          }
          for name,patterns in targets.items():
              p=root/name
              if not p.exists():
                  print('MISSING',name);continue
              lines=p.read_text(errors='replace').splitlines()
              print('===== CLASS',name,'TOTAL',len(lines),'=====')
              for pat in patterns:
                  match=[i for i,l in enumerate(lines) if pat in l]
                  print('PATTERN',pat,'MATCHES',len(match))
                  printed=set()
                  for i in match[:30]:
                      for j in range(max(0,i-8),min(len(lines),i+12)):
                          if j not in printed:
                              print(f'{j+1}: {lines[j]}')
                              printed.add(j)
          print('===== CALIBRATED_FOV_LITERAL_REFERENCES =====')
          for p in root.rglob('*.java'):
              if p.name.endswith('R.java'):continue
              try:
                  lines=p.read_text(errors='replace').splitlines()
              except OSError:continue
              found=[i for i,l in enumerate(lines) if 'photoSphereCalibratedFieldOfView' in l]
              if not found:continue
              print('FILE',p.relative_to(root),'COUNT',len(found))
              for i in found[:12]:
                  for j in range(max(0,i-6),min(len(lines),i+9)):
                      print(f'{j+1}: {lines[j]}')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: photosphere-java-fov-origin-97
          path: |
            out/jadx.log
            out/fov/readback.txt
          retention-days: 3
          if-no-files-found: warn
