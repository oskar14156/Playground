name: Photo Sphere concrete camera model vtables
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  raw-disassembly:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and verify exact APK and native library
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN || github.token }}
        run: |
          set -euo pipefail
          curl -fL --retry 3 -H "Authorization: Bearer $GH_TOKEN" \
            "https://github.com/Persie0/decompile/releases/download/pho/com.google.android.GoogleCamera_8.8.225.510547499.09-66251366_minAPI33.arm64-v8a.nodpi._apkmirror.com.apk" -o camera.apk
          echo "9ca2264cbf5680c8b5b740e53849c1586c53436a7e860616584c0349dba37c47  camera.apk" | sha256sum -c -
          unzip -p camera.apk lib/arm64-v8a/liblightcycle.so > liblightcycle.so
          echo "878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1  liblightcycle.so" | sha256sum -c -
      - name: Install AArch64 disassembler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils-aarch64-linux-gnu
      - name: Extract missing post-allocation instruction spans
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          readelf -Wr liblightcycle.so > out/relocations.txt
          python3 - <<'PY'
          from pathlib import Path
          import re
          lines=Path('out/relocations.txt').read_text().splitlines()
          # Candidate provider/camera vptr origins are visible in the constructors:
          # Ghidra 0x50d540, 0x50d3c8, raw pointer through 0x414450+0x10.
          for start,end,which in [
              (0x40d3b8,0x40d480,"camera-provider-d3c8"),
              (0x40d530,0x40d620,"camera-provider-d540"),
              (0x414450,0x4144c0,"raw-linear-camera-pointer")
          ]:
              print('===== CANDIDATE',which,'====')
              for line in lines:
                  m=re.match(r'^\s*([0-9a-fA-F]{8,16})\s+',line)
                  if m and start<=int(m[1],16)<end: print(line)
          PY
          aarch64-linux-gnu-objdump -d -j .text \
            --start-address=0x330978 --stop-address=0x330a28 \
            liblightcycle.so > out/linear-camera-init.S
          aarch64-linux-gnu-objdump -d -j .text \
            --start-address=0x331118 --stop-address=0x331390 \
            liblightcycle.so > out/linear-camera-alternate.S
          cat out/linear-camera-init.S
          sed -n '1,160p' out/linear-camera-alternate.S
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: photosphere-camera-vtables
          path: out/
          retention-days: 3
