name: Photo Sphere checkpoint 104 targeted deep native investigation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ghidra:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        track: [flow-owner-104, gamma-sampling-consumer-104, metadata-session-104]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: SHA-verify pinned Camera 8.8.225 original
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN || github.token }}
        run: |
          set -euo pipefail
          curl -fL --retry 3 -H "Authorization: Bearer $GH_TOKEN" "https://github.com/Persie0/decompile/releases/download/pho/com.google.android.GoogleCamera_8.8.225.510547499.09-66251366_minAPI33.arm64-v8a.nodpi._apkmirror.com.apk" -o camera.apk
          echo "9ca2264cbf5680c8b5b740e53849c1586c53436a7e860616584c0349dba37c47  camera.apk" | sha256sum -c -
          unzip -p camera.apk lib/arm64-v8a/liblightcycle.so > liblightcycle.so
          echo "878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1  liblightcycle.so" | sha256sum -c -
      - name: Install pinned Ghidra 12.1.4
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 "https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.4_build/ghidra_12.1.4_PUBLIC_20260921.zip" -o ghidra.zip
          unzip -q ghidra.zip
          echo "GHIDRA_HOME=$PWD/ghidra_12.1.4_PUBLIC" >> "$GITHUB_ENV"
      - name: Trace selected native call graph and class internals
        shell: bash
        env:
          TRACK: ${{ matrix.track }}
        run: |
          set -euo pipefail
          mkdir -p "out/$TRACK" /tmp/photosphere-104
          "$GHIDRA_HOME/support/analyzeHeadless" /tmp/photosphere-104 "deep-$TRACK" -import "$PWD/liblightcycle.so" -analysisTimeoutPerFile 1200 -scriptPath "$PWD/scripts" -postScript PhotoSphereSweep.java "$PWD/out" "$TRACK" -deleteProject > "out/$TRACK/ghidra.log" 2>&1
          test -s "out/$TRACK/index.tsv"
          echo "=== TRACK $TRACK ==="
          cat "out/$TRACK/index.tsv"
          case "$TRACK" in
            flow-owner-104) funcs="001f327c 001f25f4 001f2af8 001f4010" ;;
            gamma-sampling-consumer-104) funcs="004404ec 00441048 00441dc0 0049a19c 0041c618" ;;
            metadata-session-104) funcs="004195c8 0041aa40 0021a0e8 0021a2b0 00419b74" ;;
          esac
          for id in $funcs; do
            file="out/$TRACK/${id}_investigate.c"
            if [[ -s "$file" ]]; then echo "=== C $id ==="; sed -n '1,550p' "$file"; fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: photosphere-104-${{ matrix.track }}
          path: out/
          retention-days: 4
          if-no-files-found: warn
