name: Photo Sphere checkpoint 105 ARM64 gamma pixel path
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        track: [constructor, image-consumer, gamma-interface]
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned native binary and verify hashes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN || github.token }}
        run: |
          set -euo pipefail
          curl -fL --retry 3 -H "Authorization: Bearer $GH_TOKEN" \
            "https://github.com/Persie0/decompile/releases/download/pho/com.google.android.GoogleCamera_8.8.225.510547499.09-66251366_minAPI33.arm64-v8a.nodpi._apkmirror.com.apk" -o camera.apk
          echo "9ca2264cbf5680c8b5b740e53849c1586c53436a7e860616584c0349dba37c47  camera.apk" | sha256sum -c -
          unzip -p camera.apk lib/arm64-v8a/liblightcycle.so > liblightcycle.so
          echo "878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1  liblightcycle.so" | sha256sum -c -
      - name: Install fixed ELF decoders
        run: python3 -m pip install --disable-pip-version-check capstone==5.0.6 pyelftools==0.32
      - name: Cross-check source sampling and matrix calls
        shell: bash
        env:
          TRACK: ${{ matrix.track }}
        run: |
          set -euo pipefail
          mkdir -p out
          python3 scripts/photosphere_checkpoint_105.py > "out/$TRACK.txt"
          echo "=== $TRACK SUMMARY ==="
          grep -E '^===|^ALL_DIRECT_CALLS|^ALL_VTABLE_LOADS|^EMITTED_CALL_NEIGHBOR_ROWS|^RELOCS_TO_|^VTABLE_' "out/$TRACK.txt" | cut -c 1-12000
          echo "=== HEAD ==="
          sed -n '1,350p' "out/$TRACK.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: photosphere-105-${{ matrix.track }}
          path: out/
          retention-days: 4
          if-no-files-found: error
