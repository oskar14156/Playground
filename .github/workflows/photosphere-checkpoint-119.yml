name: Photo Sphere checkpoint 119 target thumbnail width default
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  constructor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download SHA-verified original Camera ELF
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN || github.token }}
        run: |
          set -euo pipefail
          curl -fL --retry 3 -H "Authorization: Bearer $GH_TOKEN" "https://github.com/Persie0/decompile/releases/download/pho/com.google.android.GoogleCamera_8.8.225.510547499.09-66251366_minAPI33.arm64-v8a.nodpi._apkmirror.com.apk" -o camera.apk
          echo "9ca2264cbf5680c8b5b740e53849c1586c53436a7e860616584c0349dba37c47  camera.apk" | sha256sum -c -
          unzip -p camera.apk lib/arm64-v8a/liblightcycle.so > liblightcycle.so
          echo "878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1  liblightcycle.so" | sha256sum -c -
      - name: Install pinned native tools
        run: python3 -m pip install --disable-pip-version-check capstone==5.0.6 pyelftools==0.32
      - name: Find constructor and numeric width args
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python3 scripts/photosphere_checkpoint_119.py | tee out/thumbnail-width.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: photosphere-119-width
          path: out/
          retention-days: 4
