name: Photo Sphere checkpoint 135 native Q30 row-carry differential
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        config: [default, portable, android-jni]
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Persie0/PhotosphereRust
          ref: 4a58de03bdda84bdbd2e67f5b2062e7a0168f635
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN || github.token }}
          path: PhotosphereRust
      - uses: dtolnay/rust-toolchain@stable
      - name: Run all Rust tests including native Q30 vs rational area fixture comparisons
        working-directory: PhotosphereRust
        shell: bash
        env:
          CONFIG: ${{ matrix.config }}
        run: |
          set -euo pipefail
          case "$CONFIG" in
            default) cargo test --all-targets ;;
            portable) cargo test --all-targets --no-default-features ;;
            android-jni) cargo test --all-targets --features android-jni ;;
          esac
          # Existing unrelated whole-repo rustfmt differences are tracked separately; this lane verifies behavior.
