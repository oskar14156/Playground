name: Photo Sphere checkpoint 150 camera, metadata and session lifecycles
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ghidra:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        track: [camera-correction-150, meta-writer-150, session-lifecycle-150]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: SHA-verify pinned Camera 8.8.225 original
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN || github.token }}
        run: |
          set -euo pipefail
          curl -fL --retry 3 -H "Authorization: Bearer $GH_TOKEN" "https://github.com/Persie0/decompile/releases/download/pho/com.google.android.GoogleCamera_8.8.225.510547499.09-66251366_minAPI33.arm64-v8a.nodpi._apkmirror.com.apk" -o camera.apk
          echo "9ca2264cbf5680c8b5b740e53849c1586c53436a7e860616584c0349dba37c47  camera.apk" | sha256sum -c -
          unzip -p camera.apk lib/arm64-v8a/liblightcycle.so > liblightcycle.so
          echo "878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1  liblightcycle.so" | sha256sum -c -
      - name: Install pinned Ghidra 12.1.4
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 "https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.4_build/ghidra_12.1.4_PUBLIC_20260921.zip" -o ghidra.zip
          unzip -q ghidra.zip
          echo "GHIDRA_HOME=$PWD/ghidra_12.1.4_PUBLIC" >> "$GITHUB_ENV"
      - name: Trace selected native call graph and class internals
        shell: bash
        env:
          TRACK: ${{ matrix.track }}
        run: |
          set -euo pipefail
          mkdir -p "out/$TRACK" /tmp/photosphere-150
          "$GHIDRA_HOME/support/analyzeHeadless" /tmp/photosphere-150 "deep-$TRACK" -import "$PWD/liblightcycle.so" -analysisTimeoutPerFile 1200 -scriptPath "$PWD/scripts" -postScript PhotoSphereSweep.java "$PWD/out" "$TRACK" -deleteProject > "out/$TRACK/ghidra.log" 2>&1
          test -s "out/$TRACK/index.tsv"
          echo "=== TRACK $TRACK ==="
          cat "out/$TRACK/index.tsv"
          case "$TRACK" in
            camera-correction-150) funcs="004315f8 00431690 00431b54 00431d6c 0041a6bc 004440ec" ;;
            meta-writer-150) funcs="0021a0e8 0021b584 0021b75c 0021b8a8 0021ba60 00419b74" ;;
            session-lifecycle-150) funcs="001ee5d4 001edb8c 0021a204 0021a34c 00419714 0041a6bc" ;;
          esac
          for id in $funcs; do
            file="out/$TRACK/${id}_investigate.c"
            if [[ -s "$file" ]]; then echo "=== C $id ==="; sed -n '1,550p' "$file"; fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: photosphere-150-${{ matrix.track }}
          path: out/
          retention-days: 4
          if-no-files-found: warn
