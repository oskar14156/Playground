name: Photo Sphere checkpoint 155 exact Java LocalSessionStorage metadata field references
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        track: [typed-storage-references]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Fetch and verify exact Google Camera APK
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN || github.token }}
        run: |
          set -euo pipefail
          curl -fL --retry 3 -H "Authorization: Bearer $GH_TOKEN" \
            "https://github.com/Persie0/decompile/releases/download/pho/com.google.android.GoogleCamera_8.8.225.510547499.09-66251366_minAPI33.arm64-v8a.nodpi._apkmirror.com.apk" -o camera.apk
          echo "9ca2264cbf5680c8b5b740e53849c1586c53436a7e860616584c0349dba37c47  camera.apk" | sha256sum -c -
      - name: Fetch pinned JADX v1.5.6
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 "https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip" -o jadx.zip
          mkdir -p jadx-dist
          unzip -q jadx.zip -d jadx-dist
          chmod +x jadx-dist/bin/jadx
      - name: Decompile only in public Playground runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/java
          set +e
          jadx-dist/bin/jadx --no-res --threads-count 4 -d out/java camera.apk 2>&1 | tee out/jadx.log
          jadx_status=${PIPESTATUS[0]}
          set -e
          test -d out/java/sources
          java_files=$(find out/java/sources -name '*.java' | wc -l)
          echo "JAVA_FILE_COUNT=$java_files"
          test "$java_files" -ge 4000
          if [[ "$jadx_status" != 0 ]]; then
            echo "WARNING: JADX returned $jadx_status; scanning successfully generated classes only."
            echo "WARNING: Unrecovered or errored classes are not evidence of missing behavior."
          fi
          if [[ "$jadx_status" != 0 && "$jadx_status" != 3 ]]; then exit "$jadx_status"; fi
      - name: Inspect capture writing and stitching/restore lifecycle
        env:
          TRACK: ${{ matrix.track }}
        shell: bash
        run: |
          set -euo pipefail
          echo "=== TRACK $TRACK ==="
          echo "=== Typed LocalSessionStorage references (every source) ==="
          mapfile -t names < <(grep -RlF --include='*.java' 'LocalSessionStorage' out/java/sources || true)
          echo "TYPED_CLASS_COUNT=${#names[@]}"
          for file in "${names[@]:0:115}"; do
            echo "===== TYPED_FILE $file ====="
            grep -nE -C 4 'LocalSessionStorage|[.]h|session[.]meta|new FileOutputStream|new FileWriter|new FileReader|[.]delete\(' "$file" | head -n 110 || true
          done
          echo "=== Direct session-specific source snippets ==="
          for cl in foc exm eyb foa ewo eym gxv; do
            file="out/java/sources/defpackage/$cl.java"
            [[ -f "$file" ]] || continue
            echo "===== DIRECT_CLASS $cl ====="
            grep -nE -C 4 'LocalSessionStorage|session[.]meta|[.]M[.]h|[.]L[.]h|[.]h|new FileWriter|new FileOutputStream|new FileReader|[.]delete\(' "$file" | head -n 170 || true
          done
          echo "=== exact text consumer search for LocalSessionStorage.h ==="
          grep -RniF --include='*.java' 'localSessionStorage.h' out/java/sources | head -n 85 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: photosphere-155-java-${{ matrix.track }}
          path: out/jadx.log
          retention-days: 3
          if-no-files-found: warn
