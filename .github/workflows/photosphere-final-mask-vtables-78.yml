name: Photo Sphere final stitcher mask vtables
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  raw-disassembly:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and verify exact APK and native library
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN || github.token }}
        run: |
          set -euo pipefail
          curl -fL --retry 3 -H "Authorization: Bearer $GH_TOKEN" \
            "https://github.com/Persie0/decompile/releases/download/pho/com.google.android.GoogleCamera_8.8.225.510547499.09-66251366_minAPI33.arm64-v8a.nodpi._apkmirror.com.apk" -o camera.apk
          echo "9ca2264cbf5680c8b5b740e53849c1586c53436a7e860616584c0349dba37c47  camera.apk" | sha256sum -c -
          unzip -p camera.apk lib/arm64-v8a/liblightcycle.so > liblightcycle.so
          echo "878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1  liblightcycle.so" | sha256sum -c -
      - name: Install lightweight pinned ARM64 decoder
        run: python3 -m pip install --disable-pip-version-check capstone==5.0.6
      - name: Verify final stitcher mask API and 0/1 expansion vtables
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          readelf -Wr liblightcycle.so > out/native-relocations.txt
          python3 - <<'PY' | tee out/final-mask-vtables.txt
          import re
          from pathlib import Path
          lines=Path('out/native-relocations.txt').read_text().splitlines()
          reloc=[]
          for line in lines:
              match=re.match(r'^\s*([0-9a-fA-F]{8,16})\s+[0-9a-fA-F]{8,16}\s+\S+\s+([0-9a-fA-F]+)',line)
              if match:reloc.append((int(match[1],16),int(match[2],16),line))
          targets=(0x33262c,0x33317c,0x337378,0x337498,0x333478,0x33605c)
          for target in targets:
              hits=[(where,line) for where,val,line in reloc if val==target]
              print('=== METHOD',hex(target),'vtable slots found',len(hits))
              for where,line in hits:
                  print('match',line)
                  for at,val,near in reloc:
                      if where-0x48<=at<=where+0x20:
                          print('  ',near)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: photosphere-final-mask-vtables-78
          path: out/
          retention-days: 3
