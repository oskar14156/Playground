name: Photo Sphere exact FOV image gradient kernels
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  raw-disassembly:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and verify exact APK and native library
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN || github.token }}
        run: |
          set -euo pipefail
          curl -fL --retry 3 -H "Authorization: Bearer $GH_TOKEN" \
            "https://github.com/Persie0/decompile/releases/download/pho/com.google.android.GoogleCamera_8.8.225.510547499.09-66251366_minAPI33.arm64-v8a.nodpi._apkmirror.com.apk" -o camera.apk
          echo "9ca2264cbf5680c8b5b740e53849c1586c53436a7e860616584c0349dba37c47  camera.apk" | sha256sum -c -
          unzip -p camera.apk lib/arm64-v8a/liblightcycle.so > liblightcycle.so
          echo "878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1  liblightcycle.so" | sha256sum -c -
      - name: Read native 3-tap gradient kernels
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python3 - <<'PY' | tee out/fov-gradient-filter.txt
          from pathlib import Path
          from struct import unpack_from
          data=Path('liblightcycle.so').read_bytes()
          assert data[:4] == b'\x7fELF' and data[4:6] == b'\x02\x01'
          phoff=unpack_from('<Q',data,32)[0]
          ent,num=unpack_from('<HH',data,54)
          load=[]
          for i in range(num):
              ty,fl,fo,va,pa,fs,ms,align=unpack_from('<IIQQQQQQ',data,phoff+i*ent)
              if ty==1:load.append((va,va+fs,fo))
          def get(va):
              for start,end,fo in load:
                  if start<=va<end:return fo+va-start
              raise ValueError(hex(va))
          for va in (0x62854,0x62860):
              off=get(va)
              coeff=unpack_from('<iii',data,off)
              print(f'ELF_VA={va:#x} file_offset={off:#x} int32_coefficients={coeff} sum={sum(coeff)}')
          for va in (0x61c50,0x61c58):
              off=get(va)
              print(f'ELF_VA={va:#x} first_8_bytes={data[off:off+8].hex()}')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: photosphere-equirect-constants
          path: out/
          retention-days: 3
