name: Photo Sphere FOV flow pose and input ARM64
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  raw-disassembly:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and verify exact APK and native library
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN || github.token }}
        run: |
          set -euo pipefail
          curl -fL --retry 3 -H "Authorization: Bearer $GH_TOKEN" \
            "https://github.com/Persie0/decompile/releases/download/pho/com.google.android.GoogleCamera_8.8.225.510547499.09-66251366_minAPI33.arm64-v8a.nodpi._apkmirror.com.apk" -o camera.apk
          echo "9ca2264cbf5680c8b5b740e53849c1586c53436a7e860616584c0349dba37c47  camera.apk" | sha256sum -c -
          unzip -p camera.apk lib/arm64-v8a/liblightcycle.so > liblightcycle.so
          echo "878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1  liblightcycle.so" | sha256sum -c -
      - name: Install lightweight pinned ARM64 decoder
        run: python3 -m pip install --disable-pip-version-check capstone==5.0.6
      - name: Decode native FOV solver and optimization callsites
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python3 - <<'PY' | tee out/fov-solver-arm64.txt
          from pathlib import Path
          from struct import unpack_from
          from capstone import Cs,CS_ARCH_ARM64,CS_MODE_LITTLE_ENDIAN
          b=Path('liblightcycle.so').read_bytes()
          off=unpack_from('<Q',b,32)[0]; ent,n=unpack_from('<HH',b,54)
          seg=[]
          for i in range(n):
              typ,flags,o,va,p,fs,ms,al=unpack_from('<IIQQQQQQ',b,off+i*ent)
              if typ==1:seg.append((va,va+fs,o))
          def at(va):
              for lo,hi,o in seg:
                  if lo<=va<hi:return o+va-lo
              raise ValueError(hex(va))
          cap=Cs(CS_ARCH_ARM64,CS_MODE_LITTLE_ENDIAN)
          for name,lo,hi in [
              ('FLOW_FEATURE_CONSTRAINTS',0x000fefdc,0x000ff1c8),
              ('FLOW_COARSE_POSE',0x000f3e34,0x000f40f0),
              ('POSE_MODEL_UPDATE',0x000f2e54,0x000f3090),
              ('SESSION_POSTALIGN',0x0011c284,0x0011c568),
              ('ROSETTE_STATE',0x003441e0,0x00344350)
          ]:
              print('===',name,hex(lo),hex(hi),'===')
              ins=list(cap.disasm(b[at(lo):at(hi-4)+4],lo))
              assert ins
              print('native instructions',len(ins))
              for i in ins:
                  if i.mnemonic.startswith(('bl','fmov','fcvt','fmul','fadd','fsub','fdiv','movk','movz','cmp','cbz','cbnz','tbnz','tbz')):
                      print(f'{i.address:08x}: {i.mnemonic:8} {i.op_str}')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: photosphere-fov-flow-arm64-83
          path: out/
          retention-days: 3
