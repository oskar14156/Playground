name: Photo Sphere FOV flow Jacobian checkpoint 86
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and verify exact LightCycle library
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN || github.token }}
        run: |
          set -euo pipefail
          curl -fL --retry 3 -H "Authorization: Bearer $GH_TOKEN" \
            "https://github.com/Persie0/decompile/releases/download/pho/com.google.android.GoogleCamera_8.8.225.510547499.09-66251366_minAPI33.arm64-v8a.nodpi._apkmirror.com.apk" -o camera.apk
          echo "9ca2264cbf5680c8b5b740e53849c1586c53436a7e860616584c0349dba37c47  camera.apk" | sha256sum -c -
          unzip -p camera.apk lib/arm64-v8a/liblightcycle.so > liblightcycle.so
          echo "878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1  liblightcycle.so" | sha256sum -c -
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Fetch pinned Ghidra
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            "https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.4_build/ghidra_12.1.4_PUBLIC_20260921.zip" -o ghidra.zip
          unzip -q ghidra.zip
          echo "GHIDRA_HOME=$PWD/ghidra_12.1.4_PUBLIC" >> "$GITHUB_ENV"
      - name: Recover dense flow Jacobian builder
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out /tmp/photosphere-86
          "$GHIDRA_HOME/support/analyzeHeadless" /tmp/photosphere-86 checkpoint86 \
            -import "$PWD/liblightcycle.so" \
            -analysisTimeoutPerFile 1200 \
            -scriptPath "$PWD/scripts" \
            -postScript PhotoSphereSweep.java "$PWD/out" "fov-flow-jacobian-86" \
            -deleteProject > out/ghidra.log 2>&1
          test -s out/fov-flow-jacobian-86/index.tsv
          cat out/fov-flow-jacobian-86/index.tsv
          for addr in 001ff7dc 001ffab0 001fff14 001fd76c; do
            p="out/fov-flow-jacobian-86/${addr}_investigate.c"
            if [[ -s "$p" ]]; then
              echo "=== C $addr ==="
              sed -n '1,2000p' "$p"
            fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: photosphere-fov-flow-jacobian-86
          path: out/
          retention-days: 3
