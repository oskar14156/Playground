name: Photo Sphere GammaAdjuster sample lattice ARM64 99
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  raw-disassembly:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and verify exact APK and native library
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN || github.token }}
        run: |
          set -euo pipefail
          curl -fL --retry 3 -H "Authorization: Bearer $GH_TOKEN" \
            "https://github.com/Persie0/decompile/releases/download/pho/com.google.android.GoogleCamera_8.8.225.510547499.09-66251366_minAPI33.arm64-v8a.nodpi._apkmirror.com.apk" -o camera.apk
          echo "9ca2264cbf5680c8b5b740e53849c1586c53436a7e860616584c0349dba37c47  camera.apk" | sha256sum -c -
          unzip -p camera.apk lib/arm64-v8a/liblightcycle.so > liblightcycle.so
          echo "878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1  liblightcycle.so" | sha256sum -c -
      - name: Install lightweight pinned ARM64 decoder
        run: python3 -m pip install --disable-pip-version-check capstone==5.0.6
      - name: Analyze gamma sampling constructor after Ghidra allocator truncation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python3 - <<'PY' | tee out/gamma-lattice-arm64.txt
          from pathlib import Path
          from struct import unpack_from
          from capstone import Cs, CS_ARCH_ARM64, CS_MODE_LITTLE_ENDIAN
          b=Path("liblightcycle.so").read_bytes()
          phoff=unpack_from("<Q",b,32)[0]
          phent,phnum=unpack_from("<HH",b,54)
          segs=[]
          for k in range(phnum):
              kind,flags,fo,va,paddr,sz,memsz,align=unpack_from("<IIQQQQQQ",b,phoff+k*phent)
              if kind==1:segs.append((va,va+sz,fo))
          def ofs(a):
              for lo,hi,o in segs:
                  if lo<=a<hi:return o+a-lo
              raise ValueError(hex(a))
          d=Cs(CS_ARCH_ARM64,CS_MODE_LITTLE_ENDIAN)
          for name,lo,hi in [
              ("GAMMA_ANALYSIS_CONSTRUCTOR",0x340994,0x341150),
              ("GAMMA_FACTORY_CALLER",0x341dc0,0x341e94),
              ("GAMMA_SAMPLER_NEIGHBOR",0x3404ec,0x340994),
          ]:
              print(f"===== {name} 0x{lo:x}..0x{hi:x} =====")
              ins=list(d.disasm(b[ofs(lo):ofs(hi-4)+4],lo))
              print(f"decoded={len(ins)}")
              assert ins
              for v in ins:
                  if name=="GAMMA_ANALYSIS_CONSTRUCTOR" or v.mnemonic in ("bl","blr","movz","movk","fmov","fadd","fmul","fdiv","fcvtzs","ret"):
                      print(f"{v.address:08x}: {v.mnemonic:8} {v.op_str}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: photosphere-gamma-lattice-99
          path: out/
          retention-days: 3
