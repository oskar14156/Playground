name: Photo Sphere IBFS concrete bridge readback
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify native binary
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN || github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -H "Authorization: Bearer $GH_TOKEN" \
            "https://github.com/Persie0/decompile/releases/download/pho/com.google.android.GoogleCamera_8.8.225.510547499.09-66251366_minAPI33.arm64-v8a.nodpi._apkmirror.com.apk" -o camera.apk
          echo "9ca2264cbf5680c8b5b740e53849c1586c53436a7e860616584c0349dba37c47  camera.apk" | sha256sum -c -
          unzip -p camera.apk lib/arm64-v8a/liblightcycle.so > liblightcycle.so
          echo "878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1  liblightcycle.so" | sha256sum -c -
      - name: Install AArch64 disassembler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils-aarch64-linux-gnu
      - name: Extract graph allocation to solver bridge
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          aarch64-linux-gnu-readelf -W -S liblightcycle.so > out/sections.txt
          aarch64-linux-gnu-readelf -Wr liblightcycle.so > out/relocations.txt
          aarch64-linux-gnu-objdump -d -j .text \
            --start-address=0x33bcd8 --stop-address=0x33c320 \
            liblightcycle.so > out/graph-wrapper.S
          aarch64-linux-gnu-objdump -d -j .text \
            --start-address=0x33d000 --stop-address=0x33d740 \
            liblightcycle.so > out/ibfs-construct-and-capacities.S
          aarch64-linux-gnu-objdump -d -j .text \
            --start-address=0x33e524 --stop-address=0x33e640 \
            liblightcycle.so > out/ibfs-label-methods.S
          aarch64-linux-gnu-objdump -d -j .text \
            --start-address=0x13b148 --stop-address=0x13b1a0 \
            liblightcycle.so > out/ibfs-terminal-first.S
          aarch64-linux-gnu-objdump -d -j .text \
            --start-address=0x1409b4 --stop-address=0x140a10 \
            liblightcycle.so > out/ibfs-terminal-second.S
          aarch64-linux-gnu-objdump -d -j .text \
            --start-address=0x33dc58 --stop-address=0x33e2e4 \
            liblightcycle.so > out/ibfs-finalize-and-labels.S
          echo '=== IBFS LABEL-ARRAY / FINALIZER LOCATIONS ==='
          grep -n -C 13 -E '#0x158|#344|#0x1b8|#440|str.*\[.*#344|33dc58:|33df98:' \
            out/ibfs-finalize-and-labels.S | head -330 || true
          echo '=== IBFS LABEL FLOOD: REMAINING INSTRUCTIONS ==='
          sed -n '140,225p' out/ibfs-finalize-and-labels.S
          echo '=== IBFS FINALIZER FIRST INSTRUCTIONS ==='
          sed -n '1,145p' out/ibfs-finalize-and-labels.S
          aarch64-linux-gnu-objdump -d -j .text \
            --start-address=0x33ad54 --stop-address=0x33aeb8 \
            liblightcycle.so > out/seam-args.S
          aarch64-linux-gnu-objdump -d -j .text \
            --start-address=0x33b7e0 --stop-address=0x33b980 \
            liblightcycle.so > out/seam-label-to-image.S
          echo '=== SEAM INPUT ARGUMENT SETUP ==='
          sed -n '1,125p' out/seam-args.S
          echo '=== SEAM LABEL TO IMAGE REGISTER TRACE ==='
          cat out/seam-label-to-image.S
          echo '=== CONSTRUCTOR VTABLE GOT RELOCATION ==='
          grep -Ei '0000000000414470|000000000040d9(7|8|9|a|b|c)' out/relocations.txt | head -35 || true
          echo '=== IBFS LABEL METHOD ==='
          cat out/ibfs-label-methods.S
          echo '=== IBFS TERMINAL A ==='
          cat out/ibfs-terminal-first.S
          echo '=== IBFS TERMINAL B ==='
          cat out/ibfs-terminal-second.S
          echo '=== GRAPH BRIDGE / CONSTRUCTOR ==='
          cat out/graph-wrapper.S
          echo '=== IBFS CAPACITY ROUTES ==='
          sed -n '1,330p' out/ibfs-construct-and-capacities.S
          echo '=== VTABLE ADDRESSES REFERENCED BY RELOCATIONS ==='
          grep -Ei '40d[89abcdef]|40e[0123]' out/relocations.txt | head -100 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: photosphere-ibfs-concrete-bridge
          path: out/
          retention-days: 3
          if-no-files-found: warn
