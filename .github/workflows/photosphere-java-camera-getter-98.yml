name: Photo Sphere reported FOV getter and config origins 98
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Fetch and verify exact Google Camera APK
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN || github.token }}
        run: |
          set -euo pipefail
          curl -fL --retry 3 -H "Authorization: Bearer $GH_TOKEN" \
            "https://github.com/Persie0/decompile/releases/download/pho/com.google.android.GoogleCamera_8.8.225.510547499.09-66251366_minAPI33.arm64-v8a.nodpi._apkmirror.com.apk" -o camera.apk
          echo "9ca2264cbf5680c8b5b740e53849c1586c53436a7e860616584c0349dba37c47  camera.apk" | sha256sum -c -
      - name: Fetch pinned JADX v1.5.6
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 "https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip" -o jadx.zip
          mkdir -p jadx-dist
          unzip -q jadx.zip -d jadx-dist
          chmod +x jadx-dist/bin/jadx
      - name: Decompile only in public Playground runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/java
          set +e
          jadx-dist/bin/jadx --no-res --threads-count 4 -d out/java camera.apk 2>&1 | tee out/jadx.log
          jadx_status=${PIPESTATUS[0]}
          set -e
          test -d out/java/sources
          java_files=$(find out/java/sources -name '*.java' | wc -l)
          echo "JAVA_FILE_COUNT=$java_files"
          test "$java_files" -ge 4000
          if [[ "$jadx_status" != 0 ]]; then
            echo "WARNING: JADX returned $jadx_status; scanning successfully generated classes only."
            echo "WARNING: Unrecovered or errored classes are not evidence of missing behavior."
          fi
          if [[ "$jadx_status" != 0 && "$jadx_status" != 3 ]]; then exit "$jadx_status"; fi
      - name: Trace horizontal FOV provider and config wrapper
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/fov
          python3 - <<'PY' | tee out/fov/readback.txt
          from pathlib import Path
          root=Path('out/java/sources')
          terms=('getHorizontalViewAngle(', 'photoSphereCalibratedFieldOfView', 'din.a', 'new din(', 'class din', 'exm.g()')
          print('=== SOURCE_FILES ===')
          candidates=[]
          for path in root.rglob('*.java'):
              try:src=path.read_text(errors='replace')
              except OSError:continue
              if any(t in src for t in terms):candidates.append((path,src.splitlines()))
          print('MATCHES',len(candidates))
          for path,lines in candidates:
              matches=[i for i,x in enumerate(lines) if any(t in x for t in terms)]
              name=str(path.relative_to(root))
              if name.startswith('defpackage/') and len(matches)>90 and not name.endswith(('din.java','exm.java','ewt.java')):
                  continue
              print('=== FILE',name,'HITS',len(matches),'===')
              seen=set()
              for i in matches[:35]:
                  for j in range(max(0,i-5),min(len(lines),i+10)):
                      if j not in seen:
                          print(f'{j+1}: {lines[j]}')
                          seen.add(j)
          print('=== DIRECT CAMERA WRAPPER CLASSES ===')
          for name in ['defpackage/din.java','defpackage/ewt.java','defpackage/exm.java']:
              p=root/name
              if not p.exists():continue
              rows=p.read_text(errors='replace').splitlines()
              print('CLASS',name,'LINES',len(rows))
              if name.endswith('din.java'):
                  selected=range(min(len(rows),230))
              elif name.endswith('ewt.java'):
                  selected=range(min(len(rows),180))
              else:
                  selected=range(75,min(len(rows),140))
              for j in selected:
                  print(f'{j+1}: {rows[j]}')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: photosphere-java-getter-98
          path: |
            out/jadx.log
            out/fov/readback.txt
          retention-days: 3
          if-no-files-found: warn
