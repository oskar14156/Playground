name: Photo Sphere mask-generator factory AArch64
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  disassemble:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and verify exact LightCycle binary
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN || github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -H "Authorization: Bearer $GH_TOKEN" \
            "https://github.com/Persie0/decompile/releases/download/pho/com.google.android.GoogleCamera_8.8.225.510547499.09-66251366_minAPI33.arm64-v8a.nodpi._apkmirror.com.apk" -o camera.apk
          echo "9ca2264cbf5680c8b5b740e53849c1586c53436a7e860616584c0349dba37c47  camera.apk" | sha256sum -c -
          unzip -p camera.apk lib/arm64-v8a/liblightcycle.so > liblightcycle.so
          echo "878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1  liblightcycle.so" | sha256sum -c -
      - name: Install AArch64 disassembler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils-aarch64-linux-gnu
      - name: Dump factory and mask-generator callers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          readelf -W -S liblightcycle.so > out/sections.txt
          readelf -Wr liblightcycle.so > out/relocs.txt
          aarch64-linux-gnu-objdump -d -j .text \
            --start-address=0x39c5d8 --stop-address=0x39c870 \
            liblightcycle.so > out/factory.S
          aarch64-linux-gnu-objdump -d -j .text \
            --start-address=0x3380dc --stop-address=0x33835c \
            liblightcycle.so > out/mask-caller.S
          aarch64-linux-gnu-objdump -d -j .text \
            --start-address=0x39d170 --stop-address=0x39d46c \
            liblightcycle.so > out/mask-finalizer.S
          aarch64-linux-gnu-objdump -d -j .text \
            --start-address=0x39e5b4 --stop-address=0x39e630 \
            liblightcycle.so > out/run-comparator.S
          aarch64-linux-gnu-objdump -d -j .text \
            --start-address=0x39c8e8 --stop-address=0x39c980 \
            liblightcycle.so > out/run-row-setter.S
          echo '=== RUN_ROW_SETTER_ARM64 ==='
          cat out/run-row-setter.S
          echo '=== MASK_GENERATOR_FINALIZER_ARM64 ==='
          cat out/mask-finalizer.S
          echo '=== RUN_INTERVAL_COMPARATOR_ARM64 ==='
          cat out/run-comparator.S
          echo '=== MASK_GENERATOR_FACTORY ==='
          cat out/factory.S
          echo '=== MASK_GENERATOR_CALLER ==='
          cat out/mask-caller.S
          echo '=== POINTER RELOCATIONS FOR NEARBY VTABLES ==='
          grep -Ei '000000000040c|000000000040d|000000000040e' out/relocs.txt | head -100 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: photosphere-mask-generator-factory
          path: out/
          retention-days: 3
          if-no-files-found: warn
