name: Photo Sphere native metadata writer callsites
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  raw-disassembly:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and verify exact APK and native library
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN || github.token }}
        run: |
          set -euo pipefail
          curl -fL --retry 3 -H "Authorization: Bearer $GH_TOKEN" \
            "https://github.com/Persie0/decompile/releases/download/pho/com.google.android.GoogleCamera_8.8.225.510547499.09-66251366_minAPI33.arm64-v8a.nodpi._apkmirror.com.apk" -o camera.apk
          echo "9ca2264cbf5680c8b5b740e53849c1586c53436a7e860616584c0349dba37c47  camera.apk" | sha256sum -c -
          unzip -p camera.apk lib/arm64-v8a/liblightcycle.so > liblightcycle.so
          echo "878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1  liblightcycle.so" | sha256sum -c -
      - name: Install lightweight pinned ARM64 decoder
        run: python3 -m pip install --disable-pip-version-check capstone==5.0.6
      - name: Locate direct session metadata writer callers and getter ABI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python3 - <<'PY' | tee out/metadata-native-callsites.txt
          from pathlib import Path
          from struct import unpack_from
          from capstone import Cs,CS_ARCH_ARM64,CS_MODE_LITTLE_ENDIAN
          b=Path("liblightcycle.so").read_bytes()
          phoff=unpack_from("<Q",b,32)[0]
          entry,n=unpack_from("<HH",b,54)
          segs=[]
          for i in range(n):
              ty,flags,off,va,pa,fs,ms,al=unpack_from("<IIQQQQQQ",b,phoff+i*entry)
              if ty==1:segs.append((va,va+fs,off,flags))
          def mapped(va):
              for lo,hi,o,f in segs:
                  if lo<=va<hi:return o+va-lo
              raise RuntimeError(hex(va))
          decoder=Cs(CS_ARCH_ARM64,CS_MODE_LITTLE_ENDIAN)
          for label,a,z in [
              ("METADATA_WRITER",0x319b74,0x319d3c),
              ("METADATA_CANDIDATE_SESSION",0x11976c,0x11999c),
              ("METADATA_CAPTURE",0x11b5f4,0x11b8b0),
          ]:
              print('===',label,hex(a),'===')
              ins=list(decoder.disasm(b[mapped(a):mapped(z-4)+4],a))
              for i in ins[:700]:
                  if label=="METADATA_WRITER" or i.mnemonic in ("bl","blr","ret","adrp","add","mov","movz","movk"):
                      print(f'{i.address:08x}: {i.mnemonic:8} {i.op_str}')
          targets={0x319b74:"metadata_writer",0x11976c:"session_candidate",0x11b5f4:"capture_candidate"}
          count={v:0 for v in targets.values()}
          for start,end,fo,flags in segs:
              if not (flags & 1):continue
              n=(end-start)//4
              for i in range(n):
                  addr=start+i*4
                  w=unpack_from('<I',b,fo+i*4)[0]
                  if w & 0xfc000000 != 0x94000000:continue
                  imm=w&0x03ffffff
                  if imm&(1<<25):imm-=1<<26
                  dst=addr+imm*4
                  if dst in targets:
                      count[targets[dst]]+=1
                      print('BL_XREF',targets[dst],'caller_raw',hex(addr),'caller_ghidra',hex(addr+0x100000))
          print('DIRECT_BL_TOTALS',count)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: photosphere-meta-callsites-88
          path: out/
          retention-days: 3
