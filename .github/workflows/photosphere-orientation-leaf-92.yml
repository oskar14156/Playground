name: Photo Sphere orientation matrix filename 92
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  raw-disassembly:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and verify exact APK and native library
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN || github.token }}
        run: |
          set -euo pipefail
          curl -fL --retry 3 -H "Authorization: Bearer $GH_TOKEN" \
            "https://github.com/Persie0/decompile/releases/download/pho/com.google.android.GoogleCamera_8.8.225.510547499.09-66251366_minAPI33.arm64-v8a.nodpi._apkmirror.com.apk" -o camera.apk
          echo "9ca2264cbf5680c8b5b740e53849c1586c53436a7e860616584c0349dba37c47  camera.apk" | sha256sum -c -
          unzip -p camera.apk lib/arm64-v8a/liblightcycle.so > liblightcycle.so
          echo "878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1  liblightcycle.so" | sha256sum -c -
      - name: Install lightweight pinned ARM64 decoder
        run: python3 -m pip install --disable-pip-version-check capstone==5.0.6
      - name: Verify constructor's exact 16-byte orientation leaf string
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python3 - <<'PY' | tee out/session-orientation-leaf.txt
          from pathlib import Path
          from struct import unpack_from
          b=Path('liblightcycle.so').read_bytes()
          phoff=unpack_from('<Q',b,32)[0];ent,n=unpack_from('<HH',b,54)
          segs=[]
          for k in range(n):
              ty,flags,offset,va,paddr,filesz,memsz,align=unpack_from('<IIQQQQQQ',b,phoff+k*ent)
              if ty==1:segs.append((va,va+filesz,offset))
          def off(addr):
              for va,end,o in segs:
                  if va<=addr<end:return o+addr-va
              raise ValueError(hex(addr))
          va=0x4bedf
          word=b[off(va):off(va)+16]
          print('string_literal_VA=',hex(va),'length=',len(word),'raw=',word,'ascii=',word.decode('ascii'))
          print('following bytes=',b[off(va)+16:off(va)+24].hex())
          assert len(word)==16
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: photosphere-orientation-leaf-92
          path: out/
          retention-days: 3
