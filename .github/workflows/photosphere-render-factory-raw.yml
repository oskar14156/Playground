name: Photo Sphere render factory ARM64
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  raw-disassembly:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and verify exact APK and native library
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN || github.token }}
        run: |
          set -euo pipefail
          curl -fL --retry 3 -H "Authorization: Bearer $GH_TOKEN" \
            "https://github.com/Persie0/decompile/releases/download/pho/com.google.android.GoogleCamera_8.8.225.510547499.09-66251366_minAPI33.arm64-v8a.nodpi._apkmirror.com.apk" -o camera.apk
          echo "9ca2264cbf5680c8b5b740e53849c1586c53436a7e860616584c0349dba37c47  camera.apk" | sha256sum -c -
          unzip -p camera.apk lib/arm64-v8a/liblightcycle.so > liblightcycle.so
          echo "878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1  liblightcycle.so" | sha256sum -c -
      - name: Install AArch64 disassembler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils-aarch64-linux-gnu
      - name: Extract missing post-allocation instruction spans
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          readelf -W -S liblightcycle.so > out/sections.txt
          aarch64-linux-gnu-objdump -d -j .text \
            --start-address=0x31cc5c --stop-address=0x31d400 \
            liblightcycle.so > out/render-compositor.S
          aarch64-linux-gnu-objdump -d -j .text \
            --start-address=0x33f3e0 --stop-address=0x33f650 \
            liblightcycle.so > out/camera-mapper-adapter.S
          aarch64-linux-gnu-objdump -d -j .text \
            --start-address=0x331cbc --stop-address=0x331f60 \
            liblightcycle.so > out/render-helpers.S
          python3 - <<'PY'
          from pathlib import Path
          import re
          for f in sorted(Path('out').glob('*.S')):
            s=f.read_text().splitlines()
            print('===',f.name,'lines',len(s),'===')
            pat=re.compile(r'\b(?:bl|blr|adrp|str|stp|ldr|ldp|ret)\b')
            ix=[i for i,line in enumerate(s) if pat.search(line)]
            out=set(range(min(8,len(s))))
            for k in ix[:180]:
              out.update(range(max(0,k-1),min(len(s),k+2)))
            for k in sorted(out): print(s[k])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: photosphere-render-factory-raw
          path: out/
          retention-days: 3
