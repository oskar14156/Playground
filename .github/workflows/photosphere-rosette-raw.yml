name: Photo Sphere rosette raw control flow
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  raw:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Fetch exact library and disassemble
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN || github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -H "Authorization: Bearer $GH_TOKEN" \
            "https://github.com/Persie0/decompile/releases/download/pho/com.google.android.GoogleCamera_8.8.225.510547499.09-66251366_minAPI33.arm64-v8a.nodpi._apkmirror.com.apk" -o camera.apk
          echo "9ca2264cbf5680c8b5b740e53849c1586c53436a7e860616584c0349dba37c47  camera.apk" | sha256sum -c -
          unzip -p camera.apk lib/arm64-v8a/liblightcycle.so > liblightcycle.so
          echo "878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1  liblightcycle.so" | sha256sum -c -
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils-aarch64-linux-gnu
          mkdir -p out
          aarch64-linux-gnu-objdump -d --no-show-raw-insn \
            --start-address=0x3440ec --stop-address=0x344300 liblightcycle.so > out/rosette-raw.asm
          aarch64-linux-gnu-objdump -d --no-show-raw-insn \
            --start-address=0x3f19f4 --stop-address=0x3f1a60 liblightcycle.so > out/allocator-raw.asm
          echo "=== ROSETTE FULL WINDOW ==="
          cat out/rosette-raw.asm
          echo "=== ALLOCATOR ==="
          cat out/allocator-raw.asm
      - uses: actions/upload-artifact@v4
        with:
          name: photosphere-rosette-raw-window
          path: out/
          retention-days: 3
          if-no-files-found: error
