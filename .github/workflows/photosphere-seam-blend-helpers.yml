name: Photo Sphere final seam and blend helpers
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        track: [seam-success-helpers, ibfs-label-output, blend-normalization-helpers]
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and verify exact LightCycle library
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN || github.token }}
        run: |
          set -euo pipefail
          curl -fL --retry 3 -H "Authorization: Bearer $GH_TOKEN" \
            "https://github.com/Persie0/decompile/releases/download/pho/com.google.android.GoogleCamera_8.8.225.510547499.09-66251366_minAPI33.arm64-v8a.nodpi._apkmirror.com.apk" -o camera.apk
          echo "9ca2264cbf5680c8b5b740e53849c1586c53436a7e860616584c0349dba37c47  camera.apk" | sha256sum -c -
          unzip -p camera.apk lib/arm64-v8a/liblightcycle.so > liblightcycle.so
          echo "878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1  liblightcycle.so" | sha256sum -c -
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Fetch pinned Ghidra
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            "https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.4_build/ghidra_12.1.4_PUBLIC_20260921.zip" -o ghidra.zip
          unzip -q ghidra.zip
          echo "GHIDRA_HOME=$PWD/ghidra_12.1.4_PUBLIC" >> "$GITHUB_ENV"
      - name: Follow native dispatch and control flow
        env:
          TRACK: ${{ matrix.track }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "out/$TRACK" /tmp/photosphere-next
          "$GHIDRA_HOME/support/analyzeHeadless" /tmp/photosphere-next "next-$TRACK" \
            -import "$PWD/liblightcycle.so" \
            -analysisTimeoutPerFile 1200 \
            -scriptPath "$PWD/scripts" \
            -postScript PhotoSphereSweep.java "$PWD/out" "$TRACK" \
            -deleteProject > "out/$TRACK/ghidra.log" 2>&1
          test -s "out/$TRACK/index.tsv"
          echo "=== TRACK $TRACK ==="
          cat "out/$TRACK/index.tsv"
          case "$TRACK" in
            seam-success-helpers)
              addrs="0043bcd8 0043bd4c 0043bd68 0043bd94 004080c4 00439b0c"
              ;;
            ibfs-label-output)
              addrs="0043df98 0043dc58 0043c6c0 0043cad0 0043d33c"
              ;;
            blend-normalization-helpers)
              addrs="00423f2c 0042368c 0042a6a4 00422ffc 0042cd58"
              ;;
          esac
          for addr in $addrs; do
            p="out/$TRACK/${addr}_investigate.c"
            if [[ -s "$p" ]]; then
              echo "=== C $addr ==="
              sed -n '1,550p' "$p"
            fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: photosphere-final-${{ matrix.track }}
          path: out/
          retention-days: 3
          if-no-files-found: warn
