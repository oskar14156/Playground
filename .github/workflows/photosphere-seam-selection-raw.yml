name: Photo Sphere seam selection full ARM64
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  raw-disassembly:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and verify exact APK and native library
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN || github.token }}
        run: |
          set -euo pipefail
          curl -fL --retry 3 -H "Authorization: Bearer $GH_TOKEN" \
            "https://github.com/Persie0/decompile/releases/download/pho/com.google.android.GoogleCamera_8.8.225.510547499.09-66251366_minAPI33.arm64-v8a.nodpi._apkmirror.com.apk" -o camera.apk
          echo "9ca2264cbf5680c8b5b740e53849c1586c53436a7e860616584c0349dba37c47  camera.apk" | sha256sum -c -
          unzip -p camera.apk lib/arm64-v8a/liblightcycle.so > liblightcycle.so
          echo "878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1  liblightcycle.so" | sha256sum -c -
      - name: Install AArch64 disassembler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils-aarch64-linux-gnu
      - name: Extract missing post-allocation instruction spans
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          readelf -W -S liblightcycle.so > out/sections.txt
          aarch64-linux-gnu-objdump -d -j .text \
            --start-address=0x33ad54 --stop-address=0x33bce0 \
            liblightcycle.so > out/seam-selection-full.S
          aarch64-linux-gnu-objdump -d -j .text \
            --start-address=0x33c6c0 --stop-address=0x33cc00 \
            liblightcycle.so > out/ibfs-solver-full.S
          python3 - <<'PY'
          from pathlib import Path
          for name in ['seam-selection-full','ibfs-solver-full']:
              p=Path(f'out/{name}.S')
              lines=p.read_text().splitlines()
              print('===== KEY INSTRUCTIONS',name,len(lines),'=====')
              import re
              matches=[i for i,line in enumerate(lines) if re.search(r'\b(?:bl|blr|br|ret|fmov)\b',line)]
              selected=set(range(min(16,len(lines))))
              for hit in matches[:155]:
                  selected.update(range(max(hit-3,0),min(hit+4,len(lines))))
              for i in sorted(selected):
                  print(f'{i:04d} {lines[i]}')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: photosphere-arm64-gaps
          path: out/
          retention-days: 3
