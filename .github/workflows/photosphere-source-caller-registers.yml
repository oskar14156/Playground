name: Photo Sphere source mapper register origin
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  raw-disassembly:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and verify exact APK and native library
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN || github.token }}
        run: |
          set -euo pipefail
          curl -fL --retry 3 -H "Authorization: Bearer $GH_TOKEN" \
            "https://github.com/Persie0/decompile/releases/download/pho/com.google.android.GoogleCamera_8.8.225.510547499.09-66251366_minAPI33.arm64-v8a.nodpi._apkmirror.com.apk" -o camera.apk
          echo "9ca2264cbf5680c8b5b740e53849c1586c53436a7e860616584c0349dba37c47  camera.apk" | sha256sum -c -
          unzip -p camera.apk lib/arm64-v8a/liblightcycle.so > liblightcycle.so
          echo "878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1  liblightcycle.so" | sha256sum -c -
      - name: Install AArch64 disassembler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils-aarch64-linux-gnu
      - name: Extract missing post-allocation instruction spans
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          readelf -W -S liblightcycle.so > out/sections.txt
          aarch64-linux-gnu-objdump -d -j .text \
            --start-address=0x32114c --stop-address=0x321700 \
            liblightcycle.so > out/blend-a-call.S
          aarch64-linux-gnu-objdump -d -j .text \
            --start-address=0x321fb0 --stop-address=0x322340 \
            liblightcycle.so > out/blend-b-call.S
          aarch64-linux-gnu-objdump -d -j .text \
            --start-address=0x323310 --stop-address=0x323650 \
            liblightcycle.so > out/source-mapper-consumer.S
          aarch64-linux-gnu-objdump -d -j .text \
            --start-address=0x333478 --stop-address=0x333790 \
            liblightcycle.so > out/source-producer.S
          python3 - <<'PY'
          from pathlib import Path
          import re
          for f in Path('out').glob('*.S'):
            lines=f.read_text().splitlines()
            targets=[i for i,line in enumerate(lines) if
              re.search(r'\bbl\s+(?:323310|33e930|33ea50|323f2c)\b',line)]
            print('===',f.name,'total_lines',len(lines),'targets',len(targets),'===')
            seen=set()
            for i in targets:
              for k in range(max(0,i-32),min(len(lines),i+9)):
                if k not in seen:
                  print(lines[k])
                  seen.add(k)
            if not targets:
              print('\n'.join(lines[:110]))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: photosphere-source-registers
          path: out/
          retention-days: 3
