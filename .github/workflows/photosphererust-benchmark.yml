name: PhotosphereRust benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PhotosphereRust
        uses: actions/checkout@v4
        with:
          repository: Persie0/PhotosphereRust
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          path: PhotosphereRust

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Benchmark release renderer
        working-directory: PhotosphereRust
        run: cargo run --release --example synthetic_bench
