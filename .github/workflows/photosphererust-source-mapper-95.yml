name: Photo Sphere source camera mapper 95
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  map:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        config: [default, portable, android-jni]
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Persie0/PhotosphereRust
          ref: a8e8da3b64dd21adbdb446cac9305ecb5a174c6a
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN || github.token }}
          path: PhotosphereRust
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate native frame and source camera mapping
        working-directory: PhotosphereRust
        shell: bash
        env:
          CONFIG: ${{ matrix.config }}
        run: |
          set -euo pipefail
          case "$CONFIG" in
            default) cargo test --lib projection -- --nocapture; cargo check --all-targets ;;
            portable) cargo test --no-default-features --lib projection -- --nocapture; cargo check --all-targets --no-default-features ;;
            android-jni) cargo test --features android-jni --lib projection -- --nocapture; cargo check --features android-jni ;;
          esac
