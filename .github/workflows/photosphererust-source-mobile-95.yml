name: Photo Sphere source camera mobile targets 95
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  camera-map-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-linux-android, aarch64-apple-ios]
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Persie0/PhotosphereRust
          ref: cdd10c6e2d35dbbbbef951de84342c79da2e8a1b
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN || github.token }}
          path: PhotosphereRust
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Check release native camera source mapper on target
        working-directory: PhotosphereRust
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$TARGET" == "aarch64-linux-android" ]]; then
            cargo check --release --target "$TARGET" --features android-jni
          else
            cargo check --release --target "$TARGET"
          fi
