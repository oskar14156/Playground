# validate: 2026-10-08-reverse-engineering-checkpoint-88
name: PhotosphereRust validation

on:
  workflow_dispatch:

permissions:
  contents: read

# Distinct jobs run concurrently so long release stress tests do not block
# compilation failures or Android/iOS ABI checks.
jobs:
  # Resolve the private repository once; every parallel job validates
  # exactly this SHA even if other development sessions push to main.
  resolve:
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.revision.outputs.sha }}
    steps:
      - name: Checkout current PhotosphereRust
        uses: actions/checkout@v4
        with:
          repository: Persie0/PhotosphereRust
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          path: PhotosphereRust
      - name: Pin evaluated revision
        id: revision
        working-directory: PhotosphereRust
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  tests:
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PhotosphereRust
        uses: actions/checkout@v4
        with:
          repository: Persie0/PhotosphereRust
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          path: PhotosphereRust
          ref: ${{ needs.resolve.outputs.revision }}
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Default features
        working-directory: PhotosphereRust
        run: cargo test --all-targets
      - name: Portable JPEG fallback
        working-directory: PhotosphereRust
        run: cargo test --all-targets --no-default-features
      - name: Fast JPEG without mmap
        working-directory: PhotosphereRust
        run: cargo test --all-targets --no-default-features --features fast-jpeg
      - name: Mmap without fast JPEG
        working-directory: PhotosphereRust
        run: cargo test --all-targets --no-default-features --features mmap-output

  render-stress:
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PhotosphereRust
        uses: actions/checkout@v4
        with:
          repository: Persie0/PhotosphereRust
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          path: PhotosphereRust
          ref: ${{ needs.resolve.outputs.revision }}
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Quality equivalence and repeatability
        working-directory: PhotosphereRust
        run: |
          cargo test --release --test smoke direct_and_bounded_paths_are_pixel_equivalent -- --exact
          cargo test --release --test smoke grouped_bounded_path_matches_direct_pixels -- --exact
          cargo test --release --test smoke cropped_exposure_matches_full_decode_reference -- --exact
          for i in 1 2 3 4 5; do
            cargo test --release --test smoke direct_and_bounded_paths_are_pixel_equivalent -- --exact
            cargo test --release --test smoke serial_and_parallel_exposure_paths_are_pixel_equivalent -- --exact
            cargo test --release --test smoke heap_and_file_backed_output_are_pixel_equivalent -- --exact
            cargo test --release --test smoke cropped_and_full_exposure_paths_are_pixel_equivalent -- --exact
          done

  mobile-targets:
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PhotosphereRust
        uses: actions/checkout@v4
        with:
          repository: Persie0/PhotosphereRust
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          path: PhotosphereRust
          ref: ${{ needs.resolve.outputs.revision }}
      - name: Install Rust targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,aarch64-apple-ios
      - name: Android JNI feature on host
        working-directory: PhotosphereRust
        run: cargo check --features android-jni
      - name: Android ARM64
        working-directory: PhotosphereRust
        run: cargo check --release --target aarch64-linux-android --features android-jni
      - name: iOS ARM64
        working-directory: PhotosphereRust
        run: cargo check --release --target aarch64-apple-ios

  release-benchmarks:
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PhotosphereRust
        uses: actions/checkout@v4
        with:
          repository: Persie0/PhotosphereRust
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          path: PhotosphereRust
          ref: ${{ needs.resolve.outputs.revision }}
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Optimized release build
        working-directory: PhotosphereRust
        run: cargo build --release
      - name: Synthetic render benchmark
        working-directory: PhotosphereRust
        run: cargo run --release --example synthetic_bench
      - name: Phone-sized JPEG cache benchmark
        working-directory: PhotosphereRust
        run: cargo run --release --example phone_source_bench
