name: Publish Google Camera source transfer

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Playground
        uses: actions/checkout@v4

      - name: Download and verify decompile artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/Persie0/Playground/actions/artifacts/11415453729/zip"             -o artifact.zip

          echo "98e37b73bf1592e97eba1241d70ed66630c9bf31f357f9079cf94fd414afc376  artifact.zip" | sha256sum -c -

          mkdir extracted
          unzip -q artifact.zip -d extracted
          inner="extracted/google-camera-8.8.225.510547499.09-jadx-sources.zip"
          test -f "$inner"
          echo "deaf8103d63ba40f0480ee2dd5c91b71b6cb54c4f7fef2ebb86455bc6fbaa8b2  $inner" | sha256sum -c -

      - name: Build plain text transfer chunks
        shell: bash
        run: |
          set -euo pipefail
          version="8.8.225.510547499.09"
          dir="/tmp/gcam-transfer/decompiled/google-camera/$version"
          mkdir -p "$dir"

          base64 -w 0 extracted/google-camera-8.8.225.510547499.09-jadx-sources.zip             | split -b 480K -d -a 3 - "$dir/part-"

          cat > "$dir/manifest.txt" <<'EOF'
          package=com.google.android.GoogleCamera
          version=8.8.225.510547499.09
          version_code=66251366
          apk_size=272584431
          apk_sha256=9ca2264cbf5680c8b5b740e53849c1586c53436a7e860616584c0349dba37c47
          jadx_version=1.5.6
          jadx_exit=3
          jadx_errors=41
          java_files=11855
          archive_size=12693451
          archive_sha256=deaf8103d63ba40f0480ee2dd5c91b71b6cb54c4f7fef2ebb86455bc6fbaa8b2
          encoding=base64-concatenated
          part_size=480KiB
          source_run=37468402588
          source_artifact=11415453729
          EOF

          echo "parts=$(find "$dir" -name 'part-*' | wc -l)"
          du -sh /tmp/gcam-transfer

      - name: Publish transfer branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git switch --orphan gcam-transfer-plain
          git rm -rf . >/dev/null 2>&1 || true
          cp -a /tmp/gcam-transfer/. .
          git add decompiled/google-camera
          git commit -m "Publish Google Camera JADX source transfer"
          git push --force origin HEAD:gcam-transfer-plain
