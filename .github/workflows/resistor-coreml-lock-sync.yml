name: Resistor Core ML Lock Sync

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-pubspec-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate private checkout token
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
        run: test -n "$PRIVATE_TOKEN"

      - name: Checkout Resistor Scanner Core ML branch
        uses: actions/checkout@v5
        with:
          repository: Persie0/resistor_scanner
          ref: coreml-ios
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          persist-credentials: true
          path: source

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Regenerate Dart lockfile
        working-directory: source
        run: flutter pub get

      - name: Commit exact generated lockfile if changed
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          git diff -- pubspec.lock
          if git diff --quiet -- pubspec.lock; then
            echo 'pubspec.lock already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pubspec.lock
          git commit -m 'chore: regenerate Flutter lockfile for Core ML [skip ci]'
          git push origin HEAD:coreml-ios
