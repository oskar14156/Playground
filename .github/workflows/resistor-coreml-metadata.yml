name: Resistor Core ML Model Metadata

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate private checkout token
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
        run: test -n "$PRIVATE_TOKEN"

      - name: Checkout Core ML branch
        uses: actions/checkout@v5
        with:
          repository: Persie0/resistor_scanner
          ref: coreml-ios
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          persist-credentials: true
          path: source

      - name: Generate reproducible model metadata
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          def sha256(path: Path) -> str:
              h = hashlib.sha256()
              with path.open('rb') as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b''):
                      h.update(chunk)
              return h.hexdigest()

          package = Path('flutter_vision/ios/Resources/model1225.mlpackage')
          files = sorted(p for p in package.rglob('*') if p.is_file())
          package_files = {
              str(p.relative_to(package)): {
                  'bytes': p.stat().st_size,
                  'sha256': sha256(p),
              }
              for p in files
          }

          metadata = {
              'name': 'model1225',
              'format': 'Core ML MLProgram',
              'minimum_deployment_target': 'iOS 15',
              'compute_precision': 'FLOAT32',
              'input': {
                  'name': 'image',
                  'shape': [1, 3, 640, 640],
                  'color_layout': 'RGB',
                  'scale': 1.0 / 255.0,
              },
              'output': {
                  'name': 'predictions',
                  'shape': [1, 16, 8400],
                  'contract': 'normalized_xywh_class_scores_v1',
                  'class_count': 12,
              },
              'source': {
                  'original_checkpoint': 'unavailable',
                  'tflite': {
                      'path': 'assets/model1225.tflite',
                      'bytes': Path('assets/model1225.tflite').stat().st_size,
                      'sha256': sha256(Path('assets/model1225.tflite')),
                  },
                  'labels': {
                      'path': 'assets/labels10.txt',
                      'sha256': sha256(Path('assets/labels10.txt')),
                  },
              },
              'conversion': {
                  'path': [
                      'TFLite',
                      'ONNX',
                      'PyTorch',
                      'TorchScript',
                      'Core ML MLProgram',
                  ],
                  'tools': {
                      'tf2onnx': '1.16.1',
                      'onnx': '1.17.0',
                      'onnx2torch': '1.5.15',
                      'pytorch': '2.7.0',
                      'coremltools': '9.0',
                  },
              },
              'parity': {
                  'raw_atol_gate': 0.01,
                  'minimum_matched_iou_gate': 0.95,
                  'maximum_matched_score_delta_gate': 0.01,
                  'cases': {
                      'gradient': {
                          'raw_max_abs': 6.377696990966797e-06,
                          'tflite_detections': 0,
                          'coreml_detections': 0,
                      },
                      'random': {
                          'raw_max_abs': 6.079673767089844e-06,
                          'tflite_detections': 0,
                          'coreml_detections': 0,
                      },
                      'resistor.jpeg': {
                          'raw_max_abs': 5.781650543212891e-06,
                          'tflite_detections': 3,
                          'coreml_detections': 3,
                          'detection_detail': 'ok',
                      },
                  },
              },
              'package_files': package_files,
          }

          out = Path('flutter_vision/ios/Resources/model1225.metadata.json')
          out.write_text(json.dumps(metadata, indent=2, sort_keys=True) + '\n')
          print(out.read_text())
          PY

      - name: Commit metadata to Core ML branch
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add flutter_vision/ios/Resources/model1225.metadata.json
          if git diff --cached --quiet; then
            echo 'Model metadata already current.'
            exit 0
          fi
          git commit -m 'docs: record Core ML model provenance [skip ci]'
          git push origin HEAD:coreml-ios
