name: Resistor Core ML Swift Tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  swift-tests:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Validate private checkout token
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
        run: test -n "$PRIVATE_TOKEN"

      - name: Checkout Core ML branch
        uses: actions/checkout@v5
        with:
          repository: Persie0/resistor_scanner
          ref: coreml-ios
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          persist-credentials: false
          path: source

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Resolve dependencies
        working-directory: source
        run: flutter pub get

      - name: Inject plugin Swift tests into RunnerTests for this CI run
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          cat > ios/RunnerTests/RunnerTests.swift <<'SWIFT'
          import CoreGraphics
          import CoreML
          import CoreVideo
          import Flutter
          import Foundation
          import ImageIO
          import UIKit
          import XCTest
          @testable import flutter_vision
          SWIFT
          for test_file in flutter_vision/ios/Tests/*.swift; do
            echo "// ---- $(basename "$test_file") ----" >> ios/RunnerTests/RunnerTests.swift
            sed -E '/^(import |@testable import )/d' "$test_file" >> ios/RunnerTests/RunnerTests.swift
          done
          grep -E '^final class .*Tests' ios/RunnerTests/RunnerTests.swift

      - name: Generate iOS workspace and compile app
        working-directory: source
        shell: bash
        run: |
          set -o pipefail
          flutter build ios --simulator --debug 2>&1 | tee "$RUNNER_TEMP/swift-tests-build.log"

      - name: Select and boot iPhone simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          UDID="$(python3 - <<'PY'
          import json, subprocess
          data = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '-j']))
          iphones = [
              d
              for runtime, devices in data.get('devices', {}).items()
              if 'iOS' in runtime
              for d in devices
              if d.get('isAvailable') and d.get('name', '').startswith('iPhone')
          ]
          if not iphones:
              raise SystemExit('No available iPhone simulator found')
          chosen = next((d for d in iphones if d.get('state') == 'Booted'), iphones[0])
          print(chosen['udid'])
          PY
          )"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID" 2>/dev/null || true
          python3 - "$UDID" <<'PY'
          import json, subprocess, sys
          udid = sys.argv[1]
          try:
              subprocess.run(['xcrun', 'simctl', 'bootstatus', udid, '-b'], check=True, timeout=180)
          except subprocess.TimeoutExpired:
              print('bootstatus exceeded 180s; checking state directly', flush=True)
          data = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', '-j']))
          state = next((d.get('state') for devices in data.get('devices', {}).values() for d in devices if d.get('udid') == udid), None)
          print(f'simulator state={state}', flush=True)
          if state != 'Booted':
              raise SystemExit(f'Simulator failed to boot: {state}')
          PY

      - name: Run native Swift XCTest suite
        working-directory: source
        shell: bash
        run: |
          set -o pipefail
          xcodebuild test \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -only-testing:RunnerTests \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$RUNNER_TEMP/coreml-swift-tests.log"

      - name: Verify source tree was not mutated except temporary test injection
        if: always()
        working-directory: source
        shell: bash
        run: |
          git checkout -- ios/RunnerTests/RunnerTests.swift
          git diff --check
          git status --short | tee "$RUNNER_TEMP/coreml-swift-tests-status.txt"

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resistor-coreml-swift-tests
          path: |
            ${{ runner.temp }}/swift-tests-build.log
            ${{ runner.temp }}/coreml-swift-tests.log
            ${{ runner.temp }}/coreml-swift-tests-status.txt
          if-no-files-found: warn
          retention-days: 3
