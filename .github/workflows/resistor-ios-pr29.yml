name: Resistor Scanner iOS PR29

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 55
    steps:
      - name: Validate private checkout token
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
        run: test -n "$PRIVATE_TOKEN"

      - name: Checkout merged resistor_scanner default branch
        uses: actions/checkout@v5
        with:
          repository: Persie0/resistor_scanner
          ref: tflite
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          persist-credentials: false
          path: source

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Show toolchain
        run: |
          flutter --version
          xcodebuild -version
          pod --version

      - name: Resolve and analyze app camera runtime
        working-directory: source
        run: |
          flutter pub get
          flutter analyze lib/services/camera_runtime.dart

      - name: Run flutter_vision Dart tests
        working-directory: source/flutter_vision
        run: |
          flutter pub get
          flutter test test/ios_flutter_vision_test.dart

      - name: Build full resistor_scanner iOS simulator app
        working-directory: source
        shell: bash
        run: |
          set -o pipefail
          flutter build ios --simulator --debug 2>&1 | tee "$RUNNER_TEMP/app-ios-build.log"

      - name: Select iPhone simulator
        id: simulator
        shell: bash
        run: |
          UDID="$(python3 - <<'PY'
          import json, subprocess
          data = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '-j']))
          for runtime, devices in data.get('devices', {}).items():
              if 'iOS' not in runtime:
                  continue
              for device in devices:
                  if device.get('isAvailable') and device.get('name', '').startswith('iPhone'):
                      print(device['udid'])
                      raise SystemExit(0)
          raise SystemExit('No available iPhone simulator found')
          PY
          )"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Using iOS simulator $UDID"
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b

      - name: Run real YOLO11 iOS CPU simulator smoke test
        working-directory: source
        shell: bash
        run: |
          set -o pipefail
          flutter test integration_test/ios_vision_smoke_test.dart -d "${{ steps.simulator.outputs.udid }}" 2>&1 | tee "$RUNNER_TEMP/ios-integration-cpu-test.log"

      - name: Run real YOLO11 iOS Metal simulator smoke test
        working-directory: source
        shell: bash
        run: |
          set -o pipefail
          trap 'git restore integration_test/ios_vision_smoke_test.dart' EXIT
          python3 - <<'PY'
          from pathlib import Path
          path = Path('integration_test/ios_vision_smoke_test.dart')
          text = path.read_text()
          old = '        useGpu: false,\n'
          new = '        useGpu: true,\n'
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one CPU load flag, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          flutter test integration_test/ios_vision_smoke_test.dart -d "${{ steps.simulator.outputs.udid }}" 2>&1 | tee "$RUNNER_TEMP/ios-integration-metal-test.log"

      - name: Build full resistor_scanner iOS release app without signing
        working-directory: source
        shell: bash
        run: |
          set -o pipefail
          flutter build ios --release --no-codesign 2>&1 | tee "$RUNNER_TEMP/app-ios-release-build.log"

      - name: Capture Flutter iOS migration diff
        if: always()
        working-directory: source
        shell: bash
        run: |
          git status --short | tee "$RUNNER_TEMP/flutter-ios-migration-status.txt"
          git diff -- .gitignore ios > "$RUNNER_TEMP/flutter-ios-migration.patch"
          if [ -s "$RUNNER_TEMP/flutter-ios-migration.patch" ]; then
            echo 'Flutter changed tracked iOS project files during the build.'
            cat "$RUNNER_TEMP/flutter-ios-migration.patch"
          else
            echo 'No tracked iOS migration diff.'
          fi

      - name: Create minimal iOS plugin harness
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          flutter create --platforms=ios --org com.persie0.ci ios_harness
          python3 - <<'PY'
          import os
          from pathlib import Path

          pubspec = Path(os.environ['RUNNER_TEMP']) / 'ios_harness' / 'pubspec.yaml'
          plugin = Path(os.environ['GITHUB_WORKSPACE']) / 'source' / 'flutter_vision'
          text = pubspec.read_text()
          marker = "dependencies:\n  flutter:\n    sdk: flutter\n"
          replacement = marker + f"  flutter_vision:\n    path: {plugin}\n"
          if marker not in text:
              raise SystemExit('Could not find Flutter dependency block in generated pubspec')
          pubspec.write_text(text.replace(marker, replacement, 1))
          PY

      - name: Resolve iOS harness dependencies
        working-directory: ${{ runner.temp }}/ios_harness
        run: flutter pub get

      - name: Build iOS simulator harness
        working-directory: ${{ runner.temp }}/ios_harness
        shell: bash
        run: |
          set -o pipefail
          flutter build ios --simulator --debug 2>&1 | tee "$RUNNER_TEMP/plugin-ios-build.log"

      - name: Summarize iOS validation output
        if: always()
        shell: bash
        run: |
          : > "$RUNNER_TEMP/ios-errors.txt"
          for log in "$RUNNER_TEMP/app-ios-build.log" "$RUNNER_TEMP/ios-integration-cpu-test.log" "$RUNNER_TEMP/ios-integration-metal-test.log" "$RUNNER_TEMP/app-ios-release-build.log" "$RUNNER_TEMP/plugin-ios-build.log"; do
            if [ -f "$log" ]; then
              echo "===== $(basename "$log") =====" >> "$RUNNER_TEMP/ios-errors.txt"
              grep -E -i 'error:|fatal error:|failed|exception|could not build|swift compiler error|test failed' "$log" | tail -n 160 >> "$RUNNER_TEMP/ios-errors.txt" || true
            fi
          done
          cat "$RUNNER_TEMP/ios-errors.txt"

      - name: Upload iOS build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resistor-ios-pr29-build-log
          path: |
            ${{ runner.temp }}/app-ios-build.log
            ${{ runner.temp }}/ios-integration-cpu-test.log
            ${{ runner.temp }}/ios-integration-metal-test.log
            ${{ runner.temp }}/app-ios-release-build.log
            ${{ runner.temp }}/plugin-ios-build.log
            ${{ runner.temp }}/ios-errors.txt
            ${{ runner.temp }}/flutter-ios-migration-status.txt
            ${{ runner.temp }}/flutter-ios-migration.patch
          if-no-files-found: warn
          retention-days: 3

# Post-merge validation against tflite, including CPU and Metal inference paths.
