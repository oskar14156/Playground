name: Resistor native security + paywall CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-sync:
    runs-on: macos-latest
    timeout-minutes: 55
    steps:
      - name: Validate private repository token
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
        run: test -n "$PRIVATE_TOKEN"

      - name: Checkout legacy scanner branding
        uses: actions/checkout@v5
        with:
          repository: Persie0/resistor_scanner
          ref: tflite
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          persist-credentials: false
          path: legacy

      - name: Checkout Android implementation branch
        uses: actions/checkout@v5
        with:
          repository: Persie0/resistor-scanner-android
          ref: feat/security-paywall-legal-branding
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          path: android

      - name: Copy exact legacy Android icon assets
        shell: bash
        run: |
          set -euo pipefail
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "android/app/src/main/res/mipmap-$density"
            cp "legacy/android/app/src/main/res/mipmap-$density/ic_launcher.png"                "android/app/src/main/res/mipmap-$density/ic_launcher.png"
            mkdir -p "android/app/src/main/res/drawable-$density"
            cp "legacy/android/app/src/main/res/drawable-$density/ic_launcher_foreground.png"                "android/app/src/main/res/drawable-$density/ic_launcher_foreground.png"
          done

      - name: Commit Android branding if changed
        working-directory: android
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain app/src/main/res)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/res
            git commit -m "Copy legacy Resistor Scanner icon assets"
            git push origin HEAD:feat/security-paywall-legal-branding
          else
            echo "Android branding already synchronized."
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate Android tests and debug build
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest assembleDebug --stacktrace 2>&1 | tee "$RUNNER_TEMP/android-build.log"
          test -f app/build/intermediates/merged_assets/debug/mergeDebugAssets/models/resistor_segmenter.onnx.enc
          test -f app/build/intermediates/merged_assets/debug/mergeDebugAssets/models/resistor_bandnet.onnx.enc
          if find app/build/intermediates/merged_assets/debug/mergeDebugAssets -type f -name '*.onnx' | grep -q .; then
            echo "Plain ONNX model leaked into packaged Android assets." >&2
            exit 1
          fi

      - name: Checkout iOS implementation branch
        uses: actions/checkout@v5
        with:
          repository: Persie0/resistor-scanner-ios
          ref: feat/security-paywall-legal-branding
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          submodules: recursive
          path: ios

      - name: Copy exact legacy iOS icon and splash artwork
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ios/ResistorScanner/Assets.xcassets/AppIcon.appiconset
          cp -R legacy/ios/Runner/Assets.xcassets/AppIcon.appiconset                 ios/ResistorScanner/Assets.xcassets/AppIcon.appiconset
          cp legacy/ios/Runner/Assets.xcassets/AppIcon.appiconset/Icon-App-1024x1024@1x.png              ios/ResistorScanner/Assets.xcassets/LaunchIcon.imageset/launch-icon.png

      - name: Commit iOS branding if changed
        working-directory: ios
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain ResistorScanner/Assets.xcassets)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add ResistorScanner/Assets.xcassets
            git commit -m "Copy legacy Resistor Scanner app icon"
            git push origin HEAD:feat/security-paywall-legal-branding
          else
            echo "iOS branding already synchronized."
          fi

      - name: Validate Swift core tests
        working-directory: ios
        shell: bash
        run: |
          set -o pipefail
          swift test 2>&1 | tee "$RUNNER_TEMP/swift-tests.log"

      - name: Resolve iOS packages
        working-directory: ios
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -resolvePackageDependencies             -project ResistorScanner.xcodeproj 2>&1 | tee "$RUNNER_TEMP/ios-resolve.log"

      - name: Build iOS simulator app
        working-directory: ios
        shell: bash
        run: |
          set -o pipefail
          xcodebuild             -project ResistorScanner.xcodeproj             -scheme ResistorScanner             -configuration Debug             -sdk iphonesimulator             -destination 'generic/platform=iOS Simulator'             CODE_SIGNING_ALLOWED=NO             REVENUECAT_IOS_API_KEY=appl_ci_placeholder             REVENUECAT_ENTITLEMENT_ID=pro             build 2>&1 | tee "$RUNNER_TEMP/ios-build.log"

      - name: Verify iOS app contains encrypted models only
        working-directory: ios
        shell: bash
        run: |
          set -euo pipefail
          APP="$(find ~/Library/Developer/Xcode/DerivedData -type d -path '*/Build/Products/Debug-iphonesimulator/ResistorScanner.app' -print -quit)"
          test -n "$APP"
          test -f "$APP/Models/resistor_segmenter.onnx.enc"
          test -f "$APP/Models/resistor_bandnet.onnx.enc"
          if find "$APP/Models" -type f -name '*.onnx' | grep -q .; then
            echo "Plain ONNX model leaked into iOS app bundle." >&2
            exit 1
          fi
          test -d "$APP/Assets.car" || true

      - name: Summarize failures
        if: always()
        shell: bash
        run: |
          for log in "$RUNNER_TEMP/android-build.log" "$RUNNER_TEMP/swift-tests.log" "$RUNNER_TEMP/ios-resolve.log" "$RUNNER_TEMP/ios-build.log"; do
            if [ -f "$log" ]; then
              echo "===== $(basename "$log") ====="
              grep -E -i 'error:|fatal error:|FAILURE:|BUILD FAILED|test failed|SwiftCompile|Execution failed' "$log" | tail -n 120 || true
            fi
          done
