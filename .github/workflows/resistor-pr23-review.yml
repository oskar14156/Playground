name: Resistor PR23 review

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Validate private checkout token
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
        run: test -n "$PRIVATE_TOKEN"

      - name: Checkout PR branch
        uses: actions/checkout@v5
        with:
          repository: Persie0/resistor_scanner
          ref: chore/r8-modernization-20260919
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          persist-credentials: false
          path: app

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.6.0'

      - name: Resolve dependencies
        working-directory: app
        run: flutter pub get

      - name: Create temporary CI signing key
        run: |
          keytool -genkeypair -v             -keystore /tmp/resistor-ci.jks             -storepass resistorci             -alias resistorci             -keypass resistorci             -dname "CN=Resistor CI"             -keyalg RSA             -validity 3650
          cat > app/android/key.properties <<'EOF'
          storePassword=resistorci
          keyPassword=resistorci
          keyAlias=resistorci
          storeFile=/tmp/resistor-ci.jks
          EOF

      - name: Build optimized release bundle
        working-directory: app
        run: flutter build appbundle --release --obfuscate --split-debug-info=./build --no-pub

      - name: Analyze release R8 configuration
        working-directory: app/android
        run: gradle :app:analyzeReleaseR8Config --no-daemon

      - name: Verify PR R8 metrics gate
        working-directory: app
        run: python3 .github/scripts/verify_r8_metrics.py
