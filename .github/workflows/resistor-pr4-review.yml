name: Resistor PR4 Review CI

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_REPOSITORY: Persie0/resistor-scanner-android
  APP_REF: feat/result-preview-confidence-threshold
  EXPECTED_HEAD: a5b3f4e1d6352d7d38d984912dd34bcf92290e62

jobs:
  review-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate private checkout token
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
        run: test -n "$PRIVATE_TOKEN"

      - name: Checkout public review harness
        uses: actions/checkout@v5
        with:
          path: harness
          persist-credentials: false

      - name: Checkout PR branch
        uses: actions/checkout@v5
        with:
          repository: ${{ env.APP_REPOSITORY }}
          ref: ${{ env.APP_REF }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          persist-credentials: true
          path: app

      - name: Verify expected PR head
        working-directory: app
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Apply review fixes
        run: |
          python3 harness/scripts/resistor_pr4_review_patch.py app
          git -C app diff --check
          git -C app diff -- app/src/main/java/at/austriao/resistorscanner/pipeline/ScannerPipeline.kt app/src/main/java/at/austriao/resistorscanner/ui/ScannerScreen.kt

      - name: Commit fixes to PR branch
        working-directory: app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/at/austriao/resistorscanner/pipeline/ScannerPipeline.kt app/src/main/java/at/austriao/resistorscanner/ui/ScannerScreen.kt
          git diff --cached --quiet && exit 1
          git commit -m "fix: avoid redundant preview work and slider rescans"
          git push origin "HEAD:${APP_REF}"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate hosted Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -perm -u+x 2>/dev/null | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" >/dev/null

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          validate-wrappers: false

      - name: Verify unit tests, lint, and builds
        working-directory: app
        run: gradle --no-daemon clean testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest
