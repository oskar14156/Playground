name: Resistor Scanner Debug APK

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_REPOSITORY: Persie0/resistor-scanner-android
  APP_REF: main

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate private checkout token
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
        run: test -n "$PRIVATE_TOKEN"

      - name: Checkout resistor scanner
        uses: actions/checkout@v5
        with:
          repository: ${{ env.APP_REPOSITORY }}
          ref: ${{ env.APP_REF }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          persist-credentials: false
          path: app

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate hosted Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -perm -u+x 2>/dev/null | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" >/dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Verify production model assets
        working-directory: app
        run: |
          test -s app/src/main/assets/models/resistor_segmenter.onnx
          test -s app/src/main/assets/models/resistor_segmenter.json
          test -s app/src/main/assets/models/resistor_bandnet.onnx
          test -s app/src/main/assets/models/resistor_bandnet.json
          ls -lh app/src/main/assets/models/*.onnx app/src/main/assets/models/*.json

      - name: Test and build debug APK
        working-directory: app
        run: ./gradlew --no-daemon clean testDebugUnitTest assembleDebug

      - name: Verify models are packaged in APK
        working-directory: app
        shell: bash
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | grep -F 'assets/models/resistor_segmenter.onnx'
          unzip -l "$APK" | grep -F 'assets/models/resistor_bandnet.onnx'
          SHORT_SHA="$(git rev-parse --short=10 HEAD)"
          cp "$APK" "resistor-scanner-debug-${SHORT_SHA}.apk"
          echo "APK_FILE=resistor-scanner-debug-${SHORT_SHA}.apk" >> "$GITHUB_ENV"
          sha256sum "resistor-scanner-debug-${SHORT_SHA}.apk"
          ls -lh "resistor-scanner-debug-${SHORT_SHA}.apk"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: resistor-scanner-debug-apk
          path: app/${{ env.APK_FILE }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
