name: Resistor Scanner settings sheet bottom anchor

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout corrected Resistor Scanner
        uses: actions/checkout@v4
        with:
          repository: Persie0/resistor-scanner-android
          ref: c1d855f8bae3506a5781dba385960da74a46b593
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: app

      - name: Assert sheet anchoring layout
        working-directory: app
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          code = Path("app/src/main/java/at/austriao/resistorscanner/ui/ScannerScreen.kt").read_text()
          sheet = code.split("private fun ScannerSettingsSheet(", 1)[1].split("private enum class SettingsCategory", 1)[0]
          modal = sheet.split("ModalBottomSheet(", 1)[1].split(") {", 1)[0]
          content = sheet.split("ModalBottomSheet(", 1)[1].split(") {", 1)[1].split("Text(", 1)[0]
          assert "fillMaxHeight" not in modal, "Dialog host must not be height-limited"
          assert "fillMaxHeight(0.875f)" in content, "Sheet content must have the height limit"
          assert ".navigationBarsPadding()" in content, "Preserve bottom navigation insets"
          assert ".verticalScroll(" in sheet and ".weight(1f)" in sheet, "Settings must remain scrollable"
          PY

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Kotlin unit tests and release lint
        working-directory: app
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :app:lintRelease --stacktrace

      - name: Print lint report on failure
        if: failure()
        working-directory: app
        run: |
          if [ -f app/build/reports/lint-results-release.txt ]; then
            cat app/build/reports/lint-results-release.txt
          fi
