name: Root Detector Kotlin verification (public runner)
# Build the native migration without spending private-repository Actions minutes.
# R8 coverage update: exclude unused BIGO mediation and Sentry ad analytics.
# Emulator: permit KVM access and use a lower API to avoid software-emulation timeout.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Persie0/root_detection_app
          ref: native-kotlin-migration
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          path: root-detector

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Install Android SDK 37
        shell: bash
        run: |
          set -euo pipefail
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37" ||             "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.0"

      - name: Ensure Flutter is archived and not a build dependency
        working-directory: root-detector
        run: |
          set -euo pipefail
          test -e old/pubspec.yaml
          test -e old/lib/detection_screen.dart
          test ! -e pubspec.yaml
          ! grep -R -n 'dev.flutter.flutter-gradle-plugin\|io.flutter.embedding'              --include='*.gradle' --include='*.kts' --include='*.kt' app

      - name: Run native Android tests and compile APK
        working-directory: root-detector
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:bundleRelease --stacktrace

      - name: Check out release builder verification scripts
        uses: actions/checkout@v4
        with:
          repository: Persie0/firebase_tester_builder
          ref: kotlin-play-release
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          path: .firebase_builder

      - name: Enforce Kotlin release R8 25 percent gate
        run: python3 .firebase_builder/.github/scripts/verify_r8_min_scores.py root-detector/app/build/outputs/bundle/release/app-release.aab

      - name: Give emulator user access to hardware KVM
        if: always()
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod a+rw /dev/kvm
            ls -l /dev/kvm
          fi

      - name: Validate on Android emulator
        if: always()
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            set -euo pipefail
            adb install root-detector/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n at.persie0.root_detection_app/.MainActivity
            sleep 12
            adb shell pidof at.persie0.root_detection_app
            adb shell uiautomator dump /sdcard/root-detector-ui.xml
            adb shell cat /sdcard/root-detector-ui.xml > root-detector-ui.xml
            grep -E 'EULA|Terms|Accept' root-detector-ui.xml

            # Interact through accessibility bounds rather than assuming a fixed screen size.
            python3 - <<'PY'
            import re
            import subprocess
            import xml.etree.ElementTree as ET

            def tap_label(label):
                result = subprocess.run(
                    ["adb", "shell", "uiautomator", "dump", "/sdcard/root-detector-ui.xml"],
                    capture_output=True, text=True, timeout=45
                )
                if result.returncode:
                    raise RuntimeError(result.stdout + result.stderr)
                xml = subprocess.check_output(
                    ["adb", "shell", "cat", "/sdcard/root-detector-ui.xml"], text=True
                )
                nodes = ET.fromstring(xml).iter("node")
                for node in nodes:
                    desc = node.attrib.get("text", "") + " " + node.attrib.get("content-desc", "")
                    if label.casefold() not in desc.casefold():
                        continue
                    coords = [int(v) for v in re.findall("[0-9]+", node.attrib.get("bounds", ""))]
                    if len(coords) == 4:
                        a, b, c, d = coords
                        subprocess.check_call(["adb", "shell", "input", "tap", str((a+c)//2), str((b+d)//2)])
                        return
                raise RuntimeError("UI label not found: " + label)

            tap_label("I have read and agree")
            tap_label("Accept and Continue")
            PY
            sleep 12
            adb shell pidof at.persie0.root_detection_app
