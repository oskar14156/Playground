name: Root Detector native emulator smoke
# Recheck Sentry manual-only initialization after fixing startup crash.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Persie0/root_detection_app
          ref: native-kotlin-migration
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          path: root-detector
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Install Android SDK 37
        run: |
          set -euo pipefail
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-37.0'
      - name: Assemble native debug APK
        working-directory: root-detector
        run: gradle --no-daemon :app:assembleDebug
      - name: Enable KVM acceleration
        run: |
          set -euo pipefail
          if [ -e /dev/kvm ]; then sudo chmod a+rw /dev/kvm; fi
          ls -l /dev/kvm
      - name: Android 13 launch and EULA smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 600
          script: bash root-detector/scripts/emulator-smoke.sh
      - name: Upload screenshots for UI comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: root-detector-native-smoke
          path: |
            root-detector-eula.png
            root-detector-scan.png
            root-detector-logcat.txt
          if-no-files-found: ignore
          retention-days: 3
