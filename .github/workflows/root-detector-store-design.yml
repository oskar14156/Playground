name: Root Detector Store design and purchase-disclosure verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kotlin-store:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Persie0/root_detection_app
          ref: material3-store-readable-plans
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          path: root-detector
      - uses: actions/checkout@v4
        with:
          repository: Persie0/firebase_tester_builder
          ref: main
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          path: release-builder
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Install Android 37
        run: |
          set -euo pipefail
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.0"
      - name: Unit tests, release lint, debug APK and optimized release AAB
        working-directory: root-detector
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintRelease :app:assembleDebug :app:bundleRelease --stacktrace
      - name: Verify 25 percent R8 thresholds
        run: python3 release-builder/.github/scripts/verify_r8_min_scores.py root-detector/app/build/outputs/bundle/release/app-release.aab
