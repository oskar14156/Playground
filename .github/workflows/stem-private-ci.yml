name: Stem private CI

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch/tag/SHA in Persie0/stem
        required: true
        default: main
        type: string

permissions:
  contents: write

env:
  APP_REPOSITORY: Persie0/stem
  APP_REF: ${{ inputs.ref || 'main' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Validate private checkout token
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
        run: test -n "$PRIVATE_TOKEN"
      - name: Checkout exact app revision
        uses: actions/checkout@v5
        with:
          repository: ${{ env.APP_REPOSITORY }}
          ref: ${{ env.APP_REF }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          persist-credentials: false
          path: stem-app
      - name: Checkout private CI harness
        uses: actions/checkout@v5
        with:
          repository: ${{ env.APP_REPOSITORY }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          persist-credentials: false
          path: private-ci
          sparse-checkout: .github/playground
          sparse-checkout-cone-mode: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Run private regression/build harness
        run: bash private-ci/.github/playground/private-ci.sh stem-app
      - name: Publish verified debug APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA="$(git -C stem-app rev-parse HEAD)"
          SHORT_SHA="${SHA:0:8}"
          TAG="stem-debug-${SHORT_SHA}"
          APK="stem-app/build/app/outputs/flutter-apk/app-debug.apk"
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes >/dev/null 2>&1 || true
          gh release create "$TAG" "$APK#stem-debug.apk" --repo "$GITHUB_REPOSITORY" --title "Stem debug $SHORT_SHA" --notes "Private app regression/build validation passed for revision $SHA."
