name: Surebets edit-aware history and 10-entry paywall

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Verify private checkout token
        env:
          REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: test -n "$REPO_TOKEN"

      - name: Checkout private Surebets fix branch
        uses: actions/checkout@v4
        with:
          repository: Persie0/surebets_calculator
          ref: fix/edit-aware-bet-history-paywall-10
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: app

      - name: Authenticate Git dependencies
        env:
          REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: git config --global url."https://x-access-token:${REPO_TOKEN}@github.com/".insteadOf https://github.com/

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Format modified history files
        working-directory: app
        run: |
          dart format lib/services/bet_history_service.dart lib/services/bet_history_edit_tracker.dart lib/calculator_screen.dart test/history_edit_tracker_test.dart test/history_navigation_flush_test.dart test/history_odds_precision_test.dart test/history_paywall_cadence_test.dart test/history_paywall_repeat_test.dart test/history_paywall_recovery_test.dart test/calculator_odds_history_integration_test.dart

      - name: Flutter analyze
        working-directory: app
        run: flutter analyze --no-fatal-infos

      - name: Run approved edit-aware and incomplete-stake regressions
        working-directory: app
        run: flutter test test/history_edit_tracker_test.dart test/history_paywall_cadence_test.dart test/history_paywall_recovery_test.dart test/history_paywall_repeat_test.dart test/calculator_odds_history_integration_test.dart test/history_navigation_flush_test.dart test/history_odds_precision_test.dart test/history_persistence_regression_test.dart

      - name: Run all Flutter tests
        working-directory: app
        run: flutter test

      - name: Commit tested formatting to private fix branch
        if: success()
        working-directory: app
        env:
          REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          git config user.name "OpenAI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/services/bet_history_service.dart lib/services/bet_history_edit_tracker.dart lib/calculator_screen.dart test/history_edit_tracker_test.dart test/history_navigation_flush_test.dart test/history_odds_precision_test.dart test/history_paywall_cadence_test.dart test/history_paywall_repeat_test.dart test/history_paywall_recovery_test.dart test/calculator_odds_history_integration_test.dart
          if ! git diff --cached --quiet; then
            git commit -m "style: format tested edit-aware history code [skip ci]"
            git remote set-url origin "https://x-access-token:${REPO_TOKEN}@github.com/Persie0/surebets_calculator.git"
            git push origin HEAD:fix/edit-aware-bet-history-paywall-10
          fi
