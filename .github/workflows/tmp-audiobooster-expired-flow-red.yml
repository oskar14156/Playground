name: Temporary AudioBooster bootstrap cleanup GREEN

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Checkout AudioBooster feature
        uses: actions/checkout@v4
        with:
          repository: Persie0/Audiobooster
          ref: f0a4c11c7a083ff40cae1e98c20ce3ba7f35ea97
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          path: audiobooster
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Dependencies
        working-directory: audiobooster
        run: flutter pub get
      - name: Focused source tests
        working-directory: audiobooster
        run: flutter test test/bootstrap_android_source_test.dart test/foreground_engine_source_test.dart
