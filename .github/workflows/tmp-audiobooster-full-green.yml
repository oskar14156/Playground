name: Temporary AudioBooster full green gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Check out AudioBooster feature branch
        uses: actions/checkout@v4
        with:
          repository: Persie0/Audiobooster
          ref: feature/supported-app-icons
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          path: audiobooster
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: audiobooster-root-removal-${{ runner.os }}-v1
      - name: Install dependencies
        working-directory: audiobooster
        run: flutter pub get
      - name: Run Flutter tests
        working-directory: audiobooster
        run: flutter test
      - name: Analyze
        working-directory: audiobooster
        run: flutter analyze
      - name: Bootstrap Android twice
        working-directory: audiobooster
        run: |
          bash tool/bootstrap_android.sh
          bash tool/bootstrap_android.sh
      - name: Android unit tests
        working-directory: audiobooster/android
        run: ./gradlew :app:testDebugUnitTest
      - name: Build debug APK
        working-directory: audiobooster
        run: flutter build apk --debug
