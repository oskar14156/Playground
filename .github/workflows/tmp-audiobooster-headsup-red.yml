name: Temporary AudioBooster heads-up notification final

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Check out exact AudioBooster revision
        uses: actions/checkout@v4
        with:
          repository: Persie0/Audiobooster
          ref: 18d07d07df8c2fc19b91047a225903b26be10e07
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          path: audiobooster
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: audiobooster
        run: flutter pub get

      - name: Focused heads-up and paywall tests
        working-directory: audiobooster
        run: flutter test test/heads_up_notification_source_test.dart test/trial_paywall_flow_test.dart

      - name: Full Flutter tests
        working-directory: audiobooster
        run: flutter test

      - name: Analyze
        working-directory: audiobooster
        run: flutter analyze

      - name: Bootstrap Android and verify mirrored native sources
        working-directory: audiobooster
        run: |
          bash tool/bootstrap_android.sh
          cmp tool/android/MainActivity.kt android/app/src/main/kotlin/com/persie0/audiobooster/MainActivity.kt
          diff -qr tool/android/com/persie0/audiobooster/audio android/app/src/main/kotlin/com/persie0/audiobooster/audio

      - name: Build debug APK
        working-directory: audiobooster
        run: flutter build apk --debug
