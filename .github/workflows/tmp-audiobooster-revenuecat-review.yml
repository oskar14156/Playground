name: Temporary AudioBooster RevenueCat review GREEN
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check out AudioBooster feature
        uses: actions/checkout@v4
        with:
          repository: Persie0/Audiobooster
          ref: feature/revenuecat-trial-monetization
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          path: audiobooster
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        working-directory: audiobooster
        run: flutter pub get
      - name: RevenueCat review tests
        working-directory: audiobooster
        run: flutter test test/subscription/subscription_service_test.dart

# rerun after RevenueCat review fixes
