name: Temporary AudioBooster session localization validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Check out exact AudioBooster feature revision
        uses: actions/checkout@v4
        with:
          repository: Persie0/Audiobooster
          ref: ea8034b7fa4191cb314ec15e58e680a326fdadc2
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          path: audiobooster
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare
        working-directory: audiobooster
        run: |
          set -euxo pipefail
          flutter pub get
          flutter gen-l10n

      - name: foreground_engine_source_test
        if: always()
        working-directory: audiobooster
        run: flutter test test/foreground_engine_source_test.dart

      - name: notification_permission_and_compatibility_copy_test
        if: always()
        working-directory: audiobooster
        run: flutter test test/notification_permission_and_compatibility_copy_test.dart

      - name: bootstrap_android_source_test
        if: always()
        working-directory: audiobooster
        run: flutter test test/bootstrap_android_source_test.dart

      - name: root_mode_source_test
        if: always()
        working-directory: audiobooster
        run: flutter test test/root_mode_source_test.dart

      - name: native_bridge_source_test
        if: always()
        working-directory: audiobooster
        run: flutter test test/native_bridge_source_test.dart

      - name: native_modern_engine_source_test
        if: always()
        working-directory: audiobooster
        run: flutter test test/native_modern_engine_source_test.dart

      - name: device_validation_source_test
        if: always()
        working-directory: audiobooster
        run: flutter test test/device_validation_source_test.dart

      - name: user_facing_copy_test
        if: always()
        working-directory: audiobooster
        run: flutter test test/user_facing_copy_test.dart

      - name: home_history_tutorial_test
        if: always()
        working-directory: audiobooster
        run: flutter test test/home_history_tutorial_test.dart

      - name: onboarding_test
        if: always()
        working-directory: audiobooster
        run: flutter test test/onboarding_test.dart

      - name: advanced_audio_page_test
        if: always()
        working-directory: audiobooster
        run: flutter test test/advanced_audio_page_test.dart

      - name: automatic_setup_fallback_test
        if: always()
        working-directory: audiobooster
        run: flutter test test/automatic_setup_fallback_test.dart

      - name: simplified_play_flow_test
        if: always()
        working-directory: audiobooster
        run: flutter test test/simplified_play_flow_test.dart
