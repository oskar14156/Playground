name: Traffic counting analysis PR CI

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_REPOSITORY: Persie0/traffic-counting-light-main
  DETECTOR_REF: perzi/stef-pr6-dashboard-analysis
  DASHBOARD_REF: perzi/stef-pr6-dashboard-analysis

jobs:
  detector:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Validate private checkout token
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: test -n "$PRIVATE_TOKEN"

      - name: Checkout final PR6 candidate
        uses: actions/checkout@v5
        with:
          repository: ${{ env.APP_REPOSITORY }}
          ref: ${{ env.DETECTOR_REF }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: app

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install detector dev dependencies
        working-directory: app/traffic-counting-edge-detection-master
        run: python -m pip install -e ".[dev]"

      - name: Compile detector sources
        working-directory: app/traffic-counting-edge-detection-master
        run: python -m compileall -q src

      - name: Correctness lint
        working-directory: app/traffic-counting-edge-detection-master
        run: ruff check --select E9,F63,F7,F82 src tests

      - name: Run all PR2-PR5 and direction regression tests
        working-directory: app/traffic-counting-edge-detection-master
        run: |
          PYTHONPATH=src pytest -q             tests/test_analysis_*.py             tests/test_direction_detection.py

      - name: Run broader detector suite excluding documented stale legacy contracts
        working-directory: app/traffic-counting-edge-detection-master
        run: |
          PYTHONPATH=src pytest -q tests             --ignore=tests/http_publisher_tests/test_settings_publisher.py             --ignore=tests/test_libreyolo_export_contract.py             --deselect=tests/test_dependency_profiles.py::TestDependencyProfiles::test_legacy_setup_requirements_remain_hailo_profile_wrapper

  dashboard:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Validate private checkout token
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: test -n "$PRIVATE_TOKEN"

      - name: Checkout final PR6 candidate
        uses: actions/checkout@v5
        with:
          repository: ${{ env.APP_REPOSITORY }}
          ref: ${{ env.DASHBOARD_REF }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: app

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/traffic-counting-edge-dashboard-main/frontend/package-lock.json

      - name: Install dashboard backend dependencies
        working-directory: app/traffic-counting-edge-dashboard-main/server
        run: python -m pip install -r requirements.txt pytest httpx

      - name: Run complete dashboard backend tests
        working-directory: app/traffic-counting-edge-dashboard-main/server
        run: PYTHONPATH=. pytest -q tests

      - name: Install frontend dependencies
        working-directory: app/traffic-counting-edge-dashboard-main/frontend
        run: npm ci

      - name: Run complete frontend unit tests
        working-directory: app/traffic-counting-edge-dashboard-main/frontend
        run: npx ng test --watch=false

      - name: Production frontend build
        working-directory: app/traffic-counting-edge-dashboard-main/frontend
        run: npm run build
