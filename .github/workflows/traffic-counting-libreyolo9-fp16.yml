name: Traffic Counting LibreYOLO9 FP16 edge validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Playground
        uses: actions/checkout@v4

      - name: Checkout traffic-counting edge-only FP16 branch
        uses: actions/checkout@v4
        with:
          repository: Persie0/traffic-counting-light-main
          ref: fp16-libreyolo-edge-only
          path: traffic-counting-light-main
          token: ${{ secrets.GH_RELEASE_TOKEN || secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          lfs: true
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lightweight test dependencies
        working-directory: traffic-counting-light-main
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pytest<10" "pyyaml<7"

      - name: Run exporter and metadata helper tests
        working-directory: traffic-counting-light-main
        run: |
          PYTHONPATH=edge/src pytest -q edge/tests/test_libreyolo_fp16_export.py

      - name: Validate edge FP16 artifacts
        working-directory: traffic-counting-light-main
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import yaml

          targets = [
              (Path('edge/models/libreyolo9t_384x288_ncnn_model'), (288, 384)),
              (Path('edge/models/libreyolo9t_416x256_ncnn_model'), (256, 416)),
          ]

          for target, expected_hw in targets:
              for name in ['model.ncnn.param', 'model.ncnn.bin', 'metadata.yaml', 'provenance.json']:
                  p = target / name
                  assert p.is_file() and p.stat().st_size > 0, p

              metadata = yaml.safe_load((target / 'metadata.yaml').read_text(encoding='utf-8'))
              assert (metadata['imgsz_h'], metadata['imgsz_w']) == expected_hw
              assert metadata['model_family'] == 'yolo9'
              assert metadata['task'] == 'detect'
              assert metadata['precision'] == 'fp16'
              assert metadata['weight_storage'] == 'fp16'
              assert metadata['runtime_compute_precision'] == 'runtime-dependent'
              assert metadata['ncnnoptimize_storage_flag'] == 65536
              assert metadata['source_checkpoint_sha256'] is None

              provenance = json.loads((target / 'provenance.json').read_text(encoding='utf-8'))
              assert provenance['artifact_role'] == 'edge-production'
              assert provenance['source_project'] == 'LibreYOLO'
              assert provenance['source_checkpoint'] == 'LibreYOLO9t.pt'
              assert provenance['weights_license'] == 'MIT'
              assert provenance['precision'] == 'fp16'
              assert provenance['weight_storage'] == 'fp16'
              assert provenance['runtime_compute_precision'] == 'runtime-dependent'
              assert provenance['source_checkpoint_sha256'] is None
              assert provenance['optimizer']['storage_flag'] == 65536
              assert provenance['conversion_source']['kind'] == 'checked-in-fp32-ncnn'
              assert provenance['conversion_source']['precision'] == 'fp32'

              for name in ('model.ncnn.param', 'model.ncnn.bin', 'metadata.yaml'):
                  digest = hashlib.sha256((target / name).read_bytes()).hexdigest()
                  assert provenance['files'][name]['sha256'] == digest

              bin_size = (target / 'model.ncnn.bin').stat().st_size
              assert bin_size < 5_000_000, (target, bin_size)
              print(f'{target}: {bin_size} bytes')
          PY

      - name: Verify baseV2 scope is limited to metadata helper usage
        working-directory: traffic-counting-light-main
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git diff --name-only origin/main...HEAD -- baseV2 | sort)"
          expected="$(printf '%s\n' \
            'baseV2/traffic-counting-edge-detection-master/src/inference/model_metadata.py' \
            'baseV2/traffic-counting-edge-detection-master/src/inference/ncnn_inference.py' | sort)"
          printf 'baseV2 changes:\n%s\n' "$actual"
          test "$actual" = "$expected"
          test ! -e baseV2/traffic-counting-edge-detection-master/src/inference/models/libreyolo9t-384x640-ncnn
          test ! -e tools/compare_libreyolo9_ncnn.py
          ! grep -q -- '--include-basev2' tools/export_libreyolo9_ncnn.py
          ! grep -q -- '--skip-edge' tools/export_libreyolo9_ncnn.py

      - name: Validate production detector config
        working-directory: traffic-counting-light-main
        run: |
          PYTHONPATH=edge/src pytest -q edge/tests/test_pi_detector_config.py
