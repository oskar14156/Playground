name: Traffic counting recent PR validation

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_REPOSITORY: Persie0/traffic-counting-light-main

jobs:
  validate:
    name: PR ${{ matrix.pr }} - ${{ matrix.kind }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - pr: 43
            ref: benchmark/pi5-openmp-blocktime
            kind: openmp-blocktime
          - pr: 44
            ref: perf/production-mapped-camera
            kind: mapped-camera
          - pr: 45
            ref: perf/cpu-budget-scheduler-clean
            kind: cpu-budget-scheduler

    steps:
      - name: Validate checkout token
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: test -n "$PRIVATE_TOKEN"

      - name: Checkout candidate
        uses: actions/checkout@v5
        with:
          repository: ${{ env.APP_REPOSITORY }}
          ref: ${{ matrix.ref }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: app

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install detector dev dependencies
        working-directory: app/traffic-counting-edge-detection-master
        run: python -m pip install -e ".[dev]"

      - name: Compile Python sources
        working-directory: app/traffic-counting-edge-detection-master
        run: |
          python -m compileall -q src tests benchmark/tools/perzi

      - name: Correctness lint
        working-directory: app/traffic-counting-edge-detection-master
        run: |
          ruff check --target-version py312 --select E9,F63,F7,F82 src tests benchmark/tools/perzi

      - name: Focused PR tests
        working-directory: app/traffic-counting-edge-detection-master
        shell: bash
        run: |
          set -euxo pipefail
          case "${{ matrix.pr }}" in
            43)
              PYTHONPATH=src pytest -q tests/benchmark/test_openmp_blocktime_bench.py
              python benchmark/tools/perzi/openmp_blocktime_bench.py --help >/dev/null
              ;;
            44)
              PYTHONPATH=src pytest -q tests/test_mapped_camera_input.py
              ;;
            45)
              PYTHONPATH=src pytest -q tests/test_perf_tuning.py
              python benchmark/tools/perzi/cpu_budget_scheduler_bench.py --help >/dev/null
              ;;
          esac

      - name: Detector regression suite
        working-directory: app/traffic-counting-edge-detection-master
        run: |
          PYTHONPATH=src pytest -q tests \
            --ignore=tests/http_publisher_tests/test_settings_publisher.py \
            --ignore=tests/test_libreyolo_export_contract.py \
            --deselect=tests/test_dependency_profiles.py::TestDependencyProfiles::test_legacy_setup_requirements_remain_hailo_profile_wrapper
