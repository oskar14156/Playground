name: Traffic counting pipeline 25fps lab

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Private traffic-counting branch/tag/SHA
        required: true
        default: perf/pipeline-25fps
        type: string

permissions:
  contents: read

env:
  APP_REPOSITORY: Persie0/traffic-counting-light-main
  APP_REF: ${{ inputs.ref || 'perf/pipeline-25fps' }}

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Validate private checkout token
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: test -n "$PRIVATE_TOKEN"

      - name: Checkout Playground
        uses: actions/checkout@v5

      - name: Checkout traffic-counting candidate
        uses: actions/checkout@v5
        with:
          repository: ${{ env.APP_REPOSITORY }}
          ref: ${{ env.APP_REF }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          lfs: false
          path: app

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: app/edge/pyproject.toml

      - name: Install benchmark dependencies
        working-directory: app/edge
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[libreyolo-export,dev]"

      - name: Export fixed-shape LibreYOLO9t model
        working-directory: app
        run: python tools/export_libreyolo9_ncnn.py --shape 384x288 --overwrite

      - name: Show committed image fixtures
        run: |
          find app -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' \) -print | head -80 || true

      - name: Run current focused regression tests
        working-directory: app/edge
        run: |
          PYTHONPATH=src pytest -q \
            tests/test_ncnn_output.py \
            tests/test_pi_detector_config.py \
            tests/test_preprocessors.py \
            tests/test_rpi_dual_stream_loader.py \
            tests/test_config.py

      - name: Benchmark NCNN input preparation and runtime options
        working-directory: app
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import statistics
          import time
          from pathlib import Path

          import cv2
          import ncnn
          import numpy as np

          W, H = 384, 288
          MODEL = Path('edge/models/libreyolo9t_384x288_ncnn_model')
          rng = np.random.default_rng(20260923)
          image = rng.integers(0, 256, size=(H, W, 3), dtype=np.uint8)

          def configure_net(fp16: bool):
              net = ncnn.Net()
              net.opt.num_threads = 4
              if hasattr(net.opt, 'use_packing_layout'):
                  net.opt.use_packing_layout = True
              for name in ('use_fp16_packed', 'use_fp16_storage', 'use_fp16_arithmetic'):
                  if hasattr(net.opt, name):
                      setattr(net.opt, name, fp16)
              assert int(net.load_param(str(MODEL / 'model.ncnn.param'))) == 0
              assert int(net.load_model(str(MODEL / 'model.ncnn.bin'))) == 0
              input_names = net.input_names() if callable(getattr(net, 'input_names', None)) else []
              output_names = net.output_names() if callable(getattr(net, 'output_names', None)) else []
              return net, str(input_names[0]) if input_names else 'in0', str(output_names[0]) if output_names else 'out0'

          def prep_current():
              mat = ncnn.Mat.from_pixels(image, ncnn.Mat.PixelType.PIXEL_BGR2RGB, W, H)
              mat.substract_mean_normalize([], [1.0 / 255.0] * 3)
              return mat

          def prep_blob():
              blob = cv2.dnn.blobFromImage(
                  image,
                  scalefactor=1.0 / 255.0,
                  size=(W, H),
                  mean=(0.0, 0.0, 0.0),
                  swapRB=True,
                  crop=False,
              )
              return ncnn.Mat(np.ascontiguousarray(blob[0], dtype=np.float32))

          def prep_numpy():
              chw = np.ascontiguousarray(
                  image[:, :, ::-1].transpose(2, 0, 1),
                  dtype=np.float32,
              )
              chw *= np.float32(1.0 / 255.0)
              return ncnn.Mat(chw)

          def infer(net, input_name, output_name, mat):
              ex = net.create_extractor()
              assert int(ex.input(input_name, mat)) == 0
              rc, output = ex.extract(output_name)
              assert int(rc) == 0
              return np.asarray(output, dtype=np.float32)

          def bench(fn, warmup=8, iterations=40):
              for _ in range(warmup):
                  fn()
              values = []
              for _ in range(iterations):
                  t0 = time.perf_counter()
                  fn()
                  values.append((time.perf_counter() - t0) * 1000.0)
              values.sort()
              return {
                  'mean_ms': statistics.fmean(values),
                  'median_ms': statistics.median(values),
                  'p95_ms': values[min(len(values) - 1, int(len(values) * 0.95))],
                  'min_ms': values[0],
              }

          if callable(getattr(ncnn, 'set_omp_dynamic', None)):
              ncnn.set_omp_dynamic(0)
          if callable(getattr(ncnn, 'set_omp_num_threads', None)):
              ncnn.set_omp_num_threads(4)
          if callable(getattr(ncnn, 'set_cpu_powersave', None)):
              try:
                  ncnn.set_cpu_powersave(0)
              except Exception:
                  pass

          net32, in32, out32 = configure_net(False)
          net16, in16, out16 = configure_net(True)

          preppers = {
              'current_from_pixels_normalize': prep_current,
              'opencv_blob': prep_blob,
              'numpy_chw': prep_numpy,
          }

          baseline = infer(net32, in32, out32, prep_current())
          report = {
              'host': 'github-actions-ubuntu-x86_64',
              'shape': [H, W],
              'prep': {},
              'full_fp32': {},
              'output_parity_fp32_vs_current': {},
          }

          for name, prepare in preppers.items():
              report['prep'][name] = bench(prepare, warmup=15, iterations=100)
              mat = prepare()
              candidate = infer(net32, in32, out32, mat)
              delta = np.abs(candidate - baseline)
              report['output_parity_fp32_vs_current'][name] = {
                  'max_abs': float(delta.max(initial=0.0)),
                  'mean_abs': float(delta.mean()) if delta.size else 0.0,
                  'same_shape': candidate.shape == baseline.shape,
              }
              report['full_fp32'][name] = bench(
                  lambda p=prepare: infer(net32, in32, out32, p()),
                  warmup=8,
                  iterations=30,
              )

          prepared = prep_current()
          report['extract_only_fp32'] = bench(
              lambda: infer(net32, in32, out32, prepared), warmup=10, iterations=40
          )
          report['extract_only_fp16_options'] = bench(
              lambda: infer(net16, in16, out16, prepared), warmup=10, iterations=40
          )
          out16_arr = infer(net16, in16, out16, prepared)
          fp16_delta = np.abs(out16_arr - baseline)
          report['output_parity_fp16_options'] = {
              'max_abs': float(fp16_delta.max(initial=0.0)),
              'mean_abs': float(fp16_delta.mean()) if fp16_delta.size else 0.0,
              'same_shape': out16_arr.shape == baseline.shape,
          }

          Path('../traffic_pipeline_25fps_benchmark.json').write_text(
              json.dumps(report, indent=2), encoding='utf-8'
          )
          print(json.dumps(report, indent=2))
          PY

      - name: Upload benchmark result
        uses: actions/upload-artifact@v4
        with:
          name: traffic-pipeline-25fps-benchmark
          path: traffic_pipeline_25fps_benchmark.json
          retention-days: 7
