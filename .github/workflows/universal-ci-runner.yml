name: Universal CI Runner - Free Actions for Private Repos

# Runs tests from ANY private repository on this public runner.
# Public GitHub-hosted runners are free for public repositories -> 0 private minutes consumed.
# No limits on repositories, test files, or test counts.
# The private source code is checked out ephemerally and never committed or published.
# After execution, an aggregated result (status + counts only, no code, no URLs) is
# posted back to the calling private repository via repository_dispatch.

on:
  workflow_dispatch:
    inputs:
      repository:
        description: 'Private repository (OWNER/REPO, e.g. oskar14156/belegfluss)'
        required: true
        default: 'oskar14156/belegfluss'
        type: string
      ref:
        description: 'Git branch, tag or commit SHA (default: main)'
        required: false
        default: 'main'
        type: string
      test_command:
        description: 'Test command (e.g. npm test, pytest). Default: auto = .ci/test-commands.txt manifest if present, else npm test / pytest detection'
        required: false
        default: 'auto'
        type: string
      install_command:
        description: 'Dependency install command (e.g. npm ci, pip install -r requirements.txt, none). Default: auto'
        required: false
        default: 'auto'
        type: string
      node_version:
        description: 'Node.js version'
        required: false
        default: '22'
        type: string
      python_version:
        description: 'Python version'
        required: false
        default: '3.12'
        type: string

  repository_dispatch:
    types: [run-private-tests]

permissions:
  contents: read

jobs:
  run-tests:
    name: Execute private repository tests
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ github.event.inputs.node_version || github.event.client_payload.node_version || '22' }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ github.event.inputs.python_version || github.event.client_payload.python_version || '3.12' }}

      - name: Validate authorization token
        shell: bash
        env:
          TOKEN: ${{ secrets.CI_BRIDGE_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$TOKEN" ]]; then
            echo "::error::Missing secret 'CI_BRIDGE_READ_TOKEN' in public repository."
            echo "Please add a GitHub Personal Access Token (PAT) with read access to the target private repo."
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "Authorization token verified and masked."
          mkdir -p "$GITHUB_WORKSPACE/.bridge"
          date +%s > "$GITHUB_WORKSPACE/.bridge/started_at"

      - name: Ephemeral checkout of private repository
        uses: actions/checkout@v5
        with:
          repository: ${{ github.event.inputs.repository || github.event.client_payload.repository }}
          ref: ${{ github.event.inputs.ref || github.event.client_payload.ref || 'main' }}
          token: ${{ secrets.CI_BRIDGE_READ_TOKEN }}
          persist-credentials: false
          path: private-repo

      - name: Install dependencies
        shell: bash
        working-directory: private-repo
        env:
          INSTALL_CMD: ${{ github.event.inputs.install_command || github.event.client_payload.install_command || 'auto' }}
        run: |
          set -euo pipefail
          echo "=== Dependency Installation ==="
          if [[ "$INSTALL_CMD" != "auto" && "$INSTALL_CMD" != "none" ]]; then
            echo "Running custom install command: $INSTALL_CMD"
            eval "$INSTALL_CMD"
          elif [[ "$INSTALL_CMD" == "auto" ]]; then
            if [[ -f "package-lock.json" ]]; then
              echo "Detected package-lock.json -> npm ci"
              npm ci --ignore-scripts --no-audit || npm install --no-audit --ignore-scripts
            elif [[ -f "package.json" ]]; then
              echo "Detected package.json -> npm install"
              npm install --no-audit --ignore-scripts
            fi
            if [[ -f "requirements.txt" ]]; then
              echo "Detected requirements.txt -> pip install"
              pip install -r requirements.txt
            fi
            if [[ ! -f "package.json" && ! -f "requirements.txt" ]]; then
              echo "No package manager manifest detected; skipping auto install."
            fi
          else
            echo "Dependency install skipped (none)."
          fi

      - name: Execute tests
        shell: bash
        working-directory: private-repo
        env:
          TEST_CMD: ${{ github.event.inputs.test_command || github.event.client_payload.test_command || 'auto' }}
        run: |
          set -uo pipefail
          echo "=== Test Suite Execution ==="
          mkdir -p "$GITHUB_WORKSPACE/.bridge"
          RUN_LOG="$GITHUB_WORKSPACE/.bridge/run.log"
          : > "$RUN_LOG"

          find_manifest() {
            local candidate
            for candidate in .ci/test-commands.txt ci/test-commands.txt .github/ci/test-commands.txt; do
              if [[ -f "$candidate" ]]; then
                echo "$candidate"
                return 0
              fi
            done
            return 1
          }

          run_one() {
            local cmd="$1"
            echo ""
            echo ">>> $cmd" | tee -a "$RUN_LOG"
            eval "$cmd" 2>&1 | tee -a "$RUN_LOG"
            local code=${PIPESTATUS[0]}
            if [[ $code -eq 0 ]]; then
              echo "<<< OK: $cmd" | tee -a "$RUN_LOG"
              return 0
            else
              echo "<<< FAILED (exit $code): $cmd" | tee -a "$RUN_LOG"
              return 1
            fi
          }

          FAILED_COMMANDS=()
          TOTAL_COMMANDS=0

          if [[ "$TEST_CMD" == "auto" || -z "$TEST_CMD" ]]; then
            if MANIFEST="$(find_manifest)"; then
              echo "Found test manifest in private repo: $MANIFEST (unlimited commands)"
              while IFS= read -r line || [[ -n "$line" ]]; do
                cmd="${line%%#*}"
                cmd="$(echo "$cmd" | xargs || true)"
                [[ -z "$cmd" ]] && continue
                TOTAL_COMMANDS=$((TOTAL_COMMANDS + 1))
                run_one "$cmd" || FAILED_COMMANDS+=("$cmd")
              done < "$MANIFEST"
            elif [[ -f "package.json" ]] && grep -q '"test"' package.json; then
              TOTAL_COMMANDS=1
              run_one "npm test" || FAILED_COMMANDS+=("npm test")
            elif command -v pytest >/dev/null 2>&1 && [[ -d "tests" || -f "pytest.ini" || -f "pyproject.toml" ]]; then
              TOTAL_COMMANDS=1
              run_one "pytest -v" || FAILED_COMMANDS+=("pytest -v")
            else
              echo "No manifest, package.json test script, or pytest project detected."
              TOTAL_COMMANDS=1
              run_one "node --test" || FAILED_COMMANDS+=("node --test")
            fi
          else
            TOTAL_COMMANDS=1
            run_one "$TEST_CMD" || FAILED_COMMANDS+=("$TEST_CMD")
          fi

          echo ""
          echo "=== Execution complete ==="
          echo "${#FAILED_COMMANDS[@]}" > "$GITHUB_WORKSPACE/.bridge/failed_commands"
          echo "$TOTAL_COMMANDS" > "$GITHUB_WORKSPACE/.bridge/total_commands"
          if [[ ${#FAILED_COMMANDS[@]} -gt 0 ]]; then
            echo "${#FAILED_COMMANDS[@]} command(s) failed:"
            printf '  - %s\n' "${FAILED_COMMANDS[@]}"
            exit 1
          fi
          echo "All test commands passed."

      - name: Notify private repository
        if: always()
        shell: bash
        env:
          TARGET_REPO: ${{ github.event.inputs.repository || github.event.client_payload.repository || '' }}
          TARGET_REF: ${{ github.event.inputs.ref || github.event.client_payload.ref || 'main' }}
          RESULT_TOKEN: ${{ secrets.CI_RESULT_TOKEN }}
        run: |
          set -uo pipefail
          # Aggregated result only: status + counts. No code, no test names, no URLs.
          BRIDGE_DIR="$GITHUB_WORKSPACE/.bridge"
          RUN_LOG="$BRIDGE_DIR/run.log"
          FAILED_CMDS=0
          TOTAL_CMDS=1
          if [[ -f "$BRIDGE_DIR/failed_commands" ]]; then FAILED_CMDS=$(cat "$BRIDGE_DIR/failed_commands"); fi
          if [[ -f "$BRIDGE_DIR/total_commands" ]]; then TOTAL_CMDS=$(cat "$BRIDGE_DIR/total_commands"); fi

          PASSED=0
          FAILED=0
          if [[ -f "$RUN_LOG" ]]; then
            # Sum across ALL test commands (each prints its own TAP/pytest summary).
            TAP_PASS=$(grep -E '^# pass [0-9]+' "$RUN_LOG" | grep -oE '[0-9]+' | awk '{s+=$1} END {print s+0}' || true)
            TAP_FAIL=$(grep -E '^# fail [0-9]+' "$RUN_LOG" | grep -oE '[0-9]+' | awk '{s+=$1} END {print s+0}' || true)
            if [[ "$TAP_PASS" != "0" || "$TAP_FAIL" != "0" ]]; then
              PASSED=$TAP_PASS
              FAILED=$TAP_FAIL
            else
              PY_PASS=$(grep -oE '[0-9]+ passed' "$RUN_LOG" | grep -oE '[0-9]+' | awk '{s+=$1} END {print s+0}' || true)
              PY_FAIL=$(grep -oE '[0-9]+ failed' "$RUN_LOG" | grep -oE '[0-9]+' | awk '{s+=$1} END {print s+0}' || true)
              PASSED=$PY_PASS
              FAILED=$PY_FAIL
            fi
          fi
          TOTAL=$((PASSED + FAILED)) || TOTAL=0

          if [[ "$FAILED_CMDS" -gt 0 ]]; then STATUS="failure"; else STATUS="success"; fi

          STARTED=0
          if [[ -f "$BRIDGE_DIR/started_at" ]]; then STARTED=$(cat "$BRIDGE_DIR/started_at"); fi
          NOW=$(date +%s)
          DURATION=$((NOW - STARTED)) || DURATION=0

          echo "Result: status=$STATUS passed=$PASSED failed=$FAILED commands=$TOTAL_CMDS/$FAILED_CMDS duration=${DURATION}s"

          if [[ -z "$TARGET_REPO" ]]; then
            echo "::warning::No target repository known; skipping result callback."
            exit 0
          fi
          if [[ -z "$RESULT_TOKEN" ]]; then
            echo "::warning::Missing secret 'CI_RESULT_TOKEN'; skipping result callback to $TARGET_REPO."
            echo "Add a PAT with Actions write access to the private repositories."
            exit 0
          fi
          echo "::add-mask::$RESULT_TOKEN"

          PAYLOAD=$(jq -n \
            --arg repo "$TARGET_REPO" \
            --arg ref "$TARGET_REF" \
            --arg status "$STATUS" \
            --argjson passed "$PASSED" \
            --argjson failed "$FAILED" \
            --argjson total "$TOTAL" \
            --argjson commands_total "$TOTAL_CMDS" \
            --argjson commands_failed "$FAILED_CMDS" \
            --argjson duration_seconds "$DURATION" \
            '{event_type:"ci-test-result", client_payload:{
              repository:$repo, ref:$ref, status:$status,
              passed:$passed, failed:$failed, total:$total,
              commands_total:$commands_total, commands_failed:$commands_failed,
              duration_seconds:$duration_seconds}}')

          HTTP_CODE=$(curl -sS -o /dev/null -w "%{http_code}" -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $RESULT_TOKEN" \
            "https://api.github.com/repos/${TARGET_REPO}/dispatches" \
            -d "$PAYLOAD" || echo "000")
          if [[ "$HTTP_CODE" == "204" ]]; then
            echo "Result callback delivered to $TARGET_REPO."
          else
            echo "::warning::Result callback to $TARGET_REPO returned HTTP $HTTP_CODE. The test result above is unaffected."
          fi

      - name: Generate run summary
        if: always()
        shell: bash
        env:
          INPUT_REPO: ${{ github.event.inputs.repository || github.event.client_payload.repository || '' }}
          INPUT_REF: ${{ github.event.inputs.ref || github.event.client_payload.ref || 'main' }}
          INPUT_CMD: ${{ github.event.inputs.test_command || github.event.client_payload.test_command || 'auto' }}
        run: |
          FAILED_CMDS=0
          if [[ -f "$GITHUB_WORKSPACE/.bridge/failed_commands" ]]; then FAILED_CMDS=$(cat "$GITHUB_WORKSPACE/.bridge/failed_commands"); fi
          if [[ "$FAILED_CMDS" -gt 0 ]]; then RESULT="failure"; else RESULT="success"; fi
          {
            echo "## Universal CI Runner - Test Execution"
            echo ""
            echo "| Parameter | Value |"
            echo "|---|---|"
            echo "| Target repository | \`$INPUT_REPO\` |"
            echo "| Ref / branch | \`$INPUT_REF\` |"
            echo "| Test command | \`$INPUT_CMD\` |"
            echo "| Result | **$RESULT** |"
            echo "| Billing | Public repository runner - **0 private minutes** |"
            echo ""
            echo "Private code was checked out ephemerally and wiped (\`rm -rf private-repo\`)."
            echo "Nothing from the private repository was committed, pushed, or uploaded as an artifact."
            echo "An aggregated result was posted back to the private repository (status + counts only)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Secure cleanup of private files
        if: always()
        shell: bash
        run: |
          rm -rf private-repo
          echo "Private workspace cleanly removed from runner."
