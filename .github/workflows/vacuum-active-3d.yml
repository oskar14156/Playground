name: Real Animated Remotion Three.js Vacuum
on:
  push:
    branches: [vacuum-v2-3d]
    paths:
      - "src/videos/vacuum3d/VacuumActive3D.tsx"
      - "src/Root.tsx"
      - ".github/workflows/vacuum-active-3d.yml"
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: vacuum-active-3d
  cancel-in-progress: true
jobs:
  animation-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci --no-audit --no-fund
      - name: Import verified voice and narration word timestamps
        uses: actions/download-artifact@v4
        with:
          name: vacuum-fox-full-low-quality-preview
          run-id: 40744763890
          github-token: ${{ github.token }}
          path: out/prior-narration
      - name: Stage soundtrack and timings
        run: |
          mkdir -p public/vacuum-motion
          cp out/prior-narration/public/vacuum-full/{words.json,vo.mp3} public/vacuum-motion/
          test -s public/vacuum-motion/words.json
      - name: Typecheck actual animated 3D
        run: npx tsc --noEmit
      - name: Render 8-second real 3D motion proof
        run: |
          mkdir -p out/vacuum-active
          npx remotion render vacuum-motion-sample out/vacuum-active/real-motion-sample.mp4 --scale=0.4 --crf=30 --gl=swangle --concurrency=2 --log=error
      - name: Extract proof frames
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg >/dev/null
          ffmpeg -y -loglevel error -i out/vacuum-active/real-motion-sample.mp4 -vf "fps=1,scale=150:-1,tile=4x2" -frames:v 1 out/vacuum-active/motion-contact.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-animated-threejs-vacuum-sample
          path: out/vacuum-active/
          if-no-files-found: warn
          retention-days: 7
