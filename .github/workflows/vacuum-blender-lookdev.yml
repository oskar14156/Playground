name: Vacuum cinematic Blender iterative look-dev
on:
  push:
    branches: [vacuum-v2-3d]
    paths:
      - "blender/vacuum_hero.py"
      - ".github/workflows/vacuum-blender-lookdev.yml"
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: vacuum-blender-lookdev
  cancel-in-progress: true
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify source syntax
        run: python3 -m py_compile blender/vacuum_hero.py
      - name: Install Blender runtime dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1-mesa-dri libxi6 libxkbcommon0 libxrender1 libxxf86vm1 libsm6 libxfixes3 libxkbcommon-x11-0 >/dev/null
      - uses: actions/cache@v4
        with:
          path: ~/blender
          key: blender-5.2.3-linux
      - name: Blender 5.2.3
        run: |
          if [ ! -x ~/blender/blender ]; then
            mkdir -p ~/blender
            curl --fail --location --silent --show-error https://download.blender.org/release/Blender5.2/blender-5.2.3-linux-x64.tar.xz | tar -xJ -C ~/blender --strip-components=1
          fi
          ~/blender/blender --version | head -1
      - name: Render three cinematic code-modeled preview frames
        run: |
          mkdir -p out/vacuum_blender
          ~/blender/blender -b -t 4 -P blender/vacuum_hero.py -- --res 44 --samples 20 --out out/vacuum_blender 2>&1 | tail -80
          test -s out/vacuum_blender/hero.png
          test -s out/vacuum_blender/cyclone.png
          test -s out/vacuum_blender/brush.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vacuum-blender-cinematic-stills
          path: out/vacuum_blender/
          retention-days: 7
          if-no-files-found: warn
