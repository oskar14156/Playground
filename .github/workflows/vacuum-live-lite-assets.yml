name: Optimized lightweight GLB for actual moving 3D v2
on:
  push:
    branches: [vacuum-v2-3d]
    paths:
      - ".github/workflows/vacuum-live-lite-assets.yml"
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1-mesa-dri libxi6 libxkbcommon0 libxrender1 libxxf86vm1 libsm6 libxfixes3 libxkbcommon-x11-0 >/dev/null
          python3 -m py_compile blender/fox_helmet_sample.py blender/vacuum_story_samples.py blender/vacuum_hero.py
      - uses: actions/cache@v4
        with:
          path: ~/blender
          key: blender-5.2.3-linux
      - name: Blender
        run: |
          if [ ! -x ~/blender/blender ]; then
            mkdir -p ~/blender
            curl -fsSL https://download.blender.org/release/Blender5.2/blender-5.2.3-linux-x64.tar.xz | tar -xJ -C ~/blender --strip-components=1
          fi
      - name: Export true 3D mesh LODs for low quality preview
        run: |
          mkdir -p out/lite
          ~/blender/blender -b -t 4 -P blender/fox_helmet_sample.py -- --export-model --export-lite --out out/lite > /tmp/fox.log 2>&1 || { tail -70 /tmp/fox.log; exit 1; }
          ~/blender/blender -b -t 4 -P blender/vacuum_story_samples.py -- --export-model --export-lite --out out/lite > /tmp/room.log 2>&1 || { tail -70 /tmp/room.log; exit 1; }
          ~/blender/blender -b -t 4 -P blender/vacuum_hero.py -- --export-model --export-lite --out out/lite > /tmp/vacuum.log 2>&1 || { tail -70 /tmp/vacuum.log; exit 1; }
          for asset in fox_helmet room vacuum_body; do test -s "out/lite/$asset.glb"; done
          du -h out/lite/*
      - uses: actions/upload-artifact@v4
        with:
          name: vacuum-live-3d-models-lite
          path: out/lite/*.glb
          retention-days: 7
