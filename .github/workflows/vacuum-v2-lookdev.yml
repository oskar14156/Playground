name: Vacuum V2 true Three.js look-dev
on:
  push:
    branches: [vacuum-v2-3d]
    paths:
      - "src/videos/vacuum3d/**"
      - "src/Root.tsx"
      - "tsconfig.json"
      - ".github/workflows/vacuum-v2-lookdev.yml"
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: vacuum-v2-3d
  cancel-in-progress: true
jobs:
  real-3d:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci --no-audit --no-fund
      - name: Validate all Three.js/React/Remotion TypeScript
        run: npx tsc --noEmit
      - name: Render five true 3D camera and material tests
        run: |
          mkdir -p out/vacuum3d
          npx remotion still vacuum-3d-hero out/vacuum3d/01_apartment.png --frame=12 --scale=0.5 --gl=swangle --log=error
          npx remotion still vacuum-3d-hero out/vacuum3d/02_impeller.png --frame=42 --scale=0.5 --gl=swangle --log=error
          npx remotion still vacuum-3d-hero out/vacuum3d/03_cyclone.png --frame=72 --scale=0.5 --gl=swangle --log=error
          npx remotion still vacuum-3d-hero out/vacuum3d/04_brush.png --frame=102 --scale=0.5 --gl=swangle --log=error
          npx remotion still vacuum-3d-hero out/vacuum3d/05_punchline.png --frame=132 --scale=0.5 --gl=swangle --log=error
          ffmpeg -y -v error -framerate 1 -pattern_type glob -i "out/vacuum3d/0*.png" -vf "scale=240:-1,tile=5x1" -frames:v 1 out/vacuum3d/contact.jpg
      - name: Render 5-second real 3D camera-motion proof
        run: |
          npx remotion render vacuum-3d-motion out/vacuum3d/threejs-motion-test.mp4 --scale=0.5 --crf=28 --gl=swangle --concurrency=2 --log=error
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 out/vacuum3d/threejs-motion-test.mp4
          ffmpeg -y -v error -i out/vacuum3d/threejs-motion-test.mp4 -vf "fps=3,scale=280:-1,tile=5x3" -frames:v 1 out/vacuum3d/motion-check.jpg
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vacuum-v2-real-3d-lookdev
          path: out/vacuum3d/
          if-no-files-found: warn
          retention-days: 7
