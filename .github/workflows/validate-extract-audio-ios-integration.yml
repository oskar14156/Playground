name: Validate ExtractAudio iOS Integration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          repository: Persie0/ExtractAudioFromVideo
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          path: target
      - name: Build iOS simulator
        working-directory: target/swift-ios
        run: |
          set -euo pipefail
          xcodebuild \
            -project ExtractAudioFromVideo.xcodeproj \
            -scheme ExtractAudioFromVideo \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .derived \
            ARCHS=arm64 \
            EXCLUDED_ARCHS=x86_64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            EXCLUDED_ARCHS=x86_64 \
            build
