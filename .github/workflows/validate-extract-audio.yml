# validate-app-head: 3fdd3d04046bf5c6d75be266edb87d64db433943
name: Validate ExtractAudioFromVideo

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          repository: Persie0/ExtractAudioFromVideo
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          path: target

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5

      - name: Verify source dependency policy
        working-directory: target
        run: bash scripts/verify_media_licensing.sh

      - name: Build Android
        working-directory: target/kotlin-android
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Scan Android FFmpeg binaries
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t libs < <(find kotlin-android/app/build -type f \(             -name 'libavcodec.so' -o -name 'libavformat.so' -o             -name 'libavutil.so' -o -name 'libavfilter.so' -o             -name 'libswresample.so' -o -name 'libswscale.so'           \))
          test "${#libs[@]}" -gt 0
          for lib in "${libs[@]}"; do
            echo "Inspecting $lib"
            if strings "$lib" | grep -E --               '--enable-gpl([ =]|$)|--enable-nonfree([ =]|$)|--enable-libx264([ =]|$)|--enable-libx265([ =]|$)|--enable-libxvid([ =]|$)|--enable-libvidstab([ =]|$)|--enable-librubberband([ =]|$)'; then
              echo "ERROR: forbidden GPL/nonfree FFmpeg flag in $lib" >&2
              exit 1
            fi
          done

  ios:
    needs: android
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          repository: Persie0/ExtractAudioFromVideo
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          path: target

      - name: Verify source dependency policy
        working-directory: target
        run: bash scripts/verify_media_licensing.sh

      - name: Run iOS core tests
        working-directory: target/swift-ios
        run: swift test

      - name: Build iOS arm64 simulator
        working-directory: target/swift-ios
        run: |
          set -euo pipefail
          xcodebuild             -project ExtractAudioFromVideo.xcodeproj             -scheme ExtractAudioFromVideo             -configuration Debug             -sdk iphonesimulator             -destination 'generic/platform=iOS Simulator'             -derivedDataPath .derived             ARCHS=arm64             EXCLUDED_ARCHS=x86_64             ONLY_ACTIVE_ARCH=YES             CODE_SIGNING_ALLOWED=NO             build

      - name: Scan resolved iOS FFmpeg binaries
        working-directory: target/swift-ios
        shell: bash
        run: |
          set -euo pipefail
          ROOT=".derived/SourcePackages/artifacts"
          test -d "$ROOT"
          found=0
          while IFS= read -r binary; do
            if file "$binary" | grep -q 'Mach-O'; then
              case "$(basename "$binary")" in
                ffmpegkit|libavcodec|libavdevice|libavfilter|libavformat|libavutil|libswresample|libswscale)
                  found=$((found + 1))
                  echo "Inspecting $binary"
                  if ! otool -l "$binary" | grep -q 'LC_ID_DYLIB'; then
                    echo "ERROR: expected dynamic FFmpeg library: $binary" >&2
                    exit 1
                  fi
                  if strings "$binary" | grep -E --                     '--enable-gpl([ =]|$)|--enable-nonfree([ =]|$)|--enable-libx264([ =]|$)|--enable-libx265([ =]|$)|--enable-libxvid([ =]|$)|--enable-libvidstab([ =]|$)|--enable-librubberband([ =]|$)'; then
                    echo "ERROR: forbidden GPL/nonfree FFmpeg flag in $binary" >&2
                    exit 1
                  fi
                  ;;
              esac
            fi
          done < <(find "$ROOT" -type f)
          test "$found" -ge 8
