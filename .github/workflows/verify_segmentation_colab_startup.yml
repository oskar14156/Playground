name: Verify segmentation Colab startup visibility

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout resistor_model fix branch
        uses: actions/checkout@v4
        with:
          repository: Persie0/resistor_model
          ref: fix/segmentation-colab-startup-progress

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pytest
        run: python -m pip install -q pytest

      - name: Run Colab tests
        run: pytest -q tests/test_colab_segmentation.py

      - name: Validate notebook JSON and heartbeat
        run: |
          python - <<'PY'
          import importlib.util
          import json
          import pathlib
          import sys
          import tempfile

          json.load(open('colab/train_resistor_segmentation_colab.ipynb', encoding='utf-8'))
          script = pathlib.Path('colab/train_resistor_segmentation_colab.py')
          spec = importlib.util.spec_from_file_location('seg_colab', script)
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          with tempfile.TemporaryDirectory() as td:
              source = pathlib.Path(td) / 'drive-last.pt'
              destination = pathlib.Path(td) / 'local-last.pt'
              source.write_bytes(b'x' * (9 * 1024 * 1024))
              assert mod.stage_resume_checkpoint(source, destination) == destination
              assert destination.stat().st_size == source.stat().st_size
          mod.run_with_heartbeat(
              [sys.executable, '-c', 'import time; time.sleep(1.3)'],
              heartbeat_seconds=1,
          )
          print('startup visibility smoke passed')
          PY
