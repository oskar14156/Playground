name: Video Compressor native review

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out private VideoCompressor without persisting token
        uses: actions/checkout@v4
        with:
          repository: Persie0/VideoCompressor
          ref: main
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: source
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK without obsolete SDK tools package
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Android unit tests
        working-directory: source/android
        run: ./gradlew :app:testDebugUnitTest --stacktrace --no-daemon
      - name: Android debug APK
        working-directory: source/android
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

  ios:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out private VideoCompressor without persisting token
        uses: actions/checkout@v4
        with:
          repository: Persie0/VideoCompressor
          ref: main
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: source
      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: source/ios
        run: xcodegen generate
      - name: Build iOS Simulator
        working-directory: source/ios
        run: xcodebuild -project VideoCompressor.xcodeproj -scheme VideoCompressor -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Run iOS unit tests
        working-directory: source/ios
        run: |
          set -euo pipefail
          xcrun simctl list devices available
          xcodebuild -project VideoCompressor.xcodeproj -scheme VideoCompressor -configuration Debug -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' CODE_SIGNING_ALLOWED=NO test
