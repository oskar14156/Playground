name: Video Upscaler Android build (private repo)
# Runtime parity follow-up: AV1/VP9 guards, multi-audio and 90-degree fixture tests
# Final reviewed Android MOV/LGPL license UI and package integration
# Final reviewed Android MOV/LGPL license UI and package integration
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout private app into runner
        uses: actions/checkout@v4
        with:
          repository: Persie0/video_upscaler_android
          ref: main
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: appsrc
      - name: Checkout original macOS model weights for parity verification
        uses: actions/checkout@v4
        with:
          repository: Persie0/video_upscaler
          ref: main
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: macsrc
      - name: Verify model-weight parity and dimensions
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for detail in ('s', 'm'):
              for profile in ('rl', 'an', '3d'):
                  filename = f'cnn-2x-{detail}-{profile}.json'
                  original = Path('macsrc/Sources/VideoUpscalerApp/Resources/Weights') / filename
                  android = Path('appsrc/app/src/main/assets/models') / filename
                  assert original.read_bytes() == android.read_bytes(), f'Weight mismatch: {filename}'
                  model = json.loads(android.read_text())['layers']
                  expected = ({'conv2d_tf':144, 'conv2d_1_tf':288, 'conv2d_2_tf':288,
                              'conv2d_last_tf':288} if detail == 's' else
                              {'conv2d_tf':144, **{f'conv2d_{i}_tf':288 for i in range(1,7)},
                               **{name:224 for name in ['conv2d_7_tf','conv2d_7_tf1','conv2d_7_tf2']}})
                  for layer,size in expected.items():
                      assert len(model[layer]['weights']) == size
                      assert len(model[layer]['bias']) == 4
                  print(f'{filename}: exact match')
          for name in ('original','upscaled'):
              reference = Path(f'macsrc/Sources/VideoUpscalerApp/Resources/Assets.xcassets/Example{name.capitalize()}.imageset/example-{name}.png')
              android = Path('appsrc/app/src/main/assets/examples') / f'{name}.png'
              assert reference.read_bytes() == android.read_bytes(), f'Image mismatch: {name}'
              print(f'{name}.png: exact match')
          icon = Path('macsrc/Design/AppIcon.png')
          port = Path('appsrc/app/src/main/res/drawable-nodpi/app_icon.png')
          assert icon.read_bytes() == port.read_bytes(), 'Original app icon mismatch'
          print('AppIcon.png: exact match')
          PY
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Ensure Android 35 platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Validate OpenGL ES shaders
        working-directory: appsrc
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq glslang-tools
          for shader in app/src/main/assets/shaders/*.comp; do
            glslangValidator -S comp "$shader"
          done
          glslangValidator -S vert app/src/main/assets/shaders/quad.vert
          for shader in app/src/main/assets/shaders/*.frag; do
            glslangValidator -S frag "$shader"
          done
      - name: Validate physical-device and Metal quality tools
        working-directory: appsrc
        run: |
          bash -n scripts/verify_physical_android.sh
          python3 -m py_compile scripts/compare_metal_android.py
      - name: Build and test Android
        working-directory: appsrc
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest :app:lintDebug --no-daemon --stacktrace
      - name: Verify exact Android package name in built APK
        working-directory: appsrc
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep -F "package: name='at.persie0.VideoUpscaler'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree "$apk" AndroidManifest.xml | grep -F "at.persie0.VideoUpscaler"
      - name: Verify embedded Android RevenueCat public key
        working-directory: appsrc
        run: |
          set -euo pipefail
          config=$(find app/build/generated/source/buildConfig -type f -name BuildConfig.java | head -1)
          test -n "$config"
          grep -Fq 'goog_qAYxboiOcgmerORFBvFRaKuoBnf' "$config"
          grep -Fq 'at.persie0.VideoUpscaler' "$config"
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-upscaler-android-test-reports
          path: appsrc/app/build/reports/tests/
          if-no-files-found: ignore
