# Final reviewed Android MOV/LGPL license UI and package integration
name: Video Upscaler Android device pipeline smoke
# Android-native rotation fixture, dual AAC tracks, and actual GPU media processing
# Verify cancellation, pause handling, 7-layer Balanced CNN, audio and rotation on Android emulator
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  emulator-video-export:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Persie0/video_upscaler_android
          ref: main
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: appsrc
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Generate tiny offline H.264 and AAC fixture
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -qq -y ffmpeg
          fi
          mkdir -p appsrc/app/src/androidTest/assets
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc2=size=64x64:rate=6 \
            -f lavfi -i sine=frequency=1000:sample_rate=44100 \
            -t 1.2 -c:v libx264 -preset ultrafast -profile:v baseline -level 3.0 \
            -pix_fmt yuv420p -r 6 -c:a aac -b:a 64k -ac 1 -shortest \
            -movflags +faststart -y appsrc/app/src/androidTest/assets/fixture.mp4
          ffmpeg -hide_banner -loglevel error \
            -i appsrc/app/src/androidTest/assets/fixture.mp4 \
            -f lavfi -i sine=frequency=530:sample_rate=44100 \
            -map 0:v:0 -map 0:a:0 -map 1:a:0 -c:v copy -c:a aac \
            -b:a 64k -t 1.2 -y appsrc/app/src/androidTest/assets/fixture-dual-audio.mp4
          ffmpeg -hide_banner -loglevel error \
            -i appsrc/app/src/androidTest/assets/fixture.mp4 -map 0 -c copy \
            -y appsrc/app/src/androidTest/assets/fixture-mkv.mkv
          ffmpeg -hide_banner -loglevel error \
            -i appsrc/app/src/androidTest/assets/fixture.mp4 -map 0 -c copy \
            -f flv -y appsrc/app/src/androidTest/assets/fixture-flv.flv
          ffprobe -hide_banner -loglevel error -show_streams \
            appsrc/app/src/androidTest/assets/fixture.mp4 | head -45
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run end-to-end emulator export
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swangle -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          working-directory: appsrc
          script: gradle :app:connectedDebugAndroidTest --no-daemon --stacktrace
      - name: Upload instrumentation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-video-upscaler-emulator-test-reports
          path: |
            appsrc/app/build/outputs/androidTest-results/connected/
            appsrc/app/build/reports/androidTests/connected/
          if-no-files-found: ignore
