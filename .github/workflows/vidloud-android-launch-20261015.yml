name: VidLoud Android launch verification (privacy-safe)
on:
  push:
    branches:
      - ci/vidloud-android-launch-20261015
    paths:
      - .github/workflows/vidloud-android-launch-20261015.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-and-android:
    name: Android tests + debug/release compilation (no public artifacts)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      # ubuntu-latest already provides sdkmanager; setup-android@v3 tries to
      # install removed legacy package "tools" and fails on 2026 images.
      - name: Install Android SDK 36
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDK_MANAGER=$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -r | head -1)
          if [[ -z "$SDK_MANAGER" ]]; then
            echo "::error::No Android sdkmanager on the runner"
            exit 1
          fi
          yes | "$SDK_MANAGER" --licenses >/dev/null 2>&1 || true
          if "$SDK_MANAGER" --sdk_root="$SDK_ROOT" "platforms;android-36" "build-tools;36.0.0" >/dev/null 2>&1; then
            echo "PASS: Android SDK 36"
          else
            echo "::error::Android SDK 36 install failed"
            exit 1
          fi
      - name: Checkout private VidLoud in ephemeral runner only
        uses: actions/checkout@v4
        with:
          repository: oskar14156/VidLoud
          # Test the exact private source revision, not a moving branch head.
          ref: bc53b383c4d39dbe113c9e9d2bf7725eab2cf013
          token: ${{ secrets.CI_BRIDGE_READ_TOKEN }}
          persist-credentials: false
          path: private-source
          clean: true
      - name: Install dependencies without emitting private code or package logs
        shell: bash
        working-directory: private-source
        run: |
          set -euo pipefail
          if npm ci --ignore-scripts --no-audit > /tmp/vidloud-install.log 2>&1; then
            echo "PASS: dependencies"
          else
            echo "::error::Dependencies did not install (private diagnostics suppressed)"
            exit 1
          fi
          rm -f /tmp/vidloud-install.log
      - name: Run secret-free quality tests, Play listing checks, Android builds
        shell: bash
        working-directory: private-source
        run: |
          set -euo pipefail
          bash scripts/ci-private-android.sh
          # NEVER upload or publish Android APK/AAB or private source as artifacts.
